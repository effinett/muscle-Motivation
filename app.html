<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Muscle Motivation – Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js" integrity="sha384-ouAVEJVCMsf8Svzn+BwqbaBhxBEA0xgeVBhHnxmWd+Wqyv18yhWCQwGegFD/OHLq" crossorigin="anonymous"></script>
  <style>
    :root {
      --red:          #B1121B;
      --red-muted:    rgba(177,18,27,0.12);
      --red-border:   rgba(177,18,27,0.28);
      --bg:           #080808;
      --surface-1:    #0d0d0d;
      --surface-2:    #131313;
      --surface-3:    #1a1a1a;
      --border-1:     #1c1c1c;
      --border-2:     #252525;
      --border-3:     #2f2f2f;
      --text:         #ffffff;
      --text-2:       #a0a0a0;
      --text-muted:   #555555;
      --green:        #22c55e;
      --amber:        #e0a800;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Auth gate */
    #authGate {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
    }
    #authGate img { width: 72px; margin-bottom: 16px; opacity: 0.6; }
    #authGate p {
      color: var(--text-muted); font-size: 11px;
      letter-spacing: 2.5px; text-transform: uppercase;
    }

    /* Header — header / .header-logo now live in app-shell.css */
    .header-profile {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; margin-right: -10px;
      color: var(--text-2); text-decoration: none;
      border-radius: 50%;
      transition: color 0.2s, background 0.2s;
    }
    .header-profile:hover { color: var(--text); background: var(--surface-2); }
    .header-profile:focus-visible { outline: 2px solid var(--mm-accent); outline-offset: 2px; }

    /* Bottom padding = the page's own breathing room + the shared app-shell
       clearance (nav height + home indicator). See app-shell.css. */
    .container {
      max-width: 680px; margin: 0 auto;
      padding: 20px 16px calc(24px + var(--mm-bottom-clearance, 0px));
    }

    /* ── Shared section rhythm ──────────────────────────────────────────
       Hierarchy comes from typography, spacing and density — not from a
       stack of equally-weighted cards. */
    .eyebrow {
      font-size: 10px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--text-muted);
    }
    .num {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.5px; line-height: 1;
    }

    /* ── A · TODAY — the one thing that matters now ─────────────────────── */
    .today {
      padding: 4px 0 16px;
      border-bottom: 1px solid var(--border-1);
      margin-bottom: 16px;
    }
    .today-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(38px, 10vw, 54px);
      line-height: 1.02; letter-spacing: 1px;
      text-transform: uppercase;
      margin: 6px 0 0;
    }
    .today-status {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 13px; font-weight: 600; color: var(--text-2);
      margin-top: 8px;
    }
    .today-status .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted); flex-shrink: 0;
    }
    .today-status.is-done .dot { background: var(--mm-success); }
    .today-status.is-live .dot { background: var(--mm-accent); }
    .cta {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 56px; margin-top: 20px;
      padding: 15px 20px;
      background: var(--mm-accent); border: none; border-radius: 12px;
      color: var(--mm-accent-contrast); text-align: center; text-decoration: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 21px; letter-spacing: 2.5px; text-transform: uppercase;
      cursor: pointer; transition: opacity 0.2s;
    }
    .cta:hover { opacity: 0.88; }
    .cta:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .today-alt {
      display: inline-flex; align-items: center; gap: 5px; min-height: 44px;
      margin-top: 2px; font-size: 13px; font-weight: 600;
      color: var(--text-2); text-decoration: none;
      background: none; border: none; cursor: pointer;
      font-family: 'Barlow', sans-serif;
    }
    /* Reads as a control rather than a stray caption. */
    .today-alt::after { content: '›'; font-size: 16px; line-height: 1; color: var(--text-muted); }
    .today-alt:hover { color: var(--text); }
    .today-alt:focus-visible { outline: 2px solid var(--mm-accent); outline-offset: 2px; border-radius: 6px; }

    /* ── Tappable rows / tiles ──────────────────────────────────────────── */
    .row {
      display: block; width: 100%;
      padding: 15px 16px; margin-bottom: 10px;
      background: var(--surface-1);
      border: 1px solid var(--border-2);
      border-radius: 12px;
      text-decoration: none; color: var(--text);
      transition: border-color 0.2s;
    }
    .row:hover { border-color: var(--border-3); }
    .row:focus-visible { outline: 2px solid var(--mm-accent); outline-offset: 2px; }
    .row-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px;
    }
    .row-value { font-size: 15px; font-weight: 600; white-space: nowrap; }
    .row-value .sub { color: var(--text-muted); font-weight: 600; font-size: 13px; }

    /* Slim progress track, used by This Week and Nutrition */
    .track {
      height: 5px; margin-top: 11px;
      background: var(--surface-3); border-radius: 3px; overflow: hidden;
    }
    .fill {
      height: 100%; border-radius: 3px;
      background: var(--mm-accent);
      transition: width 0.3s ease;
    }
    .fill.good { background: var(--mm-success); }
    .fill.over { background: var(--mm-warning); }

    /* ── B · THIS WEEK ──────────────────────────────────────────────────── */
    .week-value { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.5px; }
    .week-meta { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 8px; }
    .week-meta:empty { display: none; }

    /* ── C · NUTRITION ──────────────────────────────────────────────────── */
    .nut { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
    .nut-num { font-size: 42px; color: var(--mm-success); }
    .nut-num.over { color: var(--mm-warning); }
    .nut-unit { font-size: 13px; font-weight: 700; color: var(--text-2); letter-spacing: 0.5px; }
    .nut-macro {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; margin-top: 14px; font-size: 13px; font-weight: 600;
    }
    .nut-macro .label { color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .nut-empty { font-size: 14px; color: var(--text-2); margin-top: 4px; }

    /* ── D · FOCUS — the permanent Coach seat ───────────────────────────── */
    .focus {
      display: flex; align-items: flex-start; gap: 11px;
      padding: 14px 16px; margin-bottom: 10px;
      background: var(--surface-1);
      border: 1px solid var(--border-2);
      border-left: 2px solid var(--text-muted);
      border-radius: 12px;
    }
    .focus[data-tone="behind"] { border-left-color: var(--mm-warning); }
    .focus[data-tone="good"]   { border-left-color: var(--mm-success); }
    .focus-icon { color: var(--text-muted); flex-shrink: 0; margin-top: 1px; }
    .focus-body { min-width: 0; }
    .focus-text { font-size: 14px; font-weight: 600; color: var(--text); margin-top: 3px; }

    /* ── E · PROGRESS ───────────────────────────────────────────────────── */
    .prog-value { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.5px; }
    .prog-delta { font-size: 13px; font-weight: 600; color: var(--text-2); }
    .prog-delta.down { color: var(--mm-success); }
    .prog-delta.up   { color: var(--mm-warning); }

    /* ── F · SECONDARY ──────────────────────────────────────────────────── */
    .secondary {
      display: flex; gap: 10px; margin-top: 18px;
    }
    .secondary-btn {
      flex: 1; display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; min-height: 48px; padding: 12px;
      background: transparent; border: 1px solid var(--border-2);
      border-radius: 10px; color: var(--text-2);
      font-family: 'Barlow', sans-serif; font-size: 12px; font-weight: 700;
      letter-spacing: 1.2px; text-transform: uppercase;
      text-decoration: none; cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .secondary-btn:hover { border-color: var(--border-3); color: var(--text); }
    .secondary-btn:focus-visible { outline: 2px solid var(--mm-accent); outline-offset: 2px; }

    /* ── Log / Edit Weight modal ────────────────────────────────────────
       Markup comes from weight.js (wlModalMarkup) and uses these shared class
       names, so Home must style them even though it defines no modal of its
       own. Without these rules the modal renders inline and always-visible. */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.82); backdrop-filter: blur(6px);
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--surface-1); border: 1px solid var(--border-2);
      border-radius: 14px; padding: 22px 18px;
      width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1.5px; }
    .modal-close {
      min-width: 44px; min-height: 44px; background: none; border: none;
      color: var(--text-muted); font-size: 18px; cursor: pointer;
    }
    .modal-close:hover { color: var(--text); }
    .modal-close:focus-visible { outline: 2px solid var(--mm-accent); outline-offset: 2px; border-radius: 6px; }
    .field-group { margin-bottom: 14px; }
    .field-label {
      display: block; font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 6px;
    }
    .field-optional { font-weight: 400; text-transform: none; letter-spacing: 0; }
    .field-group input {
      width: 100%; min-height: 44px; padding: 10px 12px;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 8px; color: var(--text);
      font-family: 'Barlow', sans-serif; font-size: 16px; appearance: none;
    }
    .field-group input:focus-visible {
      outline: 2px solid var(--mm-accent); outline-offset: 1px; border-color: var(--mm-accent);
    }
    .btn-calc {
      width: 100%; min-height: 48px; margin-top: 8px; padding: 12px;
      background: var(--mm-accent); border: none; border-radius: 8px; color: var(--mm-accent-contrast);
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px;
      cursor: pointer;
    }
    .btn-calc:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    /* .toast now lives in app-shell.css */

    @media (prefers-reduced-motion: reduce) {
      .cta, .row, .fill, .secondary-btn, .header-profile { transition: none; }
    }

    @media (max-width: 480px) {
      .container { padding: 16px 12px calc(24px + var(--mm-bottom-clearance, 0px)); }
    }
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#121011">
  <meta name="application-name" content="Muscle Motivation">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Muscle Motivation">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script src="sw-register.js" defer></script>
  <script src="pwa-install.js" defer></script>
  <script src="pwa-install-ui.js" defer></script>
  <script src="pwa-install-register.js" defer></script>
  <script src="app-nav.js" defer></script>
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="safe-area.css">
</head>
<body>

<!-- Auth gate -->
<div id="authGate">
  <img src="logow.png" alt="Muscle Motivation">
  <p>Loading...</p>
</div>

<!-- Dashboard -->
<div id="appContent" style="display:none;">

  <a class="mm-skip-link" href="#mmMain">Skip to content</a>

  <header>
    <a class="header-logo" href="app.html">
      <img src="logow.png" alt="Muscle Motivation">
      <span>Muscle Motivation</span>
    </a>
    <a class="header-profile" href="profile.html" aria-label="Profile and settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>
      </svg>
    </a>
  </header>

  <main class="container" id="mmMain" tabindex="-1">
    <h1 class="mm-visually-hidden">Dashboard</h1>

    <!-- A · TODAY -->
    <section class="today" aria-labelledby="todayLabel">
      <div class="eyebrow" id="todayLabel">Today</div>
      <div class="today-title" id="todayTitle">&nbsp;</div>
      <div class="today-status" id="todayStatus" hidden><span class="dot"></span><span id="todayStatusText"></span></div>
      <a class="cta" id="todayCta" href="workout.html" hidden></a>
      <button class="today-alt" id="todayAlt" hidden></button>
    </section>

    <!-- B · THIS WEEK -->
    <a class="row" id="weekRow" href="workout-history.html" aria-labelledby="weekLabel weekValue">
      <div class="row-head">
        <span class="eyebrow" id="weekLabel">This Week</span>
        <span class="week-value" id="weekValue">—</span>
      </div>
      <div class="track" id="weekTrack" hidden><div class="fill" id="weekFill" style="width:0"></div></div>
      <div class="week-meta" id="weekMeta"></div>
    </a>

    <!-- C · NUTRITION -->
    <a class="row" id="nutRow" href="nutrition.html" aria-labelledby="nutLabel nutSummary">
      <div class="row-head">
        <span class="eyebrow" id="nutLabel">Nutrition</span>
        <span class="row-value" id="nutTarget"></span>
      </div>
      <div id="nutBody">
        <div class="nut-empty">Loading&hellip;</div>
      </div>
      <span class="mm-visually-hidden" id="nutSummary"></span>
    </a>

    <!-- D · FOCUS (deterministic; hidden when there is no real evidence) -->
    <section class="focus" id="focusRow" hidden aria-labelledby="focusLabel">
      <span class="focus-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" focusable="false">
          <circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>
        </svg>
      </span>
      <div class="focus-body">
        <div class="eyebrow" id="focusLabel">Focus</div>
        <p class="focus-text" id="focusText"></p>
      </div>
    </section>

    <!-- E · PROGRESS -->
    <a class="row" id="progRow" href="weight-history.html" aria-labelledby="progLabel progValue">
      <div class="row-head">
        <span class="eyebrow" id="progLabel">Progress</span>
        <span class="prog-value" id="progValue">—</span>
      </div>
      <div class="week-meta" id="progMeta"></div>
    </a>

    <!-- F · SECONDARY -->
    <div class="secondary">
      <button class="secondary-btn" onclick="wlOpenModal()">Log Weight</button>
      <a class="secondary-btn" href="profile.html">Profile</a>
    </div>

  </main>

  <!-- Shared primary navigation (markup owned by app-nav.js) -->
  <div id="appNavMount"></div>
</div><!-- /appContent -->

<!-- Log / Edit Weight Modal (markup injected by weight.js) -->
<div id="weightModalMount"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js" integrity="sha384-3wY11tldQ5+yWqAvmTN4XtQvnjoTva0cV15O/O/O5NTtp0ivVopSzLOzsVXWZse9" crossorigin="anonymous"></script>
<script src="supabase.js"></script>
<script src="schedules.js"></script>
<script src="program-state.js"></script>
<script src="weight.js"></script>
<script src="metrics.js"></script>
<script src="snapshot.js"></script>
<script src="dashboard-model.js"></script>
<script>

  // Home consumes SHARED state only: snapshot.js supplies training, nutrition,
  // weight and body-composition domain state; program-state.js supplies the
  // active program/session; dashboard-model.js decides priority and fallbacks.
  // This page owns no fitness intelligence and performs no per-metric queries.

  var currentProfile = null;
  var currentUserId  = null;
  var inProgressId   = null;

  document.getElementById('weightModalMount').innerHTML = wlModalMarkup();

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 3000);
  }

  window.addEventListener('load', function () {
    (async () => {
      try {
        var session = await requireAuth();
        var user = session.user;
        currentUserId = user.id;
        var profile = await getProfile(user.id);
        currentProfile = profile;

        if (!profile || !profile.onboarding_complete) {
          window.location.href = 'onboarding.html';
          return;
        }

        // PWA install onboarding (Phase 4.3.3): reaching the personalized
        // dashboard after onboarding is an approved meaningful-value moment.
        // Narrow signal only — no logged/user content is included.
        try { window.dispatchEvent(new CustomEvent('mm:pwa-value', { detail: { type: 'dashboard' } })); } catch (e) {}

        document.getElementById('authGate').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        lucide.createIcons();

        await renderDashboard(user.id);

        if (new URLSearchParams(window.location.search).get('purchase') === 'success') {
          showToast('Purchase successful — your program is now unlocked.');
          history.replaceState(null, '', window.location.pathname);
        }
      } catch (err) {
        console.error('Dashboard error:', err);
        window.location.href = 'auth.html';
      }
    })();
  });

  // ONE pass: every section is derived from the same shared state.
  async function renderDashboard(userId) {
    var results = await Promise.all([
      buildUserSnapshot(userId, { profile: currentProfile }).catch(function (e) {
        console.error('snapshot:', e); return null;
      }),
      loadProgramState(userId),
      loadInProgress(userId),
    ]);

    var model = DashboardModel.buildDashboardModel({
      snapshot: results[0],
      profile: currentProfile,
      program: results[1],
      inProgressWorkout: results[2],
      hourOfDay: new Date().getHours(),
    });

    renderToday(model.today);
    renderWeek(model.week);
    renderNutrition(model.nutrition);
    renderFocus(model.focus);
    renderProgress(model.progress);
  }

  async function loadProgramState(userId) {
    try {
      var owned = await pgLoadOwnedPrograms(userId);
      var activeSlug = await pgResolveActive(userId, currentProfile, owned);
      if (!activeSlug) return owned.length > 1 ? { needsSelection: true } : null;
      return await pgResolveSession(userId, activeSlug, currentProfile.training_days);
    } catch (e) {
      console.error('loadProgramState:', e);
      return null;
    }
  }

  async function loadInProgress(userId) {
    try {
      // Most recent unfinished workout, regardless of age — an unfinished
      // session must never become an invisible orphan.
      var res = await supabaseClient
        .from('workouts').select('id, name')
        .eq('user_id', userId).eq('completed', false)
        .order('created_at', { ascending: false }).limit(1).maybeSingle();
      if (!res.data) return null;
      inProgressId = res.data.id;
      return res.data;
    } catch (e) {
      console.error('loadInProgress:', e);
      return null;
    }
  }

  // ── A · TODAY ────────────────────────────────────────────────────────
  function renderToday(t) {
    document.getElementById('todayTitle').textContent = t.title;

    var statusEl = document.getElementById('todayStatus');
    if (t.status) {
      document.getElementById('todayStatusText').textContent = t.status;
      statusEl.className = 'today-status' +
        (t.state === 'done' ? ' is-done' : t.state === 'resume' ? ' is-live' : '');
      statusEl.hidden = false;
    } else {
      statusEl.hidden = true;
    }

    var cta = document.getElementById('todayCta');
    if (t.cta) {
      cta.textContent = t.cta.label;
      cta.href = t.cta.href;
      cta.hidden = false;
    } else {
      cta.hidden = true;
    }

    var alt = document.getElementById('todayAlt');
    if (t.secondary) {
      alt.textContent = t.secondary.label;
      alt.hidden = false;
      alt.onclick = t.secondary.action === 'discard'
        ? discardSession
        : function () { window.location.href = t.secondary.href; };
    } else {
      alt.hidden = true;
    }
  }

  // ── B · THIS WEEK ────────────────────────────────────────────────────
  function renderWeek(w) {
    document.getElementById('weekValue').textContent = w.hasData ? w.label : '—';
    var track = document.getElementById('weekTrack');
    if (w.hasData && w.planned) {
      document.getElementById('weekFill').style.width = w.pct + '%';
      document.getElementById('weekFill').className = 'fill' + (w.complete ? ' good' : '');
      track.hidden = false;
    } else {
      track.hidden = true;
    }
    document.getElementById('weekMeta').textContent =
      w.hasData && w.streak > 1 ? w.streak + '-day streak' : '';
  }

  // ── C · NUTRITION ────────────────────────────────────────────────────
  function renderNutrition(n) {
    var body = document.getElementById('nutBody');
    var targetEl = document.getElementById('nutTarget');
    var summary = document.getElementById('nutSummary');

    if (!n.hasData) {
      targetEl.textContent = '';
      body.innerHTML = '<div class="nut-empty">Not available</div>';
      summary.textContent = 'Nutrition not available';
      return;
    }
    if (!n.logged) {
      targetEl.textContent = '';
      body.innerHTML = '<div class="nut-empty">Nothing logged yet today</div>';
      summary.textContent = 'No food logged today';
      return;
    }

    var html = '';
    if (n.hasTargets) {
      targetEl.innerHTML = '<span class="sub">' + n.consumed.toLocaleString() +
        ' / ' + n.target.toLocaleString() + '</span>';
      html += '<div class="nut">' +
        '<span class="num nut-num' + (n.over ? ' over' : '') + '">' + n.left.toLocaleString() + '</span>' +
        '<span class="nut-unit">kcal ' + (n.over ? 'over' : 'left') + '</span>' +
        '</div>' +
        '<div class="track"><div class="fill ' + (n.over ? 'over' : 'good') +
        '" style="width:' + n.pct + '%"></div></div>';
      summary.textContent = n.left.toLocaleString() + ' kcal ' + (n.over ? 'over' : 'left');
    } else {
      targetEl.textContent = '';
      html += '<div class="nut">' +
        '<span class="num nut-num">' + n.consumed.toLocaleString() + '</span>' +
        '<span class="nut-unit">kcal today</span>' +
        '</div>';
      summary.textContent = n.consumed.toLocaleString() + ' kcal today';
    }

    if (n.protein.target) {
      html += '<div class="nut-macro">' +
        '<span class="label">Protein</span>' +
        '<span>' + n.protein.consumed + ' / ' + n.protein.target + ' g</span>' +
        '</div>' +
        '<div class="track"><div class="fill" style="width:' + n.protein.pct + '%"></div></div>';
    } else if (n.protein.consumed) {
      html += '<div class="nut-macro"><span class="label">Protein</span>' +
        '<span>' + n.protein.consumed + ' g</span></div>';
    }
    body.innerHTML = html;
  }

  // ── D · FOCUS ────────────────────────────────────────────────────────
  // Deterministic, evidence-backed, one line — or nothing at all. This is the
  // seat the AI Coach will occupy; it is never presented as AI today.
  function renderFocus(f) {
    var el = document.getElementById('focusRow');
    if (!f) { el.hidden = true; return; }
    document.getElementById('focusText').textContent = f.text;
    el.setAttribute('data-tone', f.tone);
    el.hidden = false;
  }

  // ── E · PROGRESS ─────────────────────────────────────────────────────
  function renderProgress(p) {
    var valueEl = document.getElementById('progValue');
    var metaEl  = document.getElementById('progMeta');
    if (!p.hasData) {
      valueEl.textContent = '—';
      metaEl.innerHTML = '<span style="color:var(--text-muted)">No weigh-ins yet</span>';
      return;
    }
    valueEl.textContent = p.current + ' ' + p.unit;
    if (p.change30 == null) {
      metaEl.textContent = '';
      return;
    }
    var arrow = p.direction === 'down' ? '↓' : p.direction === 'up' ? '↑' : '±';
    metaEl.innerHTML = '<span class="prog-delta ' + esc(p.direction) + '">' +
      arrow + ' ' + Math.abs(p.change30) + ' ' + esc(p.unit) + '</span>' +
      '<span style="color:var(--text-muted)"> this month</span>';
  }

  // ── Weight modal hook ────────────────────────────────────────────────
  // wlSave() already toasts and has synced profiles.weight_lbs — just re-derive.
  window.onWeightSaved = async function () {
    if (!currentUserId) return;
    currentProfile = await getProfile(currentUserId);
    await renderDashboard(currentUserId);
  };

  async function discardSession() {
    if (!inProgressId) return;
    if (!confirm('Discard this unfinished session? This cannot be undone.')) return;
    var res = await supabaseClient.from('workouts').delete().eq('id', inProgressId);
    if (res.error) { showToast('Error discarding — try again.'); return; }
    inProgressId = null;
    showToast('Session discarded.');
    await renderDashboard(currentUserId);
  }

</script>
</body>
</html>
