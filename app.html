<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark">
  <title>Muscle Motivation – Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Phase 4.3.5F — navigation performance. Every destination pulled scripts
       from two extra origins (unpkg, jsdelivr) and talked to Supabase
       immediately, with no preconnect to any of them: each cost a full
       DNS + TCP + TLS handshake on the critical path of every tab switch.
       These warm the connections while the HTML is still parsing. -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://igzvphmhyrdjjvzbxnuh.supabase.co" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js" integrity="sha384-ouAVEJVCMsf8Svzn+BwqbaBhxBEA0xgeVBhHnxmWd+Wqyv18yhWCQwGegFD/OHLq" crossorigin="anonymous"></script>
  <style>
    /* Fallback palette only — app-shell.css defines the canonical tokens and
       overrides these. Kept so the page degrades sanely if the shell 404s. */
    :root {
      --red:          #B1121B;
      --bg:           #121011;
      --surface-1:    #1A1717;
      --surface-2:    #231F20;
      --surface-3:    #2C2827;
      --border-1:     #241F20;
      --border-2:     #332D2E;
      --border-3:     #443C3D;
      --text:         #F7F5F2;
      --text-2:       #B8B3B4;
      --text-muted:   #8A8384;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Barlow', sans-serif;
      background: var(--mm-bg);
      color: var(--mm-text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Auth gate */
    #authGate {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
    }
    #authGate img { width: 72px; margin-bottom: 16px; opacity: 0.6; }
    #authGate p {
      color: var(--mm-text-tertiary); font-size: 11px;
      letter-spacing: 2.5px; text-transform: uppercase;
    }

    /* Header — header / .header-logo live in app-shell.css.
       The avatar is the ONLY Profile entry point; Profile has no Home content. */
    .header-profile {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; margin-right: -10px;
      color: var(--mm-text-secondary); text-decoration: none;
      border-radius: 50%;
      transition: color 0.2s, background 0.2s;
    }
    .header-profile:hover { color: var(--mm-text); background: var(--mm-surface); }
    .header-profile:focus-visible { outline: 2px solid var(--mm-accent); outline-offset: 2px; }

    /* Bottom padding = the page's own breathing room + the shared app-shell
       clearance (nav height + home indicator). See app-shell.css. */
    .container {
      max-width: 680px; margin: 0 auto;
      padding: 24px 16px calc(24px + var(--mm-bottom-clearance, 0px));
    }

    /* ── Open rows ──────────────────────────────────────────────────────
       A tappable block with NO container: the background is the layout
       surface. This is what replaces the old bordered cards, so This Week
       and Nutrition stop competing with the hero for visual weight. */
    .home-row {
      display: block;
      padding: 2px 0 4px;
      text-decoration: none;
      color: inherit;
      border-radius: 10px;
    }
    .home-row:focus-visible {
      outline: 2px solid var(--mm-accent);
      outline-offset: 4px;
    }
    @media (hover: hover) {
      .home-row:hover .mm-meter { background: var(--mm-line); }
    }
    .home-row:active { opacity: 0.75; }

    /* Label + value pair sitting above a meter.
       Spacing is deliberately asymmetric: a label sits CLOSE to the bar it
       describes (5px) and the two metric groups sit further apart (10px), so
       the pairing is read by proximity rather than by a divider. Tightened
       from 7/14 — the section was ~11% taller than it needed to be without
       either bar gaining legibility. */
    .home-metric {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; margin: 0 0 5px;
    }
    .home-metric + .mm-meter { margin-bottom: 10px; }
    /* The day strip is the one block whose contents are ROUND, so the space
       under it reads larger than the same measurement under a flat element —
       the section gap after it looked bigger than every other one despite
       being identical. Trimmed optically so the rhythm matches; Nutrition is
       still clearly its own section, and no other gap is affected (the
       nutrition row is followed by its Log food action, not by a section
       header).
       Sized on device rather than by arithmetic: at 14px (18px total) training
       and nutrition began reading as one group, so the correction is smaller
       than it first looked. 22px puts the total at 26px — clearly two sections
       again, still short of the uncorrected 30px, and well above the 10px a
       section label sits above its own content. */
    .home-row + .mm-section { margin-top: 22px; }

    .home-metric-label {
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mm-text-tertiary);
    }
    .home-metric-value {
      font-size: 14px; font-weight: 600; color: var(--mm-text);
      white-space: nowrap;
    }
    .home-metric-value .sub { color: var(--mm-text-tertiary); font-weight: 600; }
    /* Calories is the metric checked most often, and at 14px Barlow it read
       SMALLER than "0 / 3 WORKOUTS" and "213 LB" — inverting its priority.
       It now borrows the existing section-value scale (Bebas 20px) so it sits
       level with its siblings, while protein stays deliberately secondary.
       Nowhere near the old 42px treatment, and still well below the hero. */
    .home-metric-value.is-lead {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px; font-weight: 400; letter-spacing: 0.5px; line-height: 1;
    }
    .home-metric-value.is-lead .sub {
      font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 600;
    }

    /* Quiet inline action — used for "Choose another workout" and "Log weight".
       Text-weight, never a button slab, but still a real 44px target. */
    .home-action {
      display: inline-flex; align-items: center; gap: 5px;
      min-height: 44px;
      background: none; border: none; padding: 0;
      font-family: 'Barlow', sans-serif;
      font-size: 13px; font-weight: 600;
      color: var(--mm-text-secondary);
      text-decoration: none; cursor: pointer;
    }
    .home-action::after { content: '›'; font-size: 16px; line-height: 1; color: var(--mm-text-tertiary); }
    .home-action:hover { color: var(--mm-text); }
    .home-action:focus-visible {
      outline: 2px solid var(--mm-accent); outline-offset: 3px; border-radius: 6px;
    }

    /* Hero state dot — the text beside it always says the same thing, so the
       colour is emphasis only, never the sole carrier of meaning. */
    .mm-hero-meta.is-done::before,
    .mm-hero-meta.is-live::before {
      content: ''; display: inline-block;
      width: 7px; height: 7px; border-radius: 50%;
      margin-right: 7px; vertical-align: middle;
    }
    .mm-hero-meta.is-done::before { background: var(--mm-success); }
    .mm-hero-meta.is-live::before { background: var(--mm-accent); }

    /* ── Logging actions ────────────────────────────────────────────────
       A second, deliberately different action language. Home is both a status
       screen and a launch point, and those are different jobs: a chevron says
       "go somewhere and look", a plus says "add something". Navigation stays
       sentence-case + `›` (.home-action); creation is uppercase + `+`.

       Distinguished by CASE and the glyph rather than by size or fill, so it
       reads as a peer of the navigation actions and never as a second CTA
       competing with START WORKOUT. Only the `+` carries the accent. */
    .home-log {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 44px;
      background: none; border: none; padding: 0;
      font-family: 'Barlow', sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mm-text);
      text-decoration: none; cursor: pointer;
    }
    .home-log::before {
      content: '+';
      font-size: 15px; font-weight: 700; line-height: 1;
      color: var(--mm-accent);
    }
    .home-log:hover { color: var(--mm-text); }
    .home-log:hover::before { opacity: 0.85; }
    .home-log:focus-visible {
      outline: 2px solid var(--mm-accent); outline-offset: 3px; border-radius: 6px;
    }

    /* A row of related actions, left-aligned to the content grid and separated
       by a controlled gap — never pushed to opposite screen edges, which made
       a pair that belongs together read as two unrelated links. Wraps rather
       than cramping on a narrow phone. Used by both logging surfaces, so
       Log food and Log weight start on the same line of the grid. */
    .home-actions {
      display: flex; align-items: center; flex-wrap: wrap;
      gap: 4px 18px;
    }
    /* The 44px boxes carry ~15px of their own dead space, which is most of the
       separation; this is the remainder needed to keep Coach Insight on the
       same section rhythm as every other transition. */
    .home-actions + .mm-insight { margin-top: 12px; }

    /* The alternate-workout path, inside the hero beneath the primary CTA.
       Standing alone under the card it read as a second, competing action; here
       it is plainly subordinate to START WORKOUT — same quiet text weight, one
       level down. `display: flex` puts it on its own line after the inline-flex
       CTA, and `fit-content` stops the 44px box from spanning the whole card
       and becoming an invisible full-width target. The negative bottom margin
       absorbs the box's own dead space so the card keeps its optical padding;
       the tap target itself is untouched.

       It is deliberately quieter than the other .home-action instances (Quick
       log, Log weight). Those sit alone on the background where they are the
       only thing to act on; this one sits directly under a filled primary CTA,
       and at the shared 13px treatment it read as that button's peer.

       The demotion is SIZE, not contrast. Dropping it to --mm-text-tertiary as
       well took it to 4.8:1 on the card, which measured fine but read as
       disabled on device — a secondary action has to look reachable. It keeps
       the standard --mm-text-secondary (8.9:1) and stays subordinate through
       type alone: 12px Barlow against a 19px Bebas slab on the theme accent.
       The 44px target, position, spacing and chevron are untouched.

       Scoped to a VISIBLE CTA on purpose. In the completed state ("Train
       again") the CTA is hidden and this is the card's only action, so it keeps
       the full-size treatment instead of being shrunk for a competition that
       is not happening. `:not([hidden])` is required — the hidden CTA is still
       an adjacent sibling in the DOM, so the bare `+` selector would match. */
    .home-action--hero {
      display: flex; width: fit-content; margin: 0 0 -18px;
    }
    .mm-hero-cta:not([hidden]) + .home-action--hero {
      font-size: 12px; color: var(--mm-text-secondary);
    }
    .mm-hero-cta:not([hidden]) + .home-action--hero::after { font-size: 14px; }

    /* Phase 4.3.7 — the personalized recommendation line inside the hero.
       A quiet footnote under the actions, separated by a hairline so it reads
       as context rather than a third competing CTA. It wraps freely: at 320px
       a program name plus its reason will not fit on one line, and clipping an
       explanation is worse than letting it run to two. The `.home-action--hero`
       negative bottom margin above has to be cleared when this line follows it,
       or the rule would pull the divider up over the button. */
    .mm-hero-rec {
      margin: 0;
      padding-top: 12px;
      border-top: 1px solid var(--mm-line-subtle);
      font-size: 13px;
      line-height: 1.5;
      color: var(--mm-text-secondary);
    }
    .home-action--hero:not([hidden]) + .mm-hero-rec { margin-top: 22px; }
    .mm-hero-rec-label { margin-right: 4px; }
    .mm-hero-rec-link {
      color: var(--mm-text);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid var(--mm-accent);
      /* A 13px inline link is far below a 44px touch target. Measured in
         production at 32.5px with padding alone, so the height is asserted
         directly rather than approximated: inline-flex gives the anchor a real
         box, min-height sets the target, and align-items keeps the text
         optically centred in it. Verified at 320/390/430px content widths. */
      display: inline-flex;
      align-items: center;
      min-height: 44px;
    }
    .mm-hero-rec-link:hover { color: var(--mm-accent); }

    /* Weight is a compact snapshot, still open on the background — never a
       card. Two columns: the reading on the left, the sparkline balancing the
       right, with the logging action beneath. Centred against each other so a
       one-line stack (no change yet) still sits level with the line.

       If the two ever cannot share a line — a very large text size, a longer
       change string — the SPARKLINE wraps below rather than the reading being
       squeezed: it is the supporting element, so it is the one that gives way.
       Nothing overflows and no text collides. */
    /* Top-aligned, not centred. Centring the whole left column against the
       chart made its three lines read as one three-line stack; aligning the
       METRIC to the top of the chart lets the action fall away below it, which
       is the hierarchy the section actually has. */
    .home-progress {
      display: flex; align-items: flex-start; flex-wrap: wrap;
      gap: 8px 14px; margin-top: 2px;
    }
    /* The reading column: weight, its change, and the action on it. All three
       sit beside the chart, which is why Log weight lives here rather than in
       its own row — it still begins on the same content-grid line as Log food,
       so the two quick-log actions stay a matched pair. The column is sized by
       its content so the chart takes whatever is left. */
    .home-weightstack {
      display: flex; flex-direction: column; align-items: flex-start;
      gap: 3px; flex: 0 0 auto;
    }
    /* The weight and its change are the METRIC; Log weight is an ACTION on it,
       not a third line of data. It gets deliberate clear space so the group
       above it reads as one thing and the action reads as its own. The bottom
       margin still absorbs the 44px box's trailing dead space, so the target is
       untouched and the column does not grow past the chart. */
    .home-weightstack .home-log { margin: 6px 0 -10px; }
    .home-weight {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px; letter-spacing: 0.5px; line-height: 1;
      color: var(--mm-text); white-space: nowrap;
    }
    /* Deliberately NOT coloured by direction. Losing weight is not universally
       good and gaining is not universally bad — it depends on whether the user
       is cutting, maintaining or bulking, and nothing here knows that. Green/
       amber would be a judgement the data cannot support, so the change stays
       neutral and the arrow carries the direction. (weight.js says the same of
       wlDeltaHTML: "Neutral by design".)

       It sits directly under the weight, inside the same stack: the two are one
       status statement — "this is your weight, this is how it moved" — and it
       is the accessible, explicit account of direction that the sparkline is
       never allowed to replace. */
    .home-trend {
      font-size: 13px; font-weight: 600; color: var(--mm-text-secondary);
      white-space: nowrap;
    }
    /* No trend yet — collapse entirely so nothing marks where one would go. */
    .home-trend:empty { display: none; }
    .home-trend .muted { color: var(--mm-text-tertiary); font-weight: 600; }

    /* Mini weight-trend widget — a small preview of the full Trend chart, and
       the control that opens it.

       On its own the line read as a stray mark floating in empty space. The
       container is what fixes that, and it is deliberately the SAME object as
       the Progress page's .chart-card at a smaller size: same raised surface,
       same hairline border, same radius family. Seeing it here and then seeing
       the full chart there should feel like one thing, zoomed.

       It carries no axes, ticks, dates, grid, legend or heading — those belong
       to the full chart. The line is the only content, with enough padding that
       it never touches the edges. Colour is the theme token via currentColor,
       so a future user accent flows through.

       Sized to BALANCE the reading, never to compete with it: it takes the
       space left over on the right, is capped so it cannot grow on a wide
       screen, and 211 LB remains the largest thing in the section. */
    .home-trendcard {
      display: block;
      /* Takes the width the reading column leaves, so the two together fill the
         row without either being pinned to a magic number. Basis 0, not auto:
         the SVG's own intrinsic width would otherwise claim the whole row and
         push itself onto a second line. */
      flex: 1 1 0;
      /* Capped a little tighter than the row would allow. On a large phone the
         chart was taking enough width to out-weigh 211 LB; pulling the ceiling
         in gives the reading room to lead without touching the chart's height,
         labels or geometry. Narrow phones are already below this cap, so they
         keep every pixel they have — label legibility comes first there. */
      min-width: 150px; max-width: 262px;
      margin-left: auto;
      padding: 2px 4px;
      background: var(--mm-surface-raised);
      border: 1px solid var(--mm-line);
      border-radius: 10px;
      color: var(--mm-accent);
      text-decoration: none;
      transition: border-color 0.2s;
    }
    @media (hover: hover) {
      .home-trendcard:hover { border-color: var(--mm-line-strong); }
    }
    .home-trendcard:active { opacity: 0.8; }
    .home-trendcard:focus-visible {
      outline: 2px solid var(--mm-accent); outline-offset: 3px;
    }
    /* wlChartSVG sizes itself to the container width and keeps its own aspect,
       so the card's height follows the chart rather than being declared twice. */
    .home-trendcard svg { display: block; }

    /* Quiet empty states — never a card, never a paragraph. */
    .home-empty { font-size: 13px; color: var(--mm-text-tertiary); padding: 2px 0 6px; }

    /* ── Log / Edit Weight modal ────────────────────────────────────────
       Markup comes from weight.js (wlModalMarkup) and uses these shared class
       names, so Home must style them even though it defines no modal of its
       own. Without these rules the modal renders inline and always-visible. */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.82); backdrop-filter: blur(6px);
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--mm-surface-raised); border: 1px solid var(--mm-line);
      border-radius: 14px; padding: 22px 18px;
      width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1.5px; }
    .modal-close {
      min-width: 44px; min-height: 44px; background: none; border: none;
      color: var(--mm-text-tertiary); font-size: 18px; cursor: pointer;
    }
    .modal-close:hover { color: var(--mm-text); }
    .modal-close:focus-visible { outline: 2px solid var(--mm-accent); outline-offset: 2px; border-radius: 6px; }
    .field-group { margin-bottom: 14px; }
    .field-label {
      display: block; font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mm-text-tertiary); margin-bottom: 6px;
    }
    .field-optional { font-weight: 400; text-transform: none; letter-spacing: 0; }
    .field-group input {
      width: 100%; min-height: 44px; padding: 10px 12px;
      background: var(--mm-surface); border: 1px solid var(--mm-line);
      border-radius: 8px; color: var(--mm-text);
      font-family: 'Barlow', sans-serif; font-size: 16px; appearance: none;
    }
    .field-group input:focus-visible {
      outline: 2px solid var(--mm-accent); outline-offset: 1px; border-color: var(--mm-accent);
    }
    .btn-calc {
      width: 100%; min-height: 48px; margin-top: 8px; padding: 12px;
      background: var(--mm-accent); border: none; border-radius: 8px;
      color: var(--mm-accent-contrast);
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px;
      cursor: pointer;
    }
    .btn-calc:focus-visible { outline: 2px solid var(--mm-accent-contrast); outline-offset: 2px; }

    /* .toast lives in app-shell.css */

    @media (prefers-reduced-motion: reduce) {
      .home-row, .header-profile { transition: none; }
    }

    @media (max-width: 480px) {
      .container { padding: 20px 12px calc(24px + var(--mm-bottom-clearance, 0px)); }
    }
  </style>

<body>

<!-- Auth gate -->
<div id="authGate">
  <img src="logow.png" alt="Muscle Motivation">
  <p>Loading...</p>
</div>

<!-- Dashboard -->
<div id="appContent" style="display:none;">

  <a class="mm-skip-link" href="#mmMain">Skip to content</a>

  <header>
    <a class="header-logo" href="app.html">
      <img src="logow.png" alt="Muscle Motivation">
      <span>Muscle Motivation</span>
    </a>
    <a class="header-profile" href="profile.html" aria-label="Profile and settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>
      </svg>
    </a>
  </header>

  <main class="container" id="mmMain" tabindex="-1">
    <h1 class="mm-visually-hidden">Dashboard</h1>

    <!-- ── A · TODAY'S PLAN ─────────────────────────────────────────────
         The one dominant surface, and the first thing under the header. It
         carries no section label: "Today's Plan" already states the context,
         so a "TRAIN" heading above it was a second, redundant title. Keeps a
         container because it carries the screen's primary action. Renders the
         no-image fallback; hero photography remains deferred.

         The alternate path lives INSIDE the card, under the CTA — outside it
         read as a competing action floating between two sections. -->
    <section class="mm-hero" aria-labelledby="todayTitle">
      <div class="mm-hero-body">
        <div class="mm-hero-eyebrow">Today's Plan</div>
        <h2 class="mm-hero-title" id="todayTitle">&nbsp;</h2>
        <div class="mm-hero-meta" id="todayMeta" hidden></div>
        <a class="mm-hero-cta" id="todayCta" href="workout.html" hidden></a>
        <button class="home-action home-action--hero" id="todayAlt" hidden></button>
        <!-- Phase 4.3.7. One personalized line, rendered ONLY when no program
             is active (the 'open' and 'choose' states) — a user who already has
             a programmed session sees Home exactly as before. It is a
             suggestion with a link, never an enrolment. -->
        <p class="mm-hero-rec" id="todayRec" hidden>
          <span class="mm-hero-rec-label" id="todayRecLabel"></span>
          <a class="mm-hero-rec-link" id="todayRecLink" href="#"></a>
        </p>
      </div>
    </section>

    <!-- ── B · THIS WEEK ────────────────────────────────────────────────
         No container. The count and the day strip both read training.week, so
         they can never disagree — which is exactly why the horizontal meter
         that used to sit beneath the strip was removed: it was a third drawing
         of the same one number. The strip already shows how many days are
         ticked AND which ones, so it strictly dominates a bar. -->
    <div class="mm-section">
      <h2 class="mm-section-label">This Week</h2>
      <span class="mm-section-value" id="weekValue">—</span>
    </div>
    <a class="home-row" href="workout-history.html">
      <div class="mm-daystrip" id="weekStrip" role="list"></div>
      <span class="mm-visually-hidden">View workout history</span>
    </a>

    <!-- ── C · NUTRITION ────────────────────────────────────────────────
         No container, deliberately quieter than the hero. -->
    <div class="mm-section">
      <h2 class="mm-section-label">Nutrition</h2>
    </div>
    <a class="home-row" href="nutrition.html" id="nutRow">
      <div id="nutBody"></div>
      <span class="mm-visually-hidden">Open nutrition</span>
    </a>
    <!-- Status first, then the action on it: the reading order is calories and
         protein → log something → what Coach makes of it. Below the metrics
         rather than beside the heading, on the same content-grid line as
         Log weight, so the two logging actions read as one pattern.

         It must sit OUTSIDE #nutRow: that whole block is already an anchor to
         nutrition.html, and an anchor cannot contain another one.

         The href is unchanged, so nutrition.html's focusQuickLogFromHash()
         still brings the real Quick Log input into view and focuses it — this
         stays a shortcut, never plain navigation to the top of Nutrition. -->
    <div class="home-actions">
      <a class="home-log" href="nutrition.html#quicklog">Log food</a>
    </div>

    <!-- ── D · COACH INSIGHT ────────────────────────────────────────────
         The seat the AI Coach will occupy. Deterministic evidence only, and
         hidden entirely when nothing is evidence-backed. -->
    <section class="mm-insight" id="insightRow" hidden>
      <span class="mm-insight-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" focusable="false">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/>
        </svg>
      </span>
      <div class="mm-insight-body">
        <div class="mm-insight-label">Coach Insight</div>
        <p class="mm-insight-text" id="insightText"></p>
        <a class="mm-insight-action" id="insightAction" hidden></a>
      </div>
    </section>

    <!-- ── E · WEIGHT ───────────────────────────────────────────────────
         No container — a compact snapshot on the background, never a card.
         Labelled WEIGHT rather than Progress because that is exactly what it
         is: a quick weight status. "Progress" is the persistent bottom-nav
         destination for the full history, so the two no longer share a name.
         Nothing about that tab, its label or its route changes.

         Weight and its change anchor the left; the mini trend widget balances
         the right. The DRAWING stays hidden from assistive technology — the
         change directly beside it already states the same thing in words — but
         the widget itself is a labelled link, so what is announced is the
         destination rather than a wall of coordinates.

         Three distinct interactions live in this area, deliberately: Log
         weight records a value, the trend widget opens the full chart, and the
         Progress tab opens the destination generally. `View progress ›` stays
         removed — the widget now carries that route, and the tab always did. -->
    <div class="mm-section">
      <h2 class="mm-section-label">Weight</h2>
    </div>
    <div class="home-progress">
      <div class="home-weightstack">
        <span class="home-weight" id="progValue">—</span>
        <span class="home-trend" id="progTrend"></span>
        <button class="home-log" id="logWeightBtn" onclick="wlOpenModal()">Log weight</button>
      </div>
      <a class="home-trendcard" id="progSpark" href="weight-history.html#chartWrap"
         aria-label="View weight trend in Progress" hidden></a>
    </div>

  </main>

  <!-- Shared primary navigation (markup owned by app-nav.js) -->
  <div id="appNavMount"></div>
</div><!-- /appContent -->

<!-- Log / Edit Weight Modal (markup injected by weight.js) -->
<div id="weightModalMount"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js" integrity="sha384-3wY11tldQ5+yWqAvmTN4XtQvnjoTva0cV15O/O/O5NTtp0ivVopSzLOzsVXWZse9" crossorigin="anonymous"></script>
<script src="supabase.js"></script>
<script src="schedules.js"></script>
<script src="program-catalog.js"></script>
<script src="entitlement-core.js"></script>
<script src="program-state.js"></script>
<script src="weight.js"></script>
<script src="metrics.js"></script>
<script src="snapshot.js"></script>
<script src="dashboard-model.js"></script>
<script src="personalization-core.js"></script>
<script>

  // Home consumes SHARED state only: snapshot.js supplies training, nutrition,
  // weight and body-composition domain state; program-state.js supplies the
  // active program/session; dashboard-model.js decides priority and fallbacks.
  // This page owns no fitness intelligence and performs no per-metric queries.

  var currentProfile = null;
  var currentUserId  = null;
  var inProgressId   = null;

  document.getElementById('weightModalMount').innerHTML = wlModalMarkup();

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 3000);
  }

  // Meters are driven by ONE custom property (the .mm-meter contract).
  function setMeter(id, pct, modifier) {
    var el = document.getElementById(id);
    if (!el) return;
    var p = Math.max(0, Math.min(100, Math.round(pct || 0)));
    el.className = 'mm-meter' + (modifier ? ' mm-meter--' + modifier : '');
    el.style.setProperty('--mm-meter-pct', p + '%');
    el.setAttribute('aria-valuenow', String(p));
    // Zero reads as an empty track. Only a genuine non-zero value draws a fill,
    // which the shell then floors to one bar-height so it stays visible.
    if (p === 0) el.setAttribute('data-empty', 'true');
    else el.removeAttribute('data-empty');
  }

  window.addEventListener('load', function () {
    (async () => {
      try {
        var session = await requireAuth();
        var user = session.user;
        currentUserId = user.id;
        var profile = await getProfile(user.id);
        currentProfile = profile;

        if (!profile || !profile.onboarding_complete) {
          window.location.href = 'onboarding.html';
          return;
        }

        // PWA install onboarding (Phase 4.3.3): reaching the personalized
        // dashboard after onboarding is an approved meaningful-value moment.
        // Narrow signal only — no logged/user content is included.
        try { window.dispatchEvent(new CustomEvent('mm:pwa-value', { detail: { type: 'dashboard' } })); } catch (e) {}

        document.getElementById('authGate').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        lucide.createIcons();

        await renderDashboard(user.id);

        if (new URLSearchParams(window.location.search).get('purchase') === 'success') {
          showToast('Purchase successful — your program is now unlocked.');
          history.replaceState(null, '', window.location.pathname);
        }
      } catch (err) {
        console.error('Dashboard error:', err);
        window.location.href = 'auth.html';
      }
    })();
  });

  // ONE pass: every section is derived from the same shared state.
  async function renderDashboard(userId) {
    var results = await Promise.all([
      buildUserSnapshot(userId, { profile: currentProfile }).catch(function (e) {
        console.error('snapshot:', e); return null;
      }),
      loadProgramState(userId),
      loadInProgress(userId),
    ]);

    var model = DashboardModel.buildDashboardModel({
      snapshot: results[0],
      profile: currentProfile,
      program: results[1],
      inProgressWorkout: results[2],
      hourOfDay: new Date().getHours(),
    });

    renderToday(model.today);
    // Phase 4.3.7. Derived from data Home has ALREADY fetched: currentProfile,
    // plus the catalog that loadProgramState warmed a moment ago via
    // pgLoadAccessiblePrograms. pcCached() is a synchronous read, so Home makes
    // no additional request and its bootstrap waterfall is unchanged.
    renderRecommendation(model.today);
    renderWeek(model.week);
    renderNutrition(model.nutrition);
    renderInsight(model.focus);
    renderProgress(model.progress);
  }

  async function loadProgramState(userId) {
    try {
      var owned = await pgLoadAccessiblePrograms(userId);
      var activeSlug = await pgResolveActive(userId, currentProfile, owned);
      if (!activeSlug) return owned.length > 1 ? { needsSelection: true } : null;
      return await pgResolveSession(userId, activeSlug, currentProfile.training_days);
    } catch (e) {
      console.error('loadProgramState:', e);
      return null;
    }
  }

  async function loadInProgress(userId) {
    try {
      // Most recent unfinished workout, regardless of age — an unfinished
      // session must never become an invisible orphan.
      var res = await supabaseClient
        .from('workouts').select('id, name')
        .eq('user_id', userId).eq('completed', false)
        .order('created_at', { ascending: false }).limit(1).maybeSingle();
      if (!res.data) return null;
      inProgressId = res.data.id;
      return res.data;
    } catch (e) {
      console.error('loadInProgress:', e);
      return null;
    }
  }

  // ── A · TODAY'S PLAN ─────────────────────────────────────────────────
  // Every priority state from the model renders in the same hero shape:
  // resume · already trained · programmed session · choose program · open.
  function renderToday(t) {
    document.getElementById('todayTitle').textContent = t.title;

    var meta = document.getElementById('todayMeta');
    if (t.status) {
      meta.textContent = t.status;
      meta.className = 'mm-hero-meta' +
        (t.state === 'done' ? ' is-done' : t.state === 'resume' ? ' is-live' : '');
      meta.hidden = false;
    } else {
      meta.hidden = true;
    }

    var cta = document.getElementById('todayCta');
    if (t.cta) {
      cta.textContent = t.cta.label;
      cta.href = t.cta.href;
      cta.hidden = false;
    } else {
      cta.hidden = true;
    }

    var alt = document.getElementById('todayAlt');
    if (t.secondary) {
      alt.textContent = t.secondary.label;
      alt.hidden = false;
      alt.onclick = t.secondary.action === 'discard'
        ? discardSession
        : function () { window.location.href = t.secondary.href; };
    } else {
      alt.hidden = true;
    }
  }

  // ── A2 · PERSONALIZED RECOMMENDATION (Phase 4.3.7) ───────────────────
  // A single line under Today's actions, shown ONLY when the user has no
  // programmed session to do — the 'open' and 'choose' states. In every other
  // state Home already proposes a specific workout, and a second suggestion
  // beside it would compete with the one action the hero exists to present.
  //
  // It recommends; it never enrols. The link opens the Program's page, where
  // starting it remains an explicit choice the user makes.
  var TODAY_REC_STATES = ['open', 'choose'];

  function renderRecommendation(today) {
    var row = document.getElementById('todayRec');
    if (TODAY_REC_STATES.indexOf(today.state) < 0) { row.hidden = true; return; }

    var plan;
    try {
      plan = Personalization.derivePersonalizedStart(currentProfile,
        { catalog: pcCached() || [] });
    } catch (e) {
      console.error('renderRecommendation:', e);
      row.hidden = true;
      return;
    }

    var rec = plan.training.recommendedProgram;

    // Phase 4.3.9-L. When the engine deliberately withheld a recommendation
    // because nothing suits this person's equipment, Home says so in one line
    // and points at Programs. Browsing is not a recommendation — the link opens
    // the Programs pane, never a Program we just declined to recommend. The
    // href is built by AppNav so it cannot drift from what Train parses.
    if (!rec && plan.training.noFitReason === 'equipment') {
      document.getElementById('todayRecLabel').textContent =
        'No equipment match yet:';
      var browse = document.getElementById('todayRecLink');
      browse.textContent = 'Browse Programs';
      // Both branches must open PROGRAMS. The earlier fallback was plain
      // workout.html, which silently landed on Today and quietly recreated the
      // defect this state exists to fix — a fallback that does the wrong thing
      // is worse than no fallback.
      browse.href = (typeof AppNav !== 'undefined' && AppNav.trainPaneHref)
        ? AppNav.trainPaneHref('programs')
        : 'workout.html?pane=programs';
      row.hidden = false;
      return;
    }

    // No catalog, or nothing that fits for any other reason: say nothing. Home
    // stays exactly as it was rather than showing an empty personalized slot.
    if (!rec || !rec.pagePath) { row.hidden = true; return; }

    // The label claims only what the engine's reason codes support. A profile
    // with no goal on file gets a plain "Recommended:", never "for your goal".
    var codes = plan.training.reasons;
    var byGoal = codes.indexOf(Personalization.REASON.GOAL_MATCH) >= 0
      || codes.indexOf(Personalization.REASON.GOAL_PARTIAL_MATCH) >= 0;
    document.getElementById('todayRecLabel').textContent =
      byGoal ? 'Recommended for your goal:' : 'Recommended:';

    var link = document.getElementById('todayRecLink');
    link.textContent = rec.name;
    link.href = rec.pagePath;
    row.hidden = false;
  }

  // ── B · THIS WEEK ────────────────────────────────────────────────────
  // Day cells carry only honest state: completed, today, or neither.
  function renderWeek(w) {
    document.getElementById('weekValue').textContent = w.hasData ? w.label : '—';

    var strip = document.getElementById('weekStrip');
    strip.innerHTML = (w.days || []).map(function (d) {
      var cls = 'mm-day' +
        (d.completed ? ' is-done' : '') +
        (d.isToday ? ' is-today' : '') +
        (!d.completed && !d.isToday && d.isFuture ? ' is-future' : '');
      // Both meanings are announced when a day is today AND completed.
      var state = (d.isToday ? 'today, ' : '') + (d.completed ? 'completed' : 'not completed');
      return '<div class="' + cls + '" role="listitem">' +
        '<span class="mm-day-label" aria-hidden="true">' + esc(d.label) + '</span>' +
        '<span class="mm-day-dot"></span>' +
        '<span class="mm-visually-hidden">' + esc(d.weekday) + ': ' + state + '</span>' +
      '</div>';
    }).join('');
    // No meter here by design. w.pct / w.complete stay in the shared model for
    // other consumers, but Home draws the week ONCE: the count states the
    // number, the strip states which days. A bar restated the count a third
    // time and was the only duplicated progress indicator on the screen.
  }

  // ── C · NUTRITION ────────────────────────────────────────────────────
  // Two compact metrics + two thin meters. Ordinary progress uses the ACCENT;
  // amber appears only when genuinely over target.
  function renderNutrition(n) {
    var body = document.getElementById('nutBody');

    // `hasData: false` means the snapshot itself is missing — genuinely unknown,
    // which is NOT the same as "nothing logged". Only that case degrades.
    if (!n.hasData) {
      body.innerHTML = '<div class="home-empty">Not available</div>';
      return;
    }
    // Phase 4.3.5A — an unlogged day renders the SAME structure at zero rather
    // than collapsing to a message. The user sees Calories, Protein, their
    // targets and two empty tracks, so they know where progress will appear
    // before logging anything. Nothing is fabricated: every number below comes
    // from the shared model, and a zero meter renders as an empty track.

    // Category colouring, matching the nutrition page: green identifies
    // CALORIES, the accent identifies macro progress. Amber still overrides
    // when genuinely over target — that is semantic, not categorical.
    var calValue, calPct, calMod = 'calories';
    if (n.hasTargets) {
      calValue = n.left.toLocaleString() + ' <span class="sub">kcal ' + (n.over ? 'over' : 'left') + '</span>';

      calPct = n.pct;
      if (n.over) calMod = 'warning';
    } else {
      calValue = n.consumed.toLocaleString() + ' <span class="sub">kcal today</span>';
      calPct = 0;
    }

    var html =
      '<div class="home-metric">' +
        '<span class="home-metric-label">Calories</span>' +
        '<span class="home-metric-value is-lead">' + calValue + '</span>' +
      '</div>' +
      '<div class="mm-meter" id="nutCalMeter"' + (n.hasTargets ? '' : ' data-empty="true"') +
        ' role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Calories">' +
        '<div class="mm-meter-fill"></div></div>';

    if (n.protein.target) {
      html +=
        '<div class="home-metric">' +
          '<span class="home-metric-label">Protein</span>' +
          '<span class="home-metric-value">' + n.protein.consumed +
            ' <span class="sub">/ ' + n.protein.target + ' g</span></span>' +
        '</div>' +
        '<div class="mm-meter" id="nutProMeter" role="progressbar" aria-valuemin="0"' +
          ' aria-valuemax="100" aria-label="Protein">' +
          '<div class="mm-meter-fill"></div></div>';
    } else {
      // No protein target set. Protein still ALWAYS appears (4.3.5A) — the
      // consumed total alone, with no meter, because a bar without a target
      // would have nothing honest to measure against.
      html +=
        '<div class="home-metric">' +
          '<span class="home-metric-label">Protein</span>' +
          '<span class="home-metric-value">' + n.protein.consumed + ' <span class="sub">g</span></span>' +
        '</div>';
    }

    body.innerHTML = html;
    setMeter('nutCalMeter', calPct, calMod);
    if (n.protein.target) {
      // Hitting a protein target IS a genuine achievement, so success colour
      // is earned here — unlike ordinary partial progress.
      // Protein stays on the ACCENT at every value. Turning it green on
      // completion would give green two meanings on one screen — "this is
      // calories" and "this is finished" — which is exactly the category
      // ambiguity this treatment exists to remove. Hitting the target is
      // already conveyed by the numbers reading 217 / 217 g and a full bar.
      setMeter('nutProMeter', n.protein.pct, null);
    }
  }

  // ── D · COACH INSIGHT ────────────────────────────────────────────────
  // One evidence-backed line, or nothing at all. Never AI-flavoured, never a
  // paragraph. Default treatment is the accent — not a warning.
  function renderInsight(f) {
    var el = document.getElementById('insightRow');
    var action = document.getElementById('insightAction');
    if (!f) { el.hidden = true; return; }

    document.getElementById('insightText').textContent = f.text;
    // Default is the theme accent. Semantic styling is applied ONLY when the
    // model marks an insight as genuinely semantic — a routine nudge like
    // "food logged 1 of 7 days" must never be dressed as an error.
    el.className = 'mm-insight' + (f.severity ? ' mm-insight--' + f.severity : '');

    if (f.action) {
      action.textContent = f.action.label;
      action.href = f.action.href;
      action.hidden = false;
    } else {
      action.hidden = true;
    }
    el.hidden = false;
  }

  // ── E · PROGRESS ─────────────────────────────────────────────────────
  // Every state is driven by real weigh-ins: no history means no trend and no
  // drawing, and the model decides both — this only renders what it is given.
  function renderProgress(p) {
    var valueEl = document.getElementById('progValue');
    var trendEl = document.getElementById('progTrend');

    renderSparkline(p.series);

    if (!p.hasData) {
      // No weight to show — the empty state carries the whole message, so a
      // lone em dash beside it would be noise. Log weight stays useful.
      valueEl.hidden = true;
      trendEl.className = 'home-trend';
      trendEl.innerHTML = '<span class="muted">No weigh-ins yet</span>';
      return;
    }
    valueEl.hidden = false;
    valueEl.textContent = p.current + ' ' + p.unit;

    if (p.change30 == null) {
      // One weigh-in is not a trend — say nothing rather than invent one.
      trendEl.className = 'home-trend';
      trendEl.textContent = '';
      return;
    }
    // The arrow is decoration; the direction is also stated in words for screen
    // readers, since "↓" alone announces poorly or not at all.
    var arrow = p.direction === 'down' ? '↓' : p.direction === 'up' ? '↑' : '±';
    var spoken = p.direction === 'down' ? 'Down' : p.direction === 'up' ? 'Up' : 'No change,';
    trendEl.className = 'home-trend ' + esc(p.direction);
    trendEl.innerHTML =
      '<span aria-hidden="true">' + arrow + '</span>' +
      '<span class="mm-visually-hidden">' + spoken + ' </span> ' +
      Math.abs(p.change30) + ' ' + esc(p.unit) +
      ' <span class="muted">this month</span>';
  }

  // Geometry comes from weight.js (the same module that owns the full Progress
  // chart) over the exact rows behind the change value; this page adds no
  // window, no maths and no interpolation of its own. The widget is hidden
  // entirely when there is nothing real to draw, so the link never leads
  // somewhere with no chart at the other end.
  // COMPACT MODE of the Progress page's chart — the same wlChartSVG, the same
  // rows, the same scaling. Only the box, padding, label size and marker size
  // differ, so tapping through to the full chart shows the same shape larger.
  // Labels are deliberately bigger than a proportional shrink would give: at
  // this size an 11px label would render around 8px and be unreadable.
  // The chart is authored at the size it will actually occupy, measured from
  // the card, rather than at a fixed box scaled to fit. An SVG sized with
  // width:100% scales its TEXT too, so a fixed viewBox would render these
  // labels near 12px on a 430pt phone but around 7px on a 320pt one —
  // unreadable exactly where legibility matters most. Drawing 1:1 keeps the
  // labels at their stated size, and the line and markers at the same visual
  // weight as the full chart, on every device.
  //
  // Height is held constant so the card is a consistent shape; only the width
  // follows the row. `pad` clears the two label rows the renderer stacks at the
  // bottom, so the low-weight value never lands on the dates.
  var HOME_TREND = {
    height: 124, pad: 34, minWidth: 150,
    labelSize: 13, dotRadius: 3.4, strokeWidth: 2.5,
    gradId: 'homeTrendGrad', decorative: true,
  };
  var homeTrendSeries = null;

  function renderSparkline(series) {
    var el = document.getElementById('progSpark');
    homeTrendSeries = series || null;
    if (!homeTrendSeries || typeof wlChartSVG !== 'function') {
      el.hidden = true; el.innerHTML = '';
      return;
    }
    // Unhide before measuring — a hidden element has no width to read.
    el.hidden = false;
    drawTrend(el, false);
  }

  function trendInnerWidth(el) {
    var style = window.getComputedStyle(el);
    return el.clientWidth - parseFloat(style.paddingLeft || 0)
      - parseFloat(style.paddingRight || 0);
  }

  function drawTrend(el, isRetry) {
    var width = Math.max(HOME_TREND.minWidth,
      Math.round(trendInnerWidth(el)) || HOME_TREND.minWidth);

    var svg = wlChartSVG(homeTrendSeries, {
      width: width, height: HOME_TREND.height, pad: HOME_TREND.pad,
      labelSize: HOME_TREND.labelSize, dotRadius: HOME_TREND.dotRadius,
      strokeWidth: HOME_TREND.strokeWidth,
      gradId: HOME_TREND.gradId, decorative: true,
    });
    if (!svg) { el.hidden = true; el.innerHTML = ''; return; }
    el.innerHTML = svg;

    // The row's final width is only settled once the browser has laid the card
    // out, and authoring at a stale width would leave the drawing scaled —
    // which shrinks the labels and changes the card's height. Re-author ONCE at
    // the settled width; the retry flag stops any chance of a loop.
    if (!isRetry) {
      requestAnimationFrame(function () {
        if (Math.abs(Math.round(trendInnerWidth(el)) - width) > 1) drawTrend(el, true);
      });
    }
  }

  // Rotation changes the row width, and with it the size the chart should have
  // been authored at. Re-rendering from the SAME series redraws the identical
  // data at the new size; it re-fetches nothing.
  window.addEventListener('resize', function () {
    clearTimeout(window.__mmTrendResize);
    window.__mmTrendResize = setTimeout(function () {
      if (homeTrendSeries) renderSparkline(homeTrendSeries);
    }, 150);
  });

  // Barlow arrives after first paint, and the reading column is sized by its
  // text — so the row is still shifting when the chart is first authored. Left
  // alone the drawing ends up scaled to a width it no longer has, which shrinks
  // the labels and the card with them. Redraw once the real metrics are known.
  if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
    document.fonts.ready.then(function () {
      if (homeTrendSeries) renderSparkline(homeTrendSeries);
    });
  }

  // ── Weight modal hook ────────────────────────────────────────────────
  // wlSave() already toasts and has synced profiles.weight_lbs — just re-derive.
  window.onWeightSaved = async function () {
    if (!currentUserId) return;
    currentProfile = await getProfile(currentUserId);
    await renderDashboard(currentUserId);
  };

  async function discardSession() {
    if (!inProgressId) return;
    if (!confirm('Discard this unfinished session? This cannot be undone.')) return;
    var res = await supabaseClient.from('workouts').delete().eq('id', inProgressId);
    if (res.error) { showToast('Error discarding — try again.'); return; }
    inProgressId = null;
    showToast('Session discarded.');
    await renderDashboard(currentUserId);
  }

</script>
</body>
</html>
