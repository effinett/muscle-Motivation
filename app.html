<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Muscle Motivation – Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js" integrity="sha384-ouAVEJVCMsf8Svzn+BwqbaBhxBEA0xgeVBhHnxmWd+Wqyv18yhWCQwGegFD/OHLq" crossorigin="anonymous"></script>
  <style>
    /* Fallback palette only — app-shell.css defines the canonical tokens and
       overrides these. Kept so the page degrades sanely if the shell 404s. */
    :root {
      --red:          #B1121B;
      --bg:           #121011;
      --surface-1:    #1A1717;
      --surface-2:    #231F20;
      --surface-3:    #2C2827;
      --border-1:     #241F20;
      --border-2:     #332D2E;
      --border-3:     #443C3D;
      --text:         #F7F5F2;
      --text-2:       #B8B3B4;
      --text-muted:   #8A8384;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Barlow', sans-serif;
      background: var(--mm-bg);
      color: var(--mm-text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Auth gate */
    #authGate {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
    }
    #authGate img { width: 72px; margin-bottom: 16px; opacity: 0.6; }
    #authGate p {
      color: var(--mm-text-tertiary); font-size: 11px;
      letter-spacing: 2.5px; text-transform: uppercase;
    }

    /* Header — header / .header-logo live in app-shell.css.
       The avatar is the ONLY Profile entry point; Profile has no Home content. */
    .header-profile {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; margin-right: -10px;
      color: var(--mm-text-secondary); text-decoration: none;
      border-radius: 50%;
      transition: color 0.2s, background 0.2s;
    }
    .header-profile:hover { color: var(--mm-text); background: var(--mm-surface); }
    .header-profile:focus-visible { outline: 2px solid var(--mm-accent); outline-offset: 2px; }

    /* Bottom padding = the page's own breathing room + the shared app-shell
       clearance (nav height + home indicator). See app-shell.css. */
    .container {
      max-width: 680px; margin: 0 auto;
      padding: 24px 16px calc(24px + var(--mm-bottom-clearance, 0px));
    }

    /* ── Open rows ──────────────────────────────────────────────────────
       A tappable block with NO container: the background is the layout
       surface. This is what replaces the old bordered cards, so This Week
       and Nutrition stop competing with the hero for visual weight. */
    .home-row {
      display: block;
      padding: 2px 0 4px;
      text-decoration: none;
      color: inherit;
      border-radius: 10px;
    }
    .home-row:focus-visible {
      outline: 2px solid var(--mm-accent);
      outline-offset: 4px;
    }
    @media (hover: hover) {
      .home-row:hover .mm-meter { background: var(--mm-line); }
    }
    .home-row:active { opacity: 0.75; }

    /* Label + value pair sitting above a meter.
       Spacing is deliberately asymmetric: a label sits CLOSE to the bar it
       describes (5px) and the two metric groups sit further apart (10px), so
       the pairing is read by proximity rather than by a divider. Tightened
       from 7/14 — the section was ~11% taller than it needed to be without
       either bar gaining legibility. */
    .home-metric {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; margin: 0 0 5px;
    }
    .home-metric + .mm-meter { margin-bottom: 10px; }
    /* …and it stays INSIDE Nutrition. Coach Insight is the next item in the
       hierarchy, not part of the nutrition block, so it keeps the same 26px
       transition every other section gets. Without this it inherited only the
       tightened metric spacing and its border sat 14px under the protein bar. */
    .home-row + .mm-insight { margin-top: 12px; }
    .home-metric-label {
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mm-text-tertiary);
    }
    .home-metric-value {
      font-size: 14px; font-weight: 600; color: var(--mm-text);
      white-space: nowrap;
    }
    .home-metric-value .sub { color: var(--mm-text-tertiary); font-weight: 600; }
    /* Calories is the metric checked most often, and at 14px Barlow it read
       SMALLER than "0 / 3 WORKOUTS" and "213 LB" — inverting its priority.
       It now borrows the existing section-value scale (Bebas 20px) so it sits
       level with its siblings, while protein stays deliberately secondary.
       Nowhere near the old 42px treatment, and still well below the hero. */
    .home-metric-value.is-lead {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px; font-weight: 400; letter-spacing: 0.5px; line-height: 1;
    }
    .home-metric-value.is-lead .sub {
      font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 600;
    }

    /* Quiet inline action — used for "Choose another workout" and "Log weight".
       Text-weight, never a button slab, but still a real 44px target. */
    .home-action {
      display: inline-flex; align-items: center; gap: 5px;
      min-height: 44px;
      background: none; border: none; padding: 0;
      font-family: 'Barlow', sans-serif;
      font-size: 13px; font-weight: 600;
      color: var(--mm-text-secondary);
      text-decoration: none; cursor: pointer;
    }
    .home-action::after { content: '›'; font-size: 16px; line-height: 1; color: var(--mm-text-tertiary); }
    .home-action:hover { color: var(--mm-text); }
    .home-action:focus-visible {
      outline: 2px solid var(--mm-accent); outline-offset: 3px; border-radius: 6px;
    }

    /* Hero state dot — the text beside it always says the same thing, so the
       colour is emphasis only, never the sole carrier of meaning. */
    .mm-hero-meta.is-done::before,
    .mm-hero-meta.is-live::before {
      content: ''; display: inline-block;
      width: 7px; height: 7px; border-radius: 50%;
      margin-right: 7px; vertical-align: middle;
    }
    .mm-hero-meta.is-done::before { background: var(--mm-success); }
    .mm-hero-meta.is-live::before { background: var(--mm-accent); }

    /* An action sitting in a section header. Keeps the full 44px tap target
       while collapsing its box vertically, so the header row does not grow. */
    .home-action--section {
      min-height: 44px; margin: -12px 0; align-self: center;
    }

    /* The alternate-workout path, inside the hero beneath the primary CTA.
       Standing alone under the card it read as a second, competing action; here
       it is plainly subordinate to START WORKOUT — same quiet text weight, one
       level down. `display: flex` puts it on its own line after the inline-flex
       CTA, and `fit-content` stops the 44px box from spanning the whole card
       and becoming an invisible full-width target. The negative bottom margin
       absorbs the box's own dead space so the card keeps its 20px optical
       padding; the tap target itself is untouched. */
    .home-action--hero {
      display: flex; width: fit-content; margin: 0 0 -14px;
    }

    /* Progress is ONE row: weight, then trend as quieter context, then the
       action. The weight used to live in the section-header value slot, which
       put it diagonally opposite its own action — top-right versus bottom-left.
       Bringing it into the row makes the three read as a single statement, and
       wrapping means a long value or a large text size never overflows. */
    .home-progress {
      display: flex; align-items: baseline; flex-wrap: wrap;
      gap: 4px 14px; margin-top: 2px;
    }
    .home-weight {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px; letter-spacing: 0.5px; line-height: 1;
      color: var(--mm-text); white-space: nowrap;
    }
    .home-trend { font-size: 13px; font-weight: 600; color: var(--mm-text-secondary); }
    /* No trend yet — collapse entirely so nothing marks where one would go. */
    .home-trend:empty { display: none; }
    /* The action sits right regardless of what precedes it, and centres against
       the row rather than trying to share a text baseline with a 44px box. */
    .home-progress .home-action { margin-left: auto; align-self: center; }
    .home-trend.down { color: var(--mm-success); }
    .home-trend.up   { color: var(--mm-warning); }
    .home-trend .muted { color: var(--mm-text-tertiary); font-weight: 600; }

    /* Quiet empty states — never a card, never a paragraph. */
    .home-empty { font-size: 13px; color: var(--mm-text-tertiary); padding: 2px 0 6px; }

    /* ── Log / Edit Weight modal ────────────────────────────────────────
       Markup comes from weight.js (wlModalMarkup) and uses these shared class
       names, so Home must style them even though it defines no modal of its
       own. Without these rules the modal renders inline and always-visible. */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.82); backdrop-filter: blur(6px);
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--mm-surface-raised); border: 1px solid var(--mm-line);
      border-radius: 14px; padding: 22px 18px;
      width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1.5px; }
    .modal-close {
      min-width: 44px; min-height: 44px; background: none; border: none;
      color: var(--mm-text-tertiary); font-size: 18px; cursor: pointer;
    }
    .modal-close:hover { color: var(--mm-text); }
    .modal-close:focus-visible { outline: 2px solid var(--mm-accent); outline-offset: 2px; border-radius: 6px; }
    .field-group { margin-bottom: 14px; }
    .field-label {
      display: block; font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mm-text-tertiary); margin-bottom: 6px;
    }
    .field-optional { font-weight: 400; text-transform: none; letter-spacing: 0; }
    .field-group input {
      width: 100%; min-height: 44px; padding: 10px 12px;
      background: var(--mm-surface); border: 1px solid var(--mm-line);
      border-radius: 8px; color: var(--mm-text);
      font-family: 'Barlow', sans-serif; font-size: 16px; appearance: none;
    }
    .field-group input:focus-visible {
      outline: 2px solid var(--mm-accent); outline-offset: 1px; border-color: var(--mm-accent);
    }
    .btn-calc {
      width: 100%; min-height: 48px; margin-top: 8px; padding: 12px;
      background: var(--mm-accent); border: none; border-radius: 8px;
      color: var(--mm-accent-contrast);
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px;
      cursor: pointer;
    }
    .btn-calc:focus-visible { outline: 2px solid var(--mm-accent-contrast); outline-offset: 2px; }

    /* .toast lives in app-shell.css */

    @media (prefers-reduced-motion: reduce) {
      .home-row, .header-profile { transition: none; }
    }

    @media (max-width: 480px) {
      .container { padding: 20px 12px calc(24px + var(--mm-bottom-clearance, 0px)); }
    }
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#121011">
  <meta name="application-name" content="Muscle Motivation">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Muscle Motivation">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script src="sw-register.js" defer></script>
  <script src="pwa-install.js" defer></script>
  <script src="pwa-install-ui.js" defer></script>
  <script src="pwa-install-register.js" defer></script>
  <script src="app-nav.js" defer></script>
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="safe-area.css">
</head>
<body>

<!-- Auth gate -->
<div id="authGate">
  <img src="logow.png" alt="Muscle Motivation">
  <p>Loading...</p>
</div>

<!-- Dashboard -->
<div id="appContent" style="display:none;">

  <a class="mm-skip-link" href="#mmMain">Skip to content</a>

  <header>
    <a class="header-logo" href="app.html">
      <img src="logow.png" alt="Muscle Motivation">
      <span>Muscle Motivation</span>
    </a>
    <a class="header-profile" href="profile.html" aria-label="Profile and settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>
      </svg>
    </a>
  </header>

  <main class="container" id="mmMain" tabindex="-1">
    <h1 class="mm-visually-hidden">Dashboard</h1>

    <!-- ── A · TODAY'S PLAN ─────────────────────────────────────────────
         The one dominant surface, and the first thing under the header. It
         carries no section label: "Today's Plan" already states the context,
         so a "TRAIN" heading above it was a second, redundant title. Keeps a
         container because it carries the screen's primary action. Renders the
         no-image fallback; hero photography remains deferred.

         The alternate path lives INSIDE the card, under the CTA — outside it
         read as a competing action floating between two sections. -->
    <section class="mm-hero" aria-labelledby="todayTitle">
      <div class="mm-hero-body">
        <div class="mm-hero-eyebrow">Today's Plan</div>
        <h2 class="mm-hero-title" id="todayTitle">&nbsp;</h2>
        <div class="mm-hero-meta" id="todayMeta" hidden></div>
        <a class="mm-hero-cta" id="todayCta" href="workout.html" hidden></a>
        <button class="home-action home-action--hero" id="todayAlt" hidden></button>
      </div>
    </section>

    <!-- ── B · THIS WEEK ────────────────────────────────────────────────
         No container. The count and the day strip both read training.week, so
         they can never disagree — which is exactly why the horizontal meter
         that used to sit beneath the strip was removed: it was a third drawing
         of the same one number. The strip already shows how many days are
         ticked AND which ones, so it strictly dominates a bar. -->
    <div class="mm-section">
      <h2 class="mm-section-label">This Week</h2>
      <span class="mm-section-value" id="weekValue">—</span>
    </div>
    <a class="home-row" href="workout-history.html">
      <div class="mm-daystrip" id="weekStrip" role="list"></div>
      <span class="mm-visually-hidden">View workout history</span>
    </a>

    <!-- ── C · NUTRITION ────────────────────────────────────────────────
         No container, deliberately quieter than the hero. -->
    <div class="mm-section">
      <h2 class="mm-section-label">Nutrition</h2>
      <!-- The section's own action, in the value slot Nutrition leaves empty.
           Deep-links into the EXISTING Quick Log flow on nutrition.html. -->
      <a class="home-action home-action--section" href="nutrition.html#quicklog">Quick log</a>
    </div>
    <a class="home-row" href="nutrition.html" id="nutRow">
      <div id="nutBody"></div>
      <span class="mm-visually-hidden">Open nutrition</span>
    </a>

    <!-- ── D · COACH INSIGHT ────────────────────────────────────────────
         The seat the AI Coach will occupy. Deterministic evidence only, and
         hidden entirely when nothing is evidence-backed. -->
    <section class="mm-insight" id="insightRow" hidden>
      <span class="mm-insight-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" focusable="false">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/>
        </svg>
      </span>
      <div class="mm-insight-body">
        <div class="mm-insight-label">Coach Insight</div>
        <p class="mm-insight-text" id="insightText"></p>
        <a class="mm-insight-action" id="insightAction" hidden></a>
      </div>
    </section>

    <!-- ── E · PROGRESS ─────────────────────────────────────────────────
         No container. Log weight lives here as a quiet inline action. -->
    <div class="mm-section">
      <h2 class="mm-section-label">Progress</h2>
    </div>
    <div class="home-progress">
      <span class="home-weight" id="progValue">—</span>
      <span class="home-trend" id="progTrend"></span>
      <button class="home-action" id="logWeightBtn" onclick="wlOpenModal()">Log weight</button>
    </div>

  </main>

  <!-- Shared primary navigation (markup owned by app-nav.js) -->
  <div id="appNavMount"></div>
</div><!-- /appContent -->

<!-- Log / Edit Weight Modal (markup injected by weight.js) -->
<div id="weightModalMount"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js" integrity="sha384-3wY11tldQ5+yWqAvmTN4XtQvnjoTva0cV15O/O/O5NTtp0ivVopSzLOzsVXWZse9" crossorigin="anonymous"></script>
<script src="supabase.js"></script>
<script src="schedules.js"></script>
<script src="program-state.js"></script>
<script src="weight.js"></script>
<script src="metrics.js"></script>
<script src="snapshot.js"></script>
<script src="dashboard-model.js"></script>
<script>

  // Home consumes SHARED state only: snapshot.js supplies training, nutrition,
  // weight and body-composition domain state; program-state.js supplies the
  // active program/session; dashboard-model.js decides priority and fallbacks.
  // This page owns no fitness intelligence and performs no per-metric queries.

  var currentProfile = null;
  var currentUserId  = null;
  var inProgressId   = null;

  document.getElementById('weightModalMount').innerHTML = wlModalMarkup();

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 3000);
  }

  // Meters are driven by ONE custom property (the .mm-meter contract).
  function setMeter(id, pct, modifier) {
    var el = document.getElementById(id);
    if (!el) return;
    var p = Math.max(0, Math.min(100, Math.round(pct || 0)));
    el.className = 'mm-meter' + (modifier ? ' mm-meter--' + modifier : '');
    el.style.setProperty('--mm-meter-pct', p + '%');
    el.setAttribute('aria-valuenow', String(p));
    // Zero reads as an empty track. Only a genuine non-zero value draws a fill,
    // which the shell then floors to one bar-height so it stays visible.
    if (p === 0) el.setAttribute('data-empty', 'true');
    else el.removeAttribute('data-empty');
  }

  window.addEventListener('load', function () {
    (async () => {
      try {
        var session = await requireAuth();
        var user = session.user;
        currentUserId = user.id;
        var profile = await getProfile(user.id);
        currentProfile = profile;

        if (!profile || !profile.onboarding_complete) {
          window.location.href = 'onboarding.html';
          return;
        }

        // PWA install onboarding (Phase 4.3.3): reaching the personalized
        // dashboard after onboarding is an approved meaningful-value moment.
        // Narrow signal only — no logged/user content is included.
        try { window.dispatchEvent(new CustomEvent('mm:pwa-value', { detail: { type: 'dashboard' } })); } catch (e) {}

        document.getElementById('authGate').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        lucide.createIcons();

        await renderDashboard(user.id);

        if (new URLSearchParams(window.location.search).get('purchase') === 'success') {
          showToast('Purchase successful — your program is now unlocked.');
          history.replaceState(null, '', window.location.pathname);
        }
      } catch (err) {
        console.error('Dashboard error:', err);
        window.location.href = 'auth.html';
      }
    })();
  });

  // ONE pass: every section is derived from the same shared state.
  async function renderDashboard(userId) {
    var results = await Promise.all([
      buildUserSnapshot(userId, { profile: currentProfile }).catch(function (e) {
        console.error('snapshot:', e); return null;
      }),
      loadProgramState(userId),
      loadInProgress(userId),
    ]);

    var model = DashboardModel.buildDashboardModel({
      snapshot: results[0],
      profile: currentProfile,
      program: results[1],
      inProgressWorkout: results[2],
      hourOfDay: new Date().getHours(),
    });

    renderToday(model.today);
    renderWeek(model.week);
    renderNutrition(model.nutrition);
    renderInsight(model.focus);
    renderProgress(model.progress);
  }

  async function loadProgramState(userId) {
    try {
      var owned = await pgLoadOwnedPrograms(userId);
      var activeSlug = await pgResolveActive(userId, currentProfile, owned);
      if (!activeSlug) return owned.length > 1 ? { needsSelection: true } : null;
      return await pgResolveSession(userId, activeSlug, currentProfile.training_days);
    } catch (e) {
      console.error('loadProgramState:', e);
      return null;
    }
  }

  async function loadInProgress(userId) {
    try {
      // Most recent unfinished workout, regardless of age — an unfinished
      // session must never become an invisible orphan.
      var res = await supabaseClient
        .from('workouts').select('id, name')
        .eq('user_id', userId).eq('completed', false)
        .order('created_at', { ascending: false }).limit(1).maybeSingle();
      if (!res.data) return null;
      inProgressId = res.data.id;
      return res.data;
    } catch (e) {
      console.error('loadInProgress:', e);
      return null;
    }
  }

  // ── A · TODAY'S PLAN ─────────────────────────────────────────────────
  // Every priority state from the model renders in the same hero shape:
  // resume · already trained · programmed session · choose program · open.
  function renderToday(t) {
    document.getElementById('todayTitle').textContent = t.title;

    var meta = document.getElementById('todayMeta');
    if (t.status) {
      meta.textContent = t.status;
      meta.className = 'mm-hero-meta' +
        (t.state === 'done' ? ' is-done' : t.state === 'resume' ? ' is-live' : '');
      meta.hidden = false;
    } else {
      meta.hidden = true;
    }

    var cta = document.getElementById('todayCta');
    if (t.cta) {
      cta.textContent = t.cta.label;
      cta.href = t.cta.href;
      cta.hidden = false;
    } else {
      cta.hidden = true;
    }

    var alt = document.getElementById('todayAlt');
    if (t.secondary) {
      alt.textContent = t.secondary.label;
      alt.hidden = false;
      alt.onclick = t.secondary.action === 'discard'
        ? discardSession
        : function () { window.location.href = t.secondary.href; };
    } else {
      alt.hidden = true;
    }
  }

  // ── B · THIS WEEK ────────────────────────────────────────────────────
  // Day cells carry only honest state: completed, today, or neither.
  function renderWeek(w) {
    document.getElementById('weekValue').textContent = w.hasData ? w.label : '—';

    var strip = document.getElementById('weekStrip');
    strip.innerHTML = (w.days || []).map(function (d) {
      var cls = 'mm-day' +
        (d.completed ? ' is-done' : '') +
        (d.isToday ? ' is-today' : '') +
        (!d.completed && !d.isToday && d.isFuture ? ' is-future' : '');
      // Both meanings are announced when a day is today AND completed.
      var state = (d.isToday ? 'today, ' : '') + (d.completed ? 'completed' : 'not completed');
      return '<div class="' + cls + '" role="listitem">' +
        '<span class="mm-day-label" aria-hidden="true">' + esc(d.label) + '</span>' +
        '<span class="mm-day-dot"></span>' +
        '<span class="mm-visually-hidden">' + esc(d.weekday) + ': ' + state + '</span>' +
      '</div>';
    }).join('');
    // No meter here by design. w.pct / w.complete stay in the shared model for
    // other consumers, but Home draws the week ONCE: the count states the
    // number, the strip states which days. A bar restated the count a third
    // time and was the only duplicated progress indicator on the screen.
  }

  // ── C · NUTRITION ────────────────────────────────────────────────────
  // Two compact metrics + two thin meters. Ordinary progress uses the ACCENT;
  // amber appears only when genuinely over target.
  function renderNutrition(n) {
    var body = document.getElementById('nutBody');

    if (!n.hasData) {
      body.innerHTML = '<div class="home-empty">Not available</div>';
      return;
    }
    if (!n.logged) {
      body.innerHTML = '<div class="home-empty">Nothing logged yet today</div>';
      return;
    }

    // Category colouring, matching the nutrition page: green identifies
    // CALORIES, the accent identifies macro progress. Amber still overrides
    // when genuinely over target — that is semantic, not categorical.
    var calValue, calPct, calMod = 'calories';
    if (n.hasTargets) {
      calValue = n.left.toLocaleString() + ' <span class="sub">kcal ' + (n.over ? 'over' : 'left') + '</span>';

      calPct = n.pct;
      if (n.over) calMod = 'warning';
    } else {
      calValue = n.consumed.toLocaleString() + ' <span class="sub">kcal today</span>';
      calPct = 0;
    }

    var html =
      '<div class="home-metric">' +
        '<span class="home-metric-label">Calories</span>' +
        '<span class="home-metric-value is-lead">' + calValue + '</span>' +
      '</div>' +
      '<div class="mm-meter" id="nutCalMeter"' + (n.hasTargets ? '' : ' data-empty="true"') +
        ' role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Calories">' +
        '<div class="mm-meter-fill"></div></div>';

    if (n.protein.target) {
      html +=
        '<div class="home-metric">' +
          '<span class="home-metric-label">Protein</span>' +
          '<span class="home-metric-value">' + n.protein.consumed +
            ' <span class="sub">/ ' + n.protein.target + ' g</span></span>' +
        '</div>' +
        '<div class="mm-meter" id="nutProMeter" role="progressbar" aria-valuemin="0"' +
          ' aria-valuemax="100" aria-label="Protein">' +
          '<div class="mm-meter-fill"></div></div>';
    } else if (n.protein.consumed) {
      html +=
        '<div class="home-metric">' +
          '<span class="home-metric-label">Protein</span>' +
          '<span class="home-metric-value">' + n.protein.consumed + ' <span class="sub">g</span></span>' +
        '</div>';
    }

    body.innerHTML = html;
    setMeter('nutCalMeter', calPct, calMod);
    if (n.protein.target) {
      // Hitting a protein target IS a genuine achievement, so success colour
      // is earned here — unlike ordinary partial progress.
      // Protein stays on the ACCENT at every value. Turning it green on
      // completion would give green two meanings on one screen — "this is
      // calories" and "this is finished" — which is exactly the category
      // ambiguity this treatment exists to remove. Hitting the target is
      // already conveyed by the numbers reading 217 / 217 g and a full bar.
      setMeter('nutProMeter', n.protein.pct, null);
    }
  }

  // ── D · COACH INSIGHT ────────────────────────────────────────────────
  // One evidence-backed line, or nothing at all. Never AI-flavoured, never a
  // paragraph. Default treatment is the accent — not a warning.
  function renderInsight(f) {
    var el = document.getElementById('insightRow');
    var action = document.getElementById('insightAction');
    if (!f) { el.hidden = true; return; }

    document.getElementById('insightText').textContent = f.text;
    // Default is the theme accent. Semantic styling is applied ONLY when the
    // model marks an insight as genuinely semantic — a routine nudge like
    // "food logged 1 of 7 days" must never be dressed as an error.
    el.className = 'mm-insight' + (f.severity ? ' mm-insight--' + f.severity : '');

    if (f.action) {
      action.textContent = f.action.label;
      action.href = f.action.href;
      action.hidden = false;
    } else {
      action.hidden = true;
    }
    el.hidden = false;
  }

  // ── E · PROGRESS ─────────────────────────────────────────────────────
  function renderProgress(p) {
    var valueEl = document.getElementById('progValue');
    var trendEl = document.getElementById('progTrend');

    if (!p.hasData) {
      // No weight to show — the empty state carries the whole message, so a
      // lone em dash beside it would be noise. The action stays useful.
      valueEl.hidden = true;
      trendEl.className = 'home-trend';
      trendEl.innerHTML = '<span class="muted">No weigh-ins yet</span>';
      return;
    }
    valueEl.hidden = false;
    valueEl.textContent = p.current + ' ' + p.unit;

    if (p.change30 == null) {
      // One weigh-in is not a trend — say nothing rather than invent one.
      trendEl.className = 'home-trend';
      trendEl.textContent = '';
      return;
    }
    var arrow = p.direction === 'down' ? '↓' : p.direction === 'up' ? '↑' : '±';
    trendEl.className = 'home-trend ' + esc(p.direction);
    trendEl.innerHTML = arrow + ' ' + Math.abs(p.change30) + ' ' + esc(p.unit) +
      ' <span class="muted">this month</span>';
  }

  // ── Weight modal hook ────────────────────────────────────────────────
  // wlSave() already toasts and has synced profiles.weight_lbs — just re-derive.
  window.onWeightSaved = async function () {
    if (!currentUserId) return;
    currentProfile = await getProfile(currentUserId);
    await renderDashboard(currentUserId);
  };

  async function discardSession() {
    if (!inProgressId) return;
    if (!confirm('Discard this unfinished session? This cannot be undone.')) return;
    var res = await supabaseClient.from('workouts').delete().eq('id', inProgressId);
    if (res.error) { showToast('Error discarding — try again.'); return; }
    inProgressId = null;
    showToast('Session discarded.');
    await renderDashboard(currentUserId);
  }

</script>
</body>
</html>
