<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Routine Studio — Muscle Motivation</title>
  <!-- Standard app-shell metadata. This page is unlinked and noindex, but it
       still honours the repo-wide PWA and error-reporting invariants rather
       than carving out an exemption for itself. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#121011" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Muscle Motivation" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <script src="mm-errors.js" defer></script>
  <!-- Internal platform-authoring surface (Phase 4.3.6 CP6).
       Deliberately NOT linked from any navigation and NOT part of the normal
       app bundle: Home / Train / Nutrition / Progress load none of this.

       This page has NO security of its own and does not pretend to. Every
       privileged action goes to /api/routine-admin, which verifies the bearer
       token server-side and checks a server-only allowlist. Loading this page
       while unauthorized simply produces 403s and an empty screen. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app-shell.css">
  <style>
    :root {
      --bg: #050505; --surface-1: #0d0d0d; --surface-2: #141414;
      --border-1: #1f1f1f; --border-2: #262626;
      --text-1: #fff; --text-secondary: #b8b8b8; --text-muted: #777;
      --red: #b1121b; --green: #22c55e; --green-muted: rgba(34,197,94,0.10);
      --amber: #e0a800;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text-1);
      font-family: 'Barlow', sans-serif; font-size: 15px; line-height: 1.5;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 2px;
      margin: 0 0 4px;
    }
    .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
    .label {
      font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--red);
      text-transform: uppercase; margin: 28px 0 10px; display: flex; gap: 10px;
      align-items: center;
    }
    .label::after { content: ''; flex: 1; height: 1px; background: var(--border-1); }
    .card {
      background: var(--surface-1); border: 1px solid var(--border-2);
      border-radius: 10px; padding: 16px 18px; margin-bottom: 10px;
    }
    .row { display: flex; align-items: center; gap: 10px; }
    .grow { flex: 1; min-width: 0; }
    .rname { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
    .rmeta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    .pill {
      flex-shrink: 0; padding: 4px 8px; border-radius: 5px; font-size: 10px;
      font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    }
    .pill-draft { background: var(--surface-2); color: var(--text-secondary); }
    .pill-live { background: var(--green-muted); color: var(--green); }
    .field { margin-bottom: 12px; }
    .field label {
      display: block; font-size: 11px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px;
    }
    input, select, textarea {
      width: 100%; padding: 10px 12px; background: var(--surface-2);
      border: 1px solid var(--border-2); border-radius: 7px; color: var(--text-1);
      font-family: 'Barlow', sans-serif; font-size: 15px;
    }
    textarea { min-height: 76px; resize: vertical; }
    button {
      min-height: 44px; padding: 11px 18px; border: none; border-radius: 7px;
      font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1.5px;
      cursor: pointer; transition: opacity .2s;
    }
    button:hover { opacity: .85; }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-ghost { background: transparent; color: var(--text-1); border: 1px solid var(--border-2); }
    .btn-go { background: var(--green); color: #06210f; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .why {
      margin-top: 10px; padding: 10px 12px; border-radius: 7px;
      background: rgba(224,168,0,.08); border: 1px solid rgba(224,168,0,.25);
      font-size: 13px; color: var(--amber);
    }
    .why ul { margin: 6px 0 0; padding-left: 18px; }
    .ok { color: var(--green); font-size: 13px; margin-top: 10px; }
    .ex { border-top: 1px solid var(--border-1); padding: 9px 0; font-size: 14px; }
    .ex:last-child { border-bottom: 1px solid var(--border-1); }
    .ex-sub { font-size: 12px; color: var(--text-muted); }
    .ex-warn { color: var(--amber); }
    .empty { color: var(--text-muted); font-size: 13px; padding: 20px 0; text-align: center; }
    .gate { padding: 40px 0; text-align: center; color: var(--text-muted); }
    dialog { border: none; background: transparent; padding: 0; }
    dialog::backdrop { background: rgba(0,0,0,.72); }
    .modal {
      background: var(--surface-1); border: 1px solid var(--border-2);
      border-radius: 12px; padding: 22px; max-width: 460px; width: calc(100vw - 32px);
      color: var(--text-1);
    }
    .modal h2 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 1.5px; margin: 0 0 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Routine Studio</h1>
    <div class="sub">Internal platform-Routine authoring. Every action is authorized server-side.</div>

    <div id="gate" class="gate">Checking access…</div>

    <div id="studio" hidden>
      <div class="label">Platform Routines</div>
      <div id="list"><div class="empty">Loading…</div></div>
      <div class="btns"><button class="btn-primary" onclick="newDraft()">New Draft</button></div>

      <div id="editor" hidden>
        <div class="label">Edit Routine</div>
        <div class="card">
          <div class="field"><label for="fName">Name</label>
            <input id="fName" maxlength="80" /></div>
          <div class="field"><label for="fDesc">Description</label>
            <textarea id="fDesc" maxlength="600"></textarea></div>
          <div class="field"><label for="fGoal">Goal</label>
            <select id="fGoal">
              <option value="">—</option>
              <option value="fatloss">Fat Loss</option>
              <option value="recomp">Recomposition</option>
              <option value="muscle">Muscle Gain</option>
            </select></div>
          <div class="field"><label for="fDiff">Difficulty</label>
            <input id="fDiff" maxlength="40" placeholder="e.g. Beginner – Intermediate" /></div>
          <div class="field"><label for="fTags">Tags (comma separated)</label>
            <input id="fTags" maxlength="200" /></div>
          <div class="btns">
            <button class="btn-primary" onclick="saveDraft()">Save</button>
            <button class="btn-ghost" onclick="closeEditor()">Close</button>
          </div>
        </div>

        <div class="label">Preview</div>
        <div class="card" id="preview"></div>
        <div id="eligibility"></div>
        <div class="btns" id="lifecycleBtns"></div>
      </div>
    </div>
  </div>

  <dialog id="confirmDlg">
    <form method="dialog" class="modal">
      <h2 id="cTitle">Publish Routine</h2>
      <div id="cBody" style="font-size:14px;color:var(--text-secondary)"></div>
      <div class="btns">
        <!-- type="button": the confirm action is driven by its own click
             handler, NOT by the dialog's close event. Closing a <dialog> via
             a method="dialog" form submission did not reliably fire `close`,
             which silently swallowed publish and unpublish. -->
        <button class="btn-go" id="cGo" type="button">Confirm</button>
        <button class="btn-ghost" value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js" integrity="sha384-3wY11tldQ5+yWqAvmTN4XtQvnjoTva0cV15O/O/O5NTtp0ivVopSzLOzsVXWZse9" crossorigin="anonymous"></script>
<script src="supabase.js"></script>
<script src="routine-core.js"></script>
<script src="routine-lifecycle.js"></script>
<script>
/* No privileged value lives in this file. The allowlist is server-only; this
   page merely calls the API and renders whatever it is allowed to see. */
var current = null;
var token = null;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

async function api(action, payload) {
  var res = await fetch('/api/routine-admin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify(Object.assign({ action: action }, payload || {})),
  });
  var body = await res.json().catch(function () { return {}; });
  return { ok: res.ok, status: res.status, body: body };
}

var REASONS = {
  not_platform_routine: 'Not a platform Routine.',
  already_published: 'Already published.',
  missing_name: 'Add a name.',
  missing_description: 'Add a description.',
  missing_goal: 'Choose a goal.',
  invalid_goal: 'Goal is not one of fatloss / recomp / muscle.',
  no_exercises: 'Add at least one exercise.',
  invalid_prescription: 'One or more exercises are malformed.',
  legacy_identity: 'Every exercise needs a canonical library exercise. ' +
    'Name-only and custom exercises cannot be published.',
  not_found: 'Routine not found.',
  not_published: 'This Routine is not published.',
};

function renderList(routines) {
  if (!routines.length) {
    document.getElementById('list').innerHTML =
      '<div class="empty">No platform Routines yet.</div>';
    return;
  }
  document.getElementById('list').innerHTML = routines.map(function (r) {
    var live = r.state === 'platform_published';
    return '<div class="card"><div class="row">' +
      '<div class="grow"><div class="rname">' + esc(r.name) + '</div>' +
      '<div class="rmeta">' + (r.exercises || []).length + ' exercises' +
      (r.goal ? ' · ' + esc(r.goal) : '') + '</div></div>' +
      '<span class="pill ' + (live ? 'pill-live' : 'pill-draft') + '">' +
        (live ? 'Published' : 'Draft') + '</span>' +
      '</div><div class="btns"><button class="btn-ghost" onclick="openRoutine(\'' +
      esc(r.id) + '\')">Open</button></div></div>';
  }).join('');
}

async function refresh() {
  var r = await api('list');
  if (!r.ok) { document.getElementById('list').innerHTML =
    '<div class="empty">Could not load.</div>'; return; }
  renderList(r.body.routines || []);
}

async function newDraft() {
  var name = prompt('Name for the new platform Routine draft:');
  if (!name || !name.trim()) return;
  var r = await api('create', { name: name.trim(), exercises: [] });
  if (!r.ok) { alert(r.body.error || 'Could not create.'); return; }
  await refresh();
  openRoutine(r.body.routine.id);
}

async function openRoutine(id) {
  var r = await api('get', { id: id });
  if (!r.ok) { alert(r.body.error || 'Not found.'); return; }
  current = r.body.routine;
  document.getElementById('editor').hidden = false;
  document.getElementById('fName').value = current.name || '';
  document.getElementById('fDesc').value = current.description || '';
  document.getElementById('fGoal').value = current.goal || '';
  document.getElementById('fDiff').value = current.difficulty || '';
  document.getElementById('fTags').value = (current.tags || []).join(', ');
  renderPreview(current, r.body.eligibility, r.body.state);
  document.getElementById('editor').scrollIntoView({ behavior: 'smooth' });
}

function closeEditor() { current = null; document.getElementById('editor').hidden = true; }

/* Preview renders the REAL prescription from the stored contract. It never
   changes visibility — nothing here publishes. */
function renderPreview(r, eligibility, state) {
  var ex = (r.exercises || []).map(function (e) {
    var legacy = !e.exercise_id;
    return '<div class="ex"><div>' + esc(e.name) +
      (legacy ? ' <span class="ex-warn">· no canonical exercise</span>' : '') + '</div>' +
      '<div class="ex-sub">' + e.sets + ' × ' + e.reps_low + '–' + e.reps_high +
      ' · rest ' + e.rest_sec + 's' + (e.notes ? ' · ' + esc(e.notes) : '') +
      '</div></div>';
  }).join('') || '<div class="empty">No exercises yet.</div>';

  document.getElementById('preview').innerHTML =
    '<div class="rname">' + esc(r.name) + '</div>' +
    '<div class="rmeta">' + [r.goal, r.difficulty, (r.tags || []).join(', ')]
      .filter(Boolean).map(esc).join(' · ') + '</div>' +
    (r.description ? '<p style="font-size:14px;color:var(--text-secondary)">' +
      esc(r.description) + '</p>' : '') + ex;

  var el = document.getElementById('eligibility');
  if (eligibility && eligibility.eligible) {
    el.innerHTML = '<div class="ok">Ready to publish.</div>';
  } else if (eligibility) {
    el.innerHTML = '<div class="why">Not publishable yet:<ul>' +
      eligibility.reasons.map(function (c) {
        return '<li>' + esc(REASONS[c] || c) + '</li>';
      }).join('') + '</ul></div>';
  } else { el.innerHTML = ''; }

  var live = state === 'platform_published';
  document.getElementById('lifecycleBtns').innerHTML = live
    ? '<button class="btn-ghost" onclick="doUnpublish()">Unpublish</button>'
    : '<button class="btn-go" onclick="doPublish()"' +
      (eligibility && eligibility.eligible ? '' : ' disabled style="opacity:.4"') +
      '>Publish…</button>';
}

async function saveDraft() {
  if (!current) return;
  var tags = document.getElementById('fTags').value
    .split(',').map(function (t) { return t.trim(); }).filter(Boolean);
  var r = await api('update', {
    id: current.id,
    name: document.getElementById('fName').value,
    description: document.getElementById('fDesc').value,
    goal: document.getElementById('fGoal').value,
    difficulty: document.getElementById('fDiff').value,
    tags: tags,
  });
  if (!r.ok) { alert(r.body.error || 'Could not save.'); return; }
  current = r.body.routine;
  renderPreview(current, r.body.eligibility, r.body.state);
  await refresh();
}

function confirmThen(title, bodyHtml, run) {
  var dlg = document.getElementById('confirmDlg');
  document.getElementById('cTitle').textContent = title;
  document.getElementById('cBody').innerHTML = bodyHtml;

  // The action hangs off the confirm button's OWN click, so it cannot be lost
  // to dialog close-event semantics. Cloning the node first drops any handler
  // from a previous confirmation, so an action can never fire twice or fire
  // the wrong one.
  var go = document.getElementById('cGo');
  var fresh = go.cloneNode(true);
  go.parentNode.replaceChild(fresh, go);
  fresh.addEventListener('click', function () {
    dlg.close('go');
    run();
  });

  dlg.showModal();
}

/* Publishing is never a silent toggle: the author confirms against the name,
   the exercise count and the eligibility result. */
function doPublish() {
  if (!current) return;
  confirmThen('Publish Routine',
    '<strong>' + esc(current.name) + '</strong><br>' +
    (current.exercises || []).length + ' exercises · ' +
    esc(current.goal || 'no goal') + '<br><br>' +
    'This makes the Routine a published platform Routine.',
    async function () {
      var r = await api('publish', { id: current.id });
      if (!r.ok) { alert((r.body.error || 'Could not publish.')); return; }
      current = r.body.routine;
      renderPreview(current, { eligible: false, reasons: ['already_published'] }, r.body.state);
      await refresh();
    });
}

function doUnpublish() {
  if (!current) return;
  confirmThen('Unpublish Routine',
    '<strong>' + esc(current.name) + '</strong><br><br>' +
    'This returns it to draft. Nothing is deleted.',
    async function () {
      var r = await api('unpublish', { id: current.id });
      if (!r.ok) { alert(r.body.error || 'Could not unpublish.'); return; }
      var g = await api('get', { id: current.id });
      current = g.body.routine;
      renderPreview(current, g.body.eligibility, g.body.state);
      await refresh();
    });
}

window.addEventListener('load', function () {
  (async function () {
    try {
      var { data } = await supabaseClient.auth.getSession();
      if (!data || !data.session) { location.href = 'auth.html'; return; }
      token = data.session.access_token;
      // The server decides. A non-author simply gets 403 and sees nothing.
      var probe = await api('list');
      if (probe.status === 403) {
        document.getElementById('gate').textContent =
          'This account is not a platform author.';
        return;
      }
      document.getElementById('gate').hidden = true;
      document.getElementById('studio').hidden = false;
      renderList((probe.body && probe.body.routines) || []);
    } catch (e) {
      document.getElementById('gate').textContent = 'Could not verify access.';
    }
  })();
});
</script>
</body>
</html>
