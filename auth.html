<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muscle Motivation | Member Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --red:#FF0000; --red-dim:#cc0000; --black:#0a0a0a;
    --surface:#111; --card:#161616; --border:#242424;
    --white:#fff; --grey:#aaa;
    --font-display:'Bebas Neue',Impact,sans-serif;
    --font-body:'Barlow',Arial,sans-serif;
    --radius:10px; --transition:0.22s ease;
  }
  html { scroll-behavior:smooth; }
  body {
    background:var(--black); color:var(--white);
    font-family:var(--font-body); min-height:100vh;
    display:flex; flex-direction:column;
  }

  /* ── Main ── */
  main {
    flex:1; display:flex; align-items:center;
    justify-content:center; padding:48px 20px;
    position:relative; overflow:hidden;
  }
  main::before {
    content:''; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,0,0,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,0,0,0.04) 1px, transparent 1px);
    background-size:50px 50px; pointer-events:none;
  }
  main::after {
    content:''; position:absolute; top:-100px; left:50%;
    transform:translateX(-50%);
    width:600px; height:400px;
    background:radial-gradient(ellipse, rgba(255,0,0,0.1) 0%, transparent 70%);
    pointer-events:none;
  }

  /* ── Outer wrapper ── */
  .auth-wrapper {
    display:flex; flex-direction:column;
    align-items:center; width:100%; max-width:440px;
    position:relative; z-index:1;
  }

  /* ── Branding above card ── */
  .auth-branding {
    display:flex; flex-direction:column;
    align-items:center; gap:10px;
    margin-bottom:28px; text-align:center;
  }
  .auth-branding img {
    height:80px; width:auto;
    display:block;
  }
  .auth-branding .brand-name {
    font-family:var(--font-display);
    font-size:26px; letter-spacing:4px;
    text-transform:uppercase; color:var(--white);
    line-height:1;
  }
  .auth-branding .brand-sub {
    font-family:var(--font-display);
    font-size:13px; letter-spacing:3px;
    text-transform:uppercase; color:var(--red);
    line-height:1;
  }

  /* ── Auth Box ── */
  .auth-box {
    background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:36px 36px 32px;
    width:100%;
  }

  /* ── Tabs ── */
  .auth-tabs {
    display:flex; background:#1a1a1a;
    border-radius:8px; padding:4px;
    margin-bottom:24px; gap:4px;
  }
  .tab-btn {
    flex:1; padding:10px;
    background:transparent; border:none;
    color:var(--grey); font-family:var(--font-body);
    font-size:14px; font-weight:700;
    letter-spacing:0.5px; text-transform:uppercase;
    border-radius:6px; cursor:pointer;
    transition:all var(--transition);
  }
  .tab-btn.active { background:var(--red); color:var(--white); }

  /* ── Social ── */
  .social-btn {
    display:flex; align-items:center; justify-content:center;
    gap:10px; width:100%; padding:13px;
    background:#1c1c1c; border:1px solid var(--border);
    border-radius:var(--radius); color:var(--white);
    font-family:var(--font-body); font-size:14px; font-weight:600;
    cursor:pointer; transition:border-color var(--transition), background var(--transition);
    margin-bottom:10px; text-decoration:none;
  }
  .social-btn:hover { border-color:var(--red); background:#222; }
  .social-btn svg { width:20px; height:20px; flex-shrink:0; }

  .divider {
    display:flex; align-items:center; gap:12px;
    margin:18px 0; color:var(--grey); font-size:12px;
    letter-spacing:1px; text-transform:uppercase;
  }
  .divider::before, .divider::after {
    content:''; flex:1; height:1px; background:var(--border);
  }

  /* ── Form ── */
  .form-group { margin-bottom:16px; }
  .form-group label {
    display:block; font-size:11px; font-weight:700;
    letter-spacing:1px; text-transform:uppercase;
    color:var(--grey); margin-bottom:6px;
  }
  .form-group input {
    width:100%; padding:13px 16px;
    background:#1c1c1c; border:1px solid var(--border);
    border-radius:8px; color:var(--white);
    font-family:var(--font-body); font-size:15px;
    outline:none; transition:border-color var(--transition);
  }
  .form-group input:focus { border-color:var(--red); }
  .form-group input::placeholder { color:#555; }

  .btn-primary {
    width:100%; padding:15px;
    background:var(--red); border:2px solid var(--red);
    border-radius:var(--radius); color:var(--white);
    font-family:var(--font-body); font-size:15px;
    font-weight:700; letter-spacing:0.8px;
    text-transform:uppercase; cursor:pointer;
    transition:background var(--transition), transform var(--transition), box-shadow var(--transition);
    margin-top:8px;
  }
  .btn-primary:hover {
    background:var(--red-dim); border-color:var(--red-dim);
    transform:translateY(-2px); box-shadow:0 8px 24px rgba(255,0,0,0.35);
  }
  .btn-primary:disabled { opacity:0.6; cursor:not-allowed; transform:none; }

  /* ── Messages ── */
  .msg {
    padding:12px 16px; border-radius:8px;
    font-size:14px; margin-bottom:16px; display:none;
  }
  .msg.error  { background:rgba(255,0,0,0.12); border:1px solid rgba(255,0,0,0.3); color:#ff6666; }
  .msg.success{ background:rgba(0,200,100,0.1); border:1px solid rgba(0,200,100,0.3); color:#4dff9e; }
  .msg.show   { display:block; }

  .auth-footer { text-align:center; margin-top:20px; font-size:13px; color:var(--grey); }
  .auth-footer a { color:var(--red); font-weight:600; }
  .auth-footer a:hover { text-decoration:underline; }

  .forgot-link {
    display:block; text-align:right;
    font-size:12px; color:var(--grey);
    margin-top:6px; margin-bottom:4px;
  }
  .forgot-link:hover { color:var(--red); }

  /* ── Spinner ── */
  .spinner {
    width:18px; height:18px; border:2px solid rgba(255,255,255,0.3);
    border-top-color:white; border-radius:50%;
    animation:spin 0.7s linear infinite;
    display:inline-block; vertical-align:middle; margin-right:8px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ── Back link ── */
  .back-link {
    margin-top:20px; color:#555; font-size:13px;
    text-decoration:none; letter-spacing:0.5px;
    transition:color var(--transition);
  }
  .back-link:hover { color:var(--red); }

  /* ── Footer ── */
  footer {
    text-align:center; padding:20px;
    border-top:1px solid var(--border);
    color:#444; font-size:12px;
  }

  @media (max-width:480px) {
    .auth-box { padding:28px 20px; }
    .auth-branding img { height:64px; }
    .auth-branding .brand-name { font-size:22px; }
  }
</style>
</head>
<body>

<main>
  <div class="auth-wrapper">

    <!-- Branding: logo centered above name -->
    <div class="auth-branding">
      <img src="logow.png" alt="Muscle Motivation Logo">
      <div class="brand-name">Muscle Motivation</div>
      <div class="brand-sub">Member Portal</div>
    </div>

    <!-- Card -->
    <div class="auth-box">

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">Create Account</button>
      </div>

      <!-- Message -->
      <div class="msg" id="authMsg"></div>

      <!-- Google -->
      <button class="social-btn" onclick="signInWithGoogle()">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider">or</div>

      <!-- Login Form -->
      <div id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
          <a href="#" class="forgot-link" onclick="return false;">Forgot password? (coming soon)</a>
        </div>
        <button class="btn-primary" id="loginBtn" onclick="handleLogin()">Sign In</button>
        <p class="auth-footer">No account? <a href="#" onclick="switchTab('signup')">Create one free</a></p>
      </div>

      <!-- Signup Form -->
      <div id="signupForm" style="display:none;">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signupName" placeholder="Your full name" autocomplete="name">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="Min. 8 characters" autocomplete="new-password">
        </div>
        <button class="btn-primary" id="signupBtn" onclick="handleSignup()">Create My Account</button>
        <p class="auth-footer">Already a member? <a href="#" onclick="switchTab('login')">Sign in</a></p>
      </div>

    </div><!-- end auth-box -->

    <a href="index.html" class="back-link">← Back to musclemotivation.fit</a>

  </div><!-- end auth-wrapper -->
</main>

<footer>© 2026 Muscle Motivation. All rights reserved.</footer>

<!-- Load CDN first, then supabase.js -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script>

  // Redirect if already logged in — runs after all scripts are guaranteed loaded
  window.addEventListener('load', function() {
    getSession().then(async function(session) {
      if (!session) return;
      var profile = await getProfile(session.user.id);
      window.location.href = (profile && profile.onboarding_complete) ? 'app.html' : 'onboarding.html';
    });
  });

  // Tab switching
  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('loginForm').style.display  = isLogin ? 'block' : 'none';
    document.getElementById('signupForm').style.display = isLogin ? 'none'  : 'block';
    document.getElementById('tabLogin').classList.toggle('active',  isLogin);
    document.getElementById('tabSignup').classList.toggle('active', !isLogin);
    clearMsg();
  }

  function showMsg(text, type='error') {
    const el = document.getElementById('authMsg');
    el.textContent = text;
    el.className = `msg ${type} show`;
  }
  function clearMsg() {
    document.getElementById('authMsg').className = 'msg';
  }

  function setLoading(btnId, loading, label) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.innerHTML = loading ? '<span class="spinner"></span>Please wait...' : label;
  }

  // Email login
  async function handleLogin() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) return showMsg('Please fill in all fields.');
    setLoading('loginBtn', true, 'Sign In');
    try {
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error;
      var session = await getSession();
      var profile = await getProfile(session.user.id);
      window.location.href = (profile && profile.onboarding_complete) ? 'app.html' : 'onboarding.html';
    } catch (e) {
      showMsg(e.message || 'Login failed. Please try again.');
    }
    setLoading('loginBtn', false, 'Sign In');
  }

  // Email signup
  async function handleSignup() {
    const name     = document.getElementById('signupName').value.trim();
    const email    = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    if (!name || !email || !password) return showMsg('Please fill in all fields.');
    if (password.length < 8) return showMsg('Password must be at least 8 characters.');
    setLoading('signupBtn', true, 'Create My Account');
    try {
      const { error } = await supabaseClient.auth.signUp({
        email, password,
        options: { data: { full_name: name } }
      });
      if (error) throw error;
      showMsg('Account created! Check your email to confirm, then sign in.', 'success');
    } catch (e) {
      showMsg(e.message || 'Signup failed. Please try again.');
    }
    setLoading('signupBtn', false, 'Create My Account');
  }

  // Google OAuth
  async function signInWithGoogle() {
    try {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: 'https://musclemotivation.fit/onboarding.html' }
      });
      if (error) throw error;
    } catch (e) {
      showMsg(e.message || 'Google sign-in failed.');
    }
  }

  // Enter key
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const loginVisible = document.getElementById('loginForm').style.display !== 'none';
    if (loginVisible) handleLogin(); else handleSignup();
  });

</script>
</body>
</html>
