<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout History — Muscle Motivation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --red:         #B1121B;
      --red-muted:   rgba(177,18,27,0.12);
      --red-border:  rgba(177,18,27,0.28);
      --bg:          #080808;
      --surface-1:   #0d0d0d;
      --surface-2:   #131313;
      --surface-3:   #1a1a1a;
      --border-1:    #1c1c1c;
      --border-2:    #252525;
      --border-3:    #2f2f2f;
      --text:        #ffffff;
      --text-2:      #a0a0a0;
      --text-muted:  #555555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; overflow-x: hidden;
    }

    #authGate {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; min-height: 100vh;
    }
    #authGate img { width: 72px; margin-bottom: 16px; opacity: 0.6; }
    #authGate p { color: var(--text-muted); font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(8,8,8,0.97); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-1);
      padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between; height: 60px;
    }
    .header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .header-logo img { height: 42px; }
    .header-logo span {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      letter-spacing: 2.5px; color: var(--text); text-transform: uppercase;
    }
    .btn-back {
      padding: 6px 14px; font-size: 11px; font-family: 'Barlow', sans-serif;
      font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      background: transparent; border: 1px solid var(--border-2);
      color: var(--text-muted); border-radius: 6px; cursor: pointer;
      transition: border-color 0.2s, color 0.2s; text-decoration: none;
    }
    .btn-back:hover { border-color: var(--border-3); color: var(--text-2); }

    .container { max-width: 680px; margin: 0 auto; padding: 28px 16px 120px; }

    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 1.5px; }
    .page-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; margin-bottom: 8px; }

    .section-label {
      font-family: 'Barlow', sans-serif; font-size: 11px; font-weight: 700;
      letter-spacing: 2px; color: var(--red); text-transform: uppercase;
      margin-bottom: 12px; margin-top: 24px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border-1); }

    /* History (shares markup with workout.html via workout-history.js) */
    .history-card {
      background: var(--surface-1); border: 1px solid var(--border-2);
      border-radius: 10px; padding: 16px 18px; margin-bottom: 10px;
      cursor: pointer; transition: border-color 0.2s;
    }
    .history-card:hover { border-color: var(--border-3); }
    .history-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .history-name { font-size: 15px; font-weight: 600; }
    .history-date { font-size: 12px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
    .history-sub { font-size: 12px; color: var(--red); font-weight: 600; margin-top: 4px; }
    .history-meta { display: flex; gap: 16px; margin-top: 8px; }
    .history-stat { font-size: 12px; color: var(--text-muted); }
    .history-stat strong { color: var(--text-2); font-weight: 600; }
    .history-exlist { margin-top: 10px; display: none; border-top: 1px solid var(--border-1); padding-top: 10px; }
    .history-card.expanded .history-exlist { display: block; }
    .history-ex-row {
      display: flex; flex-direction: column;
      padding: 6px 0; border-bottom: 1px solid var(--border-1);
    }
    .history-ex-row:last-child { border-bottom: none; }
    .hist-ex-name { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
    .hist-sets-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .hist-set-pill {
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px;
      background: var(--surface-2); border: 1px solid var(--border-2); color: var(--text-muted);
    }
    .hist-set-pill.done { color: #5fb86b; border-color: rgba(95,184,107,.4); background: rgba(95,184,107,.08); }
    .hist-edit-ex { margin-bottom: 12px; }
    .hist-edit-ex-name { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
    .hist-edit-set {
      display: grid; grid-template-columns: 22px 1fr auto 1fr; gap: 6px;
      align-items: center; margin-bottom: 6px;
    }
    .hist-set-num { font-size: 12px; font-weight: 700; color: var(--text-muted); text-align: center; }
    .hist-set-in {
      width: 100%; padding: 7px 6px; background: var(--surface-2);
      border: 1px solid var(--border-2); border-radius: 6px; color: var(--text);
      font-family: 'Barlow', sans-serif; font-size: 13px; text-align: center; outline: none;
      transition: border-color .2s; -moz-appearance: textfield;
    }
    .hist-set-in::-webkit-outer-spin-button, .hist-set-in::-webkit-inner-spin-button { -webkit-appearance: none; }
    .hist-set-in:focus { border-color: var(--red); }
    .hist-x { font-size: 13px; color: var(--text-muted); text-align: center; }
    .hist-name-in {
      width: 100%; padding: 8px 10px; background: var(--surface-2);
      border: 1px solid var(--border-2); border-radius: 6px; color: var(--text);
      font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 600;
      outline: none; margin-bottom: 12px; transition: border-color .2s;
    }
    .hist-name-in:focus { border-color: var(--red); }
    .hist-edit-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-1); }
    .btn-hist-cancel {
      flex: 1; padding: 9px; background: transparent; border: 1px solid var(--border-2);
      border-radius: 7px; color: var(--text-muted); font-size: 12px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      font-family: 'Barlow', sans-serif; transition: border-color .2s;
    }
    .btn-hist-cancel:hover { border-color: var(--text-2); }
    .btn-hist-save {
      flex: 2; padding: 9px; background: var(--red); border: none;
      border-radius: 7px; color: white; font-family: 'Bebas Neue', sans-serif;
      font-size: 17px; letter-spacing: 1.5px; cursor: pointer; transition: opacity .2s;
    }
    .btn-hist-save:hover { opacity: .85; }
    .btn-edit-history {
      padding: 5px 12px; background: transparent; border: 1px solid var(--border-2);
      border-radius: 6px; color: var(--text-muted); font-size: 11px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      font-family: 'Barlow', sans-serif; transition: border-color .2s, color .2s;
    }
    .btn-edit-history:hover { border-color: var(--text-2); color: var(--text-2); }
    .history-delete { padding: 10px 0 0; display: flex; justify-content: flex-end; gap: 8px; }
    .btn-del-history {
      padding: 5px 12px; background: transparent; border: 1px solid var(--border-2);
      border-radius: 6px; color: var(--text-muted); font-size: 11px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      font-family: 'Barlow', sans-serif; transition: border-color 0.2s, color 0.2s;
    }
    .btn-del-history:hover { border-color: var(--red); color: var(--red); }
    .empty-state { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 14px; line-height: 1.6; }
    .empty-state a { color: var(--red); text-decoration: none; font-weight: 600; }
    .empty-state a:hover { text-decoration: underline; }

    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface-2); border: 1px solid var(--border-3);
      color: var(--text); padding: 12px 24px; border-radius: 8px;
      font-size: 14px; font-weight: 600;
      transition: transform 0.35s ease, opacity 0.35s ease;
      opacity: 0; z-index: 999; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (max-width: 480px) {
      header { padding: 0 14px; }
      .header-logo span { display: none; }
      .container { padding: 20px 12px 120px; }
    }
  </style>
</head>
<body>

<div id="authGate">
  <img src="logow.png" alt="Muscle Motivation">
  <p>Loading...</p>
</div>

<div id="appContent" style="display:none;">
  <header>
    <a class="header-logo" href="app.html">
      <img src="logow.png" alt="Muscle Motivation">
      <span>Muscle Motivation</span>
    </a>
    <a class="btn-back" href="app.html">← Dashboard</a>
  </header>

  <div class="container">
    <div class="page-title">Workout History</div>
    <div class="page-sub">Every completed session — tap any workout to see exercises, sets, and weights.</div>

    <div class="section-label">All Workouts</div>
    <div id="historyList">
      <div class="empty-state">Loading…</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script src="schedules.js"></script>
<script src="workout-history.js"></script>
<script>
  var currentUser = null;

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 3000);
  }

  window.addEventListener('load', function() {
    (async () => {
      try {
        var session = await requireAuth();
        currentUser = session.user;

        document.getElementById('authGate').style.display   = 'none';
        document.getElementById('appContent').style.display = 'block';

        // Full chronological list (no limit). Independent of any unfinished
        // session — this page only ever reads completed workouts.
        await loadHistory({
          targetId: 'historyList',
          emptyText: 'No completed workouts yet.<br><a href="workout.html">Start your first session →</a>'
        });

        lucide.createIcons();
      } catch (err) {
        console.error('History page error:', err);
        window.location.href = 'auth.html';
      }
    })();
  });
</script>
</body>
</html>
