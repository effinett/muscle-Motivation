<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nutrition — Muscle Motivation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js" integrity="sha384-ouAVEJVCMsf8Svzn+BwqbaBhxBEA0xgeVBhHnxmWd+Wqyv18yhWCQwGegFD/OHLq" crossorigin="anonymous"></script>
  <style>
    :root {
      --red:         #B1121B;
      --red-muted:   rgba(177,18,27,0.12);
      --red-border:  rgba(177,18,27,0.28);
      --bg:          #080808;
      --surface-1:   #0d0d0d;
      --surface-2:   #131313;
      --surface-3:   #1a1a1a;
      --border-1:    #1c1c1c;
      --border-2:    #252525;
      --border-3:    #2f2f2f;
      --text:        #ffffff;
      --text-2:      #a0a0a0;
      --text-muted:  #555555;
      --green:       #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; overflow-x: hidden;
    }

    #authGate {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; min-height: 100vh;
    }
    #authGate img { width: 72px; margin-bottom: 16px; opacity: 0.6; }
    #authGate p { color: var(--text-muted); font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(8,8,8,0.97); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-1);
      padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between; height: 60px;
    }
    .header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .header-logo img { height: 42px; }
    .header-logo span {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      letter-spacing: 2.5px; color: var(--text); text-transform: uppercase;
    }
    .btn-back {
      padding: 6px 14px; font-size: 11px; font-family: 'Barlow', sans-serif;
      font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      background: transparent; border: 1px solid var(--border-2);
      color: var(--text-muted); border-radius: 6px; cursor: pointer;
      transition: border-color 0.2s, color 0.2s; text-decoration: none;
    }
    .btn-back:hover { border-color: var(--border-3); color: var(--text-2); }

    .container { max-width: 680px; margin: 0 auto; padding: 28px 16px 120px; }

    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 1.5px; }
    .page-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; margin-bottom: 8px; }

    .section-label {
      font-family: 'Barlow', sans-serif; font-size: 11px; font-weight: 700;
      letter-spacing: 2px; color: var(--red); text-transform: uppercase;
      margin-bottom: 12px; margin-top: 24px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border-1); }

    /* Date bar */
    .date-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-top: 16px;
    }
    .date-nav {
      width: 40px; height: 40px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface-1); border: 1px solid var(--border-2);
      border-radius: 9px; color: var(--text-2); cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .date-nav:hover:not(:disabled) { border-color: var(--border-3); color: var(--text); }
    .date-nav:disabled { opacity: 0.35; cursor: default; }
    .date-nav i { width: 18px; height: 18px; }
    .date-label {
      flex: 1; text-align: center;
      font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1.5px;
    }
    .date-label small { display: block; font-family: 'Barlow', sans-serif; font-size: 11px; letter-spacing: 0; color: var(--text-muted); font-weight: 600; }

    /* Totals card */
    .totals-card {
      background: var(--surface-1); border: 1px solid var(--border-2);
      border-radius: 12px; padding: 18px 18px 8px;
    }
    .total-row { margin-bottom: 14px; }
    .total-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
    .total-name { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-2); }
    .total-val { font-family: 'Barlow', sans-serif; font-size: 13px; color: var(--text); font-weight: 600; }
    .total-val small { color: var(--text-muted); font-weight: 500; }
    .bar-track { height: 7px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--red); border-radius: 4px; transition: width .3s ease; }
    .bar-fill.over { background: #e0a800; }
    .total-cals .total-name { color: var(--text); font-size: 13px; }
    .total-cals .bar-fill { background: var(--green); }
    .total-cals .bar-fill.over { background: #e0a800; }

    /* Meal sections */
    .meal-block { margin-bottom: 6px; }
    .meal-head {
      display: flex; align-items: center; justify-content: space-between;
      margin: 22px 0 8px;
    }
    .meal-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1.5px; }
    .meal-kcal { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .add-food-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; border: 1px solid var(--border-2);
      border-radius: 8px; color: var(--text-2); cursor: pointer;
      font-family: 'Barlow', sans-serif; font-size: 12px; font-weight: 700;
      letter-spacing: 0.5px; padding: 7px 12px; transition: border-color .2s, color .2s;
    }
    .add-food-btn:hover { border-color: var(--red-border); color: var(--text); }
    .add-food-btn i { width: 14px; height: 14px; }

    .food-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--surface-1); border: 1px solid var(--border-2);
      border-radius: 10px; padding: 11px 14px; margin-bottom: 7px; cursor: pointer;
      transition: border-color .2s;
    }
    .food-row:hover { border-color: var(--border-3); }
    .food-main { flex: 1 1 auto; min-width: 0; }
    .food-name { font-size: 14px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Sub-line can carry servings · estimated portion · macros — keep it to one
       ellipsised line so a long portion label never widens or wraps the row. */
    .food-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .food-sub .ai-est-badge { cursor: default; }
    .food-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .food-cals { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; }
    .food-cals small { font-family: 'Barlow', sans-serif; font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .meal-empty {
      font-size: 12px; color: var(--text-muted);
      padding: 10px 14px; border: 1px dashed var(--border-2); border-radius: 10px;
    }

    .no-target-note { font-size: 12px; color: var(--text-muted); padding: 4px 2px 14px; }

    /* Quick add: Recent + Favorites chip rows (same chip look as the modal) */
    .qa-chips {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .qa-chips::-webkit-scrollbar { height: 0; }
    .qa-chips .nu-chip { min-height: 40px; }   /* thumb-friendly page targets */
    .qa-empty { font-size: 12px; color: var(--text-muted); padding: 2px 2px 6px; }

    /* Copy Yesterday (shown only when today is empty and yesterday isn't) */
    .copy-yday {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      width: 100%; margin: 2px 0 6px; padding: 12px 16px; cursor: pointer;
      background: transparent; border: 1px dashed var(--border-3);
      border-radius: 12px; color: var(--text); text-align: center;
      font-family: 'Barlow', sans-serif; transition: border-color .2s, background .2s;
    }
    .copy-yday:hover { border-color: var(--red-border); background: var(--surface-1); }
    .copy-yday:disabled { opacity: 0.5; cursor: default; }
    .copy-yday-title {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
    }
    .copy-yday-title i { width: 15px; height: 15px; }
    .copy-yday-sub { font-size: 12px; color: var(--text-muted); font-weight: 600; }

    /* Quick Log (Phase 4.2) — describe a meal, AI splits it, USDA prices it */
    .ai-log-row { display: flex; gap: 8px; margin: 2px 0 6px; }
    .ai-log-row input {
      flex: 1; min-width: 0; padding: 11px 14px;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 10px; color: var(--text);
      font-family: 'Barlow', sans-serif; font-size: 14px;
      appearance: none; outline: none; transition: border-color .2s;
    }
    .ai-log-row input:focus { border-color: var(--red); }
    .ai-log-btn {
      flex-shrink: 0; padding: 0 20px; cursor: pointer;
      background: var(--red); border: none; border-radius: 10px; color: #fff;
      font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; transition: opacity .2s;
    }
    .ai-log-btn:hover { opacity: 0.85; }
    .ai-log-btn:disabled { opacity: 0.5; cursor: default; }
    .ai-log-hint { font-size: 12px; color: var(--text-muted); padding: 0 2px 8px; }
    /* review sheet — sits UNDER the food modal (z 200) so "Add manually" stacks */
    #aiSheet { z-index: 190; }
    .ai-sheet-src { font-size: 12px; color: var(--text-muted); font-style: italic; margin: -10px 0 14px; }
    .ai-item { flex-direction: column; align-items: stretch; }
    .ai-item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    /* Row title: max two lines, ellipsis — full USDA name lives in title="" and
       in the food picker. Never lets a long name push the card wider. */
    .ai-item-name {
      font-size: 13px; font-weight: 600; min-width: 0; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; overflow-wrap: anywhere;
    }
    .ai-item-x {
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      font-size: 14px; padding: 2px 6px; flex-shrink: 0; transition: color .2s;
    }
    .ai-item-x:hover { color: var(--text); }
    .ai-item-warn { font-size: 11px; color: var(--text-2); margin-top: 5px; line-height: 1.4; }
    /* Metadata + stepper: the meta block wraps (flex-wrap) so identity and
       nutrition sit on one line where there's room and stack into two readable
       rows when there isn't — calories/protein never truncate. The stepper stays
       top-right (flex-shrink:0) and never overlaps the text (align-items:flex-start). */
    .ai-item-bottom { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-top: 6px; }
    .ai-item-meta { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; row-gap: 2px; }
    .ai-item-sub {
      font-size: 12px; color: var(--text-muted); font-weight: 600;
      min-width: 0; overflow-wrap: anywhere;
    }
    .ai-mini-stepper { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .ai-mini-step {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      background: var(--surface-3); border: 1px solid var(--border-2);
      border-radius: 7px; color: var(--text); font-size: 17px; line-height: 1;
      cursor: pointer; user-select: none; transition: border-color .2s;
    }
    .ai-mini-step:hover { border-color: var(--red-border); }
    .ai-mini-qty { min-width: 28px; text-align: center; font-size: 13px; font-weight: 700; }
    .ai-unmatched { border-style: dashed; }
    .ai-unmatched-label {
      font-size: 13px; color: var(--text-muted);
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* Clarification prompts are full questions — they wrap instead of truncating
       (the single-line ai-unmatched-label clipped long brand prompts). */
    .ai-clar-prompt {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.35;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }
    .ai-manual-btn {
      background: none; border: none; color: var(--red); cursor: pointer;
      font-family: 'Barlow', sans-serif; font-size: 12px; font-weight: 700;
      padding: 2px 0; text-transform: uppercase; letter-spacing: 0.5px;
    }
    /* ambiguous-match candidate buttons ("which one?") */
    .ai-choice {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      width: 100%; margin-top: 6px; padding: 9px 12px; cursor: pointer; text-align: left;
      background: var(--surface-3); border: 1px solid var(--border-2);
      border-radius: 8px; color: var(--text);
      font-family: 'Barlow', sans-serif; transition: border-color .2s;
    }
    .ai-choice:hover { border-color: var(--red-border); }
    .ai-choice-name {
      font-size: 13px; font-weight: 600; min-width: 0; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; overflow-wrap: anywhere;
    }
    /* Secondary line (Brand · Variety · kcal/100 g). NOT flex-shrink:0 — it must
       yield space / wrap so a long brand+variety never overflows the card; on
       mobile the whole .ai-choice stacks (see the media query). */
    .ai-choice-brand { font-size: 11px; color: var(--text-muted); font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
    /* brand-correction free-text (clarification) */
    .ai-clar-free { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .ai-clar-flabel {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text-muted);
    }
    .ai-clar-input {
      flex: 1; min-width: 120px; padding: 8px 10px;
      background: var(--surface-3); border: 1px solid var(--border-2); border-radius: 8px;
      color: var(--text); font-family: 'Barlow', sans-serif; font-size: 13px;
    }
    .ai-clar-input:focus { outline: none; border-color: var(--red-border); }
    .ai-clar-input:disabled { opacity: 0.5; }
    .ai-clar-error { font-size: 12px; color: var(--red); margin-top: 6px; font-weight: 600; }

    /* Saved meals: meal-head actions + the two small sheets */
    .meal-actions { display: flex; gap: 8px; flex-shrink: 0; }
    /* Vertical-scroll list; min-width:0 lets its flex children (cards) shrink,
       max-width:100% keeps a wide card from widening the modal (component-level
       overflow guard — never relies on body overflow-x:hidden). */
    .sm-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 12px; max-height: 38vh; overflow-y: auto; min-width: 0; }
    .sm-item, .ai-item, .ai-choice { max-width: 100%; }
    .sm-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 10px; padding: 9px 12px;
    }
    .sm-item-main { flex: 1 1 auto; min-width: 0; }
    .sm-item-name { font-size: 13px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sm-item-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sm-item-kcal { font-size: 12px; color: var(--text-muted); font-weight: 600; flex-shrink: 0; }
    .sm-totals { font-size: 12px; color: var(--text-2); margin-bottom: 16px; }

    /* ── Shared modal (mirrors app.html / weight-history.html) ─────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.82); backdrop-filter: blur(6px);
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--surface-1); border: 1px solid var(--border-2);
      border-radius: 14px; padding: 28px 24px; width: 100%; max-width: 440px;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1.5px; flex: 1; }
    /* Favorite star (modal header, form view only) — ☆ not saved / ★ saved */
    .nu-fav {
      background: none; border: none; cursor: pointer;
      font-size: 22px; line-height: 1; padding: 4px 6px;
      color: var(--text-muted); transition: color .2s;
    }
    .nu-fav:hover { color: var(--text-2); }
    .nu-fav.on { color: var(--red); }
    .modal-close {
      background: none; border: none; color: var(--text-muted);
      font-size: 18px; cursor: pointer; padding: 4px 8px; transition: color 0.2s;
    }
    .modal-close:hover { color: var(--text); }
    .field-group { margin-bottom: 14px; }
    .field-label {
      display: block; font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 6px;
    }
    .field-group input, .field-group select {
      width: 100%; padding: 10px 12px;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 8px; color: var(--text);
      font-family: 'Barlow', sans-serif; font-size: 14px;
      appearance: none; outline: none; transition: border-color 0.2s;
    }
    .field-group input:focus, .field-group select:focus { border-color: var(--red); }
    /* two- and four-up rows inside the modal */
    .nu-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .nu-row.nu-row-4 { grid-template-columns: repeat(2, 1fr); }
    .nu-row .field-group { margin-bottom: 14px; }
    .field-hint { font-size: 11px; color: var(--text-muted); margin: -4px 0 12px; }
    /* recent / saved foods quick-add */
    .nu-recent { margin-bottom: 18px; }
    .nu-recent-label {
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px;
    }
    .nu-recent-chips {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .nu-recent-chips::-webkit-scrollbar { height: 0; }
    .nu-chip {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px;
      max-width: 220px; padding: 7px 13px; cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 999px; color: var(--text);
      font-family: 'Barlow', sans-serif; transition: border-color .2s, background .2s;
    }
    .nu-chip:hover { border-color: var(--red-border); background: var(--surface-3); }
    .nu-chip-name {
      font-size: 13px; font-weight: 600; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .nu-chip-more { color: var(--text-2); border-style: dashed; }
    .nu-chip-more:hover { color: var(--text); }
    /* back button (shown only in the Saved Foods search view) */
    .nu-back {
      background: none; border: none; color: var(--text-muted);
      font-size: 20px; line-height: 1; cursor: pointer; padding: 0 10px 0 0;
      transition: color .2s;
    }
    .nu-back:hover { color: var(--text); }
    /* Saved Foods search panel */
    .nu-search-input {
      width: 100%; padding: 11px 12px; margin-bottom: 12px;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 8px; color: var(--text);
      font-family: 'Barlow', sans-serif; font-size: 14px; outline: none;
      transition: border-color .2s;
    }
    .nu-search-input:focus { border-color: var(--red); }
    .nu-saved-list { display: flex; flex-direction: column; gap: 7px; max-height: 46vh; overflow-y: auto; }
    .nu-saved-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      width: 100%; text-align: left; cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 10px; padding: 11px 14px; transition: border-color .2s;
    }
    .nu-saved-row:hover { border-color: var(--red-border); }
    .nu-saved-main { flex: 1 1 auto; min-width: 0; }
    .nu-saved-name {
      font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .nu-saved-sub {
      font-family: 'Barlow', sans-serif; font-size: 11px; color: var(--text-muted);
      margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .nu-saved-cal {
      font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 0.5px;
      color: var(--text-2); flex-shrink: 0;
    }
    .nu-search-empty { font-size: 12px; color: var(--text-muted); padding: 10px 2px; }
    /* USDA food-database search */
    .nu-dbsearch {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 12px 14px; margin-bottom: 18px; cursor: pointer; text-align: left;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 10px; color: var(--text);
      font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 600;
      transition: border-color .2s, background .2s;
    }
    .nu-dbsearch:hover { border-color: var(--red-border); background: var(--surface-3); }
    .nu-dbsearch-ico { font-size: 15px; line-height: 1; }
    .nu-usda-status {
      display: none; font-size: 12px; color: var(--text-muted);
      padding: 8px 2px 10px;
    }
    .nu-usda-status.loading { color: var(--text-2); }
    .nu-usda-status.error { color: var(--red); }
    .nu-usda-list { display: flex; flex-direction: column; gap: 7px; max-height: 50vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .nu-usda-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      width: 100%; text-align: left; cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 10px; padding: 11px 14px; transition: border-color .2s;
    }
    .nu-usda-row:hover { border-color: var(--red-border); }
    .nu-usda-main { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .nu-usda-name {
      font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .nu-usda-sub {
      font-size: 11px; color: var(--text-muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .nu-usda-macros { font-size: 11px; color: var(--text-2); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nu-usda-cals {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.5px;
      color: var(--text); flex-shrink: 0; text-align: right; line-height: 1;
    }
    .nu-usda-cals small {
      display: block; font-family: 'Barlow', sans-serif; font-size: 9px;
      font-weight: 700; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase;
    }
    .nu-verified-sm { color: var(--green); font-weight: 700; white-space: nowrap; }
    /* Phase 4.2.5: vague-portion "Estimated" tag — muted, uppercase text badge
       (design system: text badges, no color-loud pills), tooltip explains it. */
    .ai-est-badge { font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .04em; color: var(--text-3, #777); border: 1px solid var(--border, #2A2A2A);
      border-radius: 4px; padding: 1px 4px; white-space: nowrap; cursor: help; }
    .nu-usda-group {
      font-family: 'Barlow', sans-serif; font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-2);
      margin: 14px 2px 8px; display: flex; align-items: center; gap: 8px;
    }
    .nu-usda-group:first-child { margin-top: 2px; }
    .nu-usda-group::after { content: ''; flex: 1; height: 1px; background: var(--border-1); }
    .nu-usda-manual {
      display: block; width: 100%; margin-top: 14px; padding: 11px;
      background: transparent; border: 1px dashed var(--border-2); border-radius: 8px;
      color: var(--text-2); cursor: pointer;
      font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 600;
      transition: border-color .2s, color .2s;
    }
    .nu-usda-manual:hover { border-color: var(--red-border); color: var(--text); }
    /* ── Barcode scanner (Phase 3.2) ───────────────────────────────────── */
    .nu-scan-btn { margin-bottom: 4px; }
    .nu-scan-frame {
      position: relative; width: 100%; aspect-ratio: 4 / 3;
      background: #000; border: 1px solid var(--border-2);
      border-radius: 12px; overflow: hidden; margin-bottom: 10px;
    }
    .nu-scan-frame video {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    }
    .nu-scan-status {
      font-size: 12px; color: var(--text-2); text-align: center;
      min-height: 18px; padding: 2px 2px 10px;
    }
    .nu-scan-status.loading { color: var(--text-2); }
    .nu-scan-status.error { color: var(--red); }
    .nu-scan-manual { margin-top: 14px; }
    .nu-scan-manual-row { display: flex; gap: 8px; }
    .nu-scan-manual-row input { flex: 1; min-width: 0; font-size: 16px; }
    .nu-scan-lookup {
      flex-shrink: 0; padding: 0 18px; cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 8px; color: var(--text);
      font-family: 'Barlow', sans-serif; font-size: 12px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      transition: border-color .2s, background .2s;
    }
    .nu-scan-lookup:hover { border-color: var(--red-border); background: var(--surface-3); }
    /* ── USDA selected-food card (Phase 3.1.2) ─────────────────────────── */
    /* Card header: food name + brand + verified badge */
    .nu-card-header { margin-bottom: 18px; }
    .nu-card-name {
      font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 0.5px;
      line-height: 1.1; color: var(--text);
    }
    .nu-card-meta { display: flex; align-items: center; gap: 8px; margin-top: 7px; flex-wrap: wrap; }
    .nu-card-brand {
      font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      color: var(--text-2);
    }
    .nu-verified {
      font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
      color: var(--green); border: 1px solid rgba(34,197,94,0.35);
      background: rgba(34,197,94,0.10); padding: 2px 8px; border-radius: 999px;
    }
    /* Serving dropdown + optional custom-grams input (16px font avoids iOS zoom) */
    #nuServingSelect, .nu-custom-grams { font-size: 16px; }
    .nu-custom-grams { margin-top: 8px; }
    /* Quantity stepper — thumb-friendly ± buttons around the input */
    .nu-stepper { display: flex; align-items: stretch; gap: 8px; }
    .nu-step {
      flex: 0 0 46px; min-height: 46px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 8px; color: var(--text); font-size: 24px; line-height: 1;
      cursor: pointer; user-select: none; transition: border-color .2s, background .2s;
    }
    .nu-step:hover { border-color: var(--red-border); background: var(--surface-3); }
    .nu-step:active { background: var(--surface-3); }
    .nu-stepper input {
      flex: 1; min-width: 0; text-align: center;
      padding: 10px 8px; font-size: 16px;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 8px; color: var(--text);
      font-family: 'Barlow', sans-serif; outline: none; appearance: none;
      transition: border-color .2s;
    }
    .nu-stepper input:focus { border-color: var(--red); }
    /* Live nutrition card (chosen serving × quantity) */
    .nu-readout {
      margin: 8px 0 16px; padding: 14px 8px;
      background: var(--surface-1); border: 1px solid var(--border-2); border-radius: 12px;
    }
    .nu-readout-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .nu-readout-cell { text-align: center; min-width: 0; }
    .nu-readout-num {
      font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.5px;
      line-height: 1; color: var(--text);
    }
    .nu-readout-cell.cal .nu-readout-num { color: var(--green); }
    .nu-readout-lab {
      font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
      color: var(--text-muted); margin-top: 5px;
    }
    /* Quieter second row inside the card: fiber + sugar (never competes with macros) */
    .nu-readout-divider { height: 1px; background: var(--border-2); margin: 12px 6px; }
    .nu-readout-row-2 { grid-template-columns: repeat(2, 1fr); }
    .nu-readout-cell-sm .nu-readout-num { font-size: 17px; color: var(--text-2); }
    .nu-readout-cell-sm .nu-readout-lab { font-size: 9px; letter-spacing: 0.5px; }
    /* Manual-entry small live total (per-serving inputs) */
    .nu-total-preview {
      font-family: 'Barlow', sans-serif; font-size: 13px; color: var(--text-2);
      text-align: center; margin: 4px 0 4px; min-height: 18px;
    }
    .nu-total-preview strong { color: var(--green); font-weight: 700; }
    .btn-calc {
      width: 100%; margin-top: 8px; padding: 12px;
      background: var(--red); border: none; border-radius: 8px;
      color: white; font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; letter-spacing: 2px; cursor: pointer; transition: opacity 0.2s;
    }
    .btn-calc:hover { opacity: 0.85; }
    .btn-calc:disabled { opacity: 0.5; cursor: default; }
    .btn-delete-log {
      width: 100%; margin-top: 10px; padding: 11px;
      background: transparent; border: 1px solid var(--border-2); border-radius: 8px;
      color: var(--text-muted); font-family: 'Barlow', sans-serif; font-weight: 700;
      font-size: 12px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .btn-delete-log:hover { border-color: var(--red); color: var(--red); }

    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface-2); border: 1px solid var(--border-3);
      color: var(--text); padding: 12px 24px; border-radius: 8px;
      font-size: 14px; font-weight: 600;
      transition: transform 0.35s ease, opacity 0.35s ease;
      opacity: 0; z-index: 999; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (max-width: 480px) {
      header { padding: 0 14px; }
      .header-logo span { display: none; }
      .container { padding: 20px 12px 120px; }
      .nu-row.nu-row-4 { grid-template-columns: repeat(2, 1fr); }
      /* Keep the 4-up readout from overflowing on narrow phones */
      .nu-readout { padding: 14px 4px; }
      .nu-readout-row { gap: 4px; }
      .nu-readout-num { font-size: 22px; }
      .nu-readout-cell-sm .nu-readout-num { font-size: 16px; }
      .nu-readout-lab { font-size: 9px; letter-spacing: 0.5px; }

      /* ── Phase 4.2.10d: Review & Add / clarification / modal mobile hardening ── */
      /* Reclaim ~40px of content width on phones (was 24+20px per side). */
      .modal-overlay { padding: 12px; }
      .modal-box { padding: 20px 16px; }
      /* Clarification choices stack: primary name on line 1, secondary metadata on
         line 2 — both full width with min-width:0 so a long brand/variety wraps
         instead of overflowing or squeezing the name into an unusable column. */
      .ai-choice { flex-direction: column; align-items: stretch; gap: 3px; }
      .ai-choice-name { -webkit-line-clamp: 3; }
      .ai-choice-brand { white-space: normal; }
    }
    @media (max-width: 360px) {
      /* Tighten only spacing where 320–360px genuinely still presses. The
         reclaimed padding is enough that the 32×32 stepper controls stay full
         size — tap targets are never shrunk to fit. */
      .modal-overlay { padding: 8px; }
      .modal-box { padding: 18px 13px; }
    }
  </style>

<script>
  var currentUserId = null;
  var currentProfile = null;
  var currentDate = nuToday();
  var currentLogs = [];

  document.getElementById('foodModalMount').innerHTML = nuModalMarkup();

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 3000);
  }

  /* ── date navigation ─────────────────────────────────────────────── */
  function shiftDate(days) {
    var d = nuParseDate(currentDate);
    d.setDate(d.getDate() + days);
    var iso = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    if (iso > nuToday()) return; // no future days
    currentDate = iso;
    renderDateLabel();
    refresh();
  }

  function renderDateLabel() {
    var label = currentDate === nuToday() ? 'Today' : nuFmtDateLong(currentDate);
    var sub = nuParseDate(currentDate).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    document.getElementById('dateLabel').innerHTML = label + '<small>' + nuEsc(sub) + '</small>';
    document.getElementById('dateNext').disabled = (currentDate >= nuToday());
  }

  /* ── totals card ─────────────────────────────────────────────────── */
  function totalRow(name, consumed, target, unit, isCals) {
    var c = Math.round(consumed * 10) / 10;
    var pct = target ? Math.min(100, Math.round(consumed / target * 100)) : 0;
    var over = target && consumed > target;
    var valHTML = target
      ? c + ' <small>/ ' + target + (unit ? ' ' + unit : '') + '</small>'
      : c + (unit ? ' ' + unit : '');
    return '<div class="total-row ' + (isCals ? 'total-cals' : '') + '">' +
      '<div class="total-head">' +
        '<span class="total-name">' + name + '</span>' +
        '<span class="total-val">' + valHTML + '</span>' +
      '</div>' +
      '<div class="bar-track"><div class="bar-fill ' + (over ? 'over' : '') + '" style="width:' + pct + '%"></div></div>' +
    '</div>';
  }

  function renderTotals() {
    var t = nuDayTotals(currentLogs);
    var p = currentProfile || {};
    var hasTargets = !!(p.target_calories || p.protein_target || p.carb_target || p.fat_target);

    var html = '<div class="totals-card">' +
      totalRow('Calories', t.calories, p.target_calories || 0, 'kcal', true) +
      totalRow('Protein',  t.protein,  p.protein_target || 0, 'g', false) +
      totalRow('Carbs',    t.carbs,    p.carb_target || 0, 'g', false) +
      totalRow('Fat',      t.fat,      p.fat_target || 0, 'g', false) +
    '</div>';
    if (!hasTargets) {
      html += '<div class="no-target-note">Set your calorie & macro targets on the dashboard (Recalculate Goals) to track progress.</div>';
    }
    document.getElementById('totalsWrap').innerHTML = html;
  }

  /* ── meal sections ───────────────────────────────────────────────── */
  function renderMeals() {
    var wrap = document.getElementById('mealsWrap');
    var html = NU_MEALS.map(function (meal) {
      var rows = currentLogs.filter(function (l) { return l.meal === meal; });
      var kcal = rows.reduce(function (s, l) { return s + (+l.calories || 0); }, 0);
      var inner;
      if (rows.length === 0) {
        inner = '<div class="meal-empty">Nothing logged.</div>';
      } else {
        inner = rows.map(function (l) {
          // Shared presentation model (Phase 4.2.8): USDA rows get the simplified,
          // brand-stripped name; manual rows keep the user's own words verbatim.
          // Identity/saved values are untouched — editEntry reads the log row.
          var dm = FoodDisplay.buildLogDisplay(l);
          var sub = [];
          if (dm.servingsLabel) sub.push(nuEsc(dm.servingsLabel));
          // Keep an ESTIMATED portion visibly estimated even in this condensed
          // row: a text "Est." badge (never colour alone) plus the ~amount.
          if (dm.estimated) sub.push('<span class="ai-est-badge" title="Estimated portion — tap to adjust">Est.</span> ' + nuEsc(dm.serving));
          sub.push(nuEsc(dm.macroSummary));
          return '<div class="food-row" data-id="' + l.id + '" onclick="editEntry(this)">' +
            '<div class="food-main">' +
              '<div class="food-name" title="' + nuEsc(dm.fullName || dm.name) + '" aria-label="' + nuEsc(dm.fullName || dm.name) + '">' + nuEsc(dm.name) + '</div>' +
              '<div class="food-sub">' + sub.join(' · ') + '</div>' +
            '</div>' +
            '<div class="food-right">' +
              '<div class="food-cals">' + dm.calories + ' <small>kcal</small></div>' +
            '</div>' +
          '</div>';
        }).join('');
      }
      return '<div class="meal-block">' +
        '<div class="meal-head">' +
          '<div><span class="meal-title">' + NU_MEAL_LABELS[meal] + '</span>' +
            (kcal ? ' <span class="meal-kcal">' + nuRound(kcal) + ' kcal</span>' : '') + '</div>' +
          '<div class="meal-actions">' +
            (rows.length ? '<button class="add-food-btn" onclick="saveMealPrompt(\'' + meal + '\')" title="Save this meal to re-add later"><i data-lucide="bookmark"></i> Save meal</button>' : '') +
            '<button class="add-food-btn" onclick="addToMeal(\'' + meal + '\')"><i data-lucide="plus"></i> Add food</button>' +
          '</div>' +
        '</div>' +
        inner +
      '</div>';
    }).join('');
    wrap.innerHTML = html;
    lucide.createIcons();
  }

  function addToMeal(meal) {
    nuOpenModal({ meal: meal, date: currentDate });
  }

  /* ── quick add: Recent + Favorites chips (Phase 3.3) ─────────────── */
  var recentItems = [];   // per-serving items for nuOpenModalWithFood
  var favItems = [];

  // Chips carry no meal context — suggest one from the time of day (still
  // editable in the form before saving).
  function suggestMeal() {
    var h = new Date().getHours();
    if (h < 11) return 'breakfast';
    if (h < 15) return 'lunch';
    if (h < 21) return 'dinner';
    return 'snack';
  }

  function renderChips(elId, items, pickFn, emptyMsg) {
    var el = document.getElementById(elId);
    if (!el) return;
    if (!items.length) {
      el.innerHTML = '<div class="qa-empty">' + emptyMsg + '</div>';
      return;
    }
    el.innerHTML = items.map(function (it, i) {
      // Name-only chips (matches the modal's saved-food chips). The kcal shown
      // here was per-serving and could mismatch what the user remembers logging
      // (fractional servings) — exact macros appear in the card on tap anyway.
      // Title/aria still carry the full name + calories.
      // Shared compact label — same primary-name grammar as every surface, single
      // line; the accessible label keeps the full canonical name + calories.
      var cl = FoodDisplay.fdCompactLabel({ name: it.name, brand: it.brand, usda_fdc_id: it.usda_fdc_id });
      var full = nuEsc(it.name);
      return '<button type="button" class="nu-chip" title="' + full + '"' +
          ' aria-label="' + nuEsc(cl.ariaLabel) + ', ' + nuRound(it.calories) + ' calories"' +
          ' onclick="' + pickFn + '(' + i + ')">' +
          '<span class="nu-chip-name">' + nuEsc(cl.name) + '</span>' +
        '</button>';
    }).join('');
  }

  async function loadRecentChips() {
    recentItems = await nuFetchRecentLogged(currentUserId, 10);
    renderChips('recentChips', recentItems, 'pickRecent', 'No recent foods yet.');
  }

  async function loadFavChips() {
    var favs = await nuLoadFavorites();
    favItems = favs.map(function (f) {
      return {
        name: f.food_name,
        calories: +f.calories  || 0, protein: +f.protein_g || 0,
        carbs:    +f.carbs_g   || 0, fat:     +f.fat_g     || 0,
        raw_food: f.raw_food || null,
        // USDA identity — keeps the star on 'usda:<fdcId>' even when the
        // favorite has no raw payload and opens the plain form.
        usda_fdc_id: f.fdc_id != null ? f.fdc_id : null,
        brand: f.brand_name || null, gtin_upc: f.gtin_upc || null,
        serving_unit: f.serving_unit || null,
        serving_amount: f.serving_qty != null ? f.serving_qty : null,
      };
    });
    renderChips('favChips', favItems, 'pickFav',
      'No favorites yet — tap ☆ while logging a food to save it here.');
  }

  function pickRecent(i) {
    if (recentItems[i]) nuOpenModalWithFood(recentItems[i], { date: currentDate, meal: suggestMeal() });
  }
  function pickFav(i) {
    if (favItems[i]) nuOpenModalWithFood(favItems[i], { date: currentDate, meal: suggestMeal() });
  }

  // Star toggled inside the modal → nu_favorites cache is already updated.
  window.onFavoritesChanged = loadFavChips;

  /* ── saved meals: save a logged meal, re-add it in two taps ──────────── */
  var savedMeals = [];        // saved_meals rows, newest first
  var sheetMeal = null;       // saved meal open in the sheet
  var pendingSaveMeal = null; // meal key ('breakfast'…) being saved

  async function loadMealChips() {
    savedMeals = await nuFetchSavedMeals();
    var chipItems = savedMeals.map(function (m) {
      return { name: m.name, calories: nuSavedMealTotals(m.items).calories };
    });
    renderChips('mealChips', chipItems, 'pickMeal',
      'No saved meals yet — log some foods, then tap “Save meal”.');
  }

  function pickMeal(i) {
    var m = savedMeals[i];
    if (!m || !(m.items || []).length) return;
    sheetMeal = m;
    document.getElementById('mealSheetTitle').textContent = m.name;
    document.getElementById('mealSheetItems').innerHTML = m.items.map(function (it) {
      var q = (+it.servings > 0) ? +it.servings : 1;
      var qty = q === 1 ? '' : FoodDisplay.fdQty(q) + '× ';
      // Shared display model (same primary name + brand/variety as every surface);
      // manual entries keep the user's own words. Snapshot names/identity are
      // untouched — re-adding replays the stored items verbatim (quantity-adjusted
      // TOTAL calories shown, never recalculated per-100 g).
      var smd = FoodDisplay.buildFoodDisplay({ name: it.name, brand: it.brand, usda_fdc_id: it.usda_fdc_id });
      var disp = (it.usda_fdc_id != null) ? smd.name : it.name;
      var smSec = (it.usda_fdc_id != null) ? smd.secondaryParts.map(nuEsc).join(' · ') : '';
      return '<div class="sm-item">' +
        '<div class="sm-item-main">' +
          '<div class="sm-item-name" title="' + nuEsc(it.name) + '" aria-label="' + nuEsc(qty + it.name) + '">' + nuEsc(qty + disp) + '</div>' +
          (smSec ? '<div class="sm-item-sub">' + smSec + '</div>' : '') +
        '</div>' +
        '<div class="sm-item-kcal">' + nuRound((+it.calories || 0) * q) + ' kcal</div>' +
      '</div>';
    }).join('');
    var tot = nuSavedMealTotals(m.items);
    document.getElementById('mealSheetTotals').textContent =
      m.items.length + (m.items.length === 1 ? ' food · ' : ' foods · ') +
      nuRound(tot.calories) + ' kcal · ' + nuRound(tot.protein) + ' g protein';
    document.getElementById('mealSheetSlot').value = suggestMeal();
    document.getElementById('mealSheet').classList.add('open');
  }

  function closeMealSheet() {
    document.getElementById('mealSheet').classList.remove('open');
    sheetMeal = null;
  }

  async function confirmAddMeal() {
    if (!sheetMeal) return;
    var btn = document.getElementById('mealSheetAddBtn');
    btn.disabled = true;
    try {
      var slot = document.getElementById('mealSheetSlot').value;
      var n = await nuLogSavedMeal(sheetMeal, slot, currentDate);
      closeMealSheet();
      showToast('Added ' + n + (n === 1 ? ' food' : ' foods') + ' to ' + NU_MEAL_LABELS[slot] + '.');
      await refresh();
      loadRecentChips();
    } catch (e) {
      console.error('confirmAddMeal error:', e);
      showToast('Error adding meal — try again.');
    } finally {
      btn.disabled = false;
    }
  }

  async function deleteSavedMeal() {
    if (!sheetMeal) return;
    var btn = document.getElementById('mealSheetDeleteBtn');
    btn.disabled = true;
    try {
      await nuDeleteSavedMeal(sheetMeal.id);
      closeMealSheet();
      showToast('Saved meal deleted.');
      loadMealChips();
    } catch (e) {
      console.error('deleteSavedMeal error:', e);
      showToast('Error deleting — try again.');
    } finally {
      btn.disabled = false;
    }
  }

  function saveMealPrompt(meal) {
    var rows = currentLogs.filter(function (l) { return l.meal === meal; });
    if (!rows.length) return;
    pendingSaveMeal = meal;
    var input = document.getElementById('saveMealName');
    input.value = NU_MEAL_LABELS[meal];
    document.getElementById('saveMealHint').textContent =
      'Saves the ' + rows.length + (rows.length === 1 ? ' food' : ' foods') +
      ' in ' + NU_MEAL_LABELS[meal] + '. Re-saving an existing name updates it.';
    document.getElementById('saveMealModal').classList.add('open');
    setTimeout(function () { input.focus(); input.select(); }, 60);
  }

  function closeSaveMeal() {
    document.getElementById('saveMealModal').classList.remove('open');
    pendingSaveMeal = null;
  }

  async function confirmSaveMeal() {
    var name = document.getElementById('saveMealName').value.trim();
    if (!name) { showToast('Name the meal first.'); return; }
    var rows = currentLogs.filter(function (l) { return l.meal === pendingSaveMeal; });
    if (!rows.length) { closeSaveMeal(); return; }
    var btn = document.getElementById('saveMealBtn');
    btn.disabled = true;
    try {
      var items = await nuSnapshotMealItems(rows);
      await nuUpsertSavedMeal(name, items);
      closeSaveMeal();
      showToast('Meal saved!');
      loadMealChips();
    } catch (e) {
      console.error('confirmSaveMeal error:', e);
      showToast('Error saving meal — try again.');
    } finally {
      btn.disabled = false;
    }
  }

  function editEntry(el) {
    var id = el.getAttribute('data-id');
    var log = currentLogs.filter(function (l) { return l.id === id; })[0];
    if (log) {
      nuOpenModal({
        id: log.id, name: log.name, meal: log.meal, servings: log.servings,
        date: currentDate,
        calories: log.calories, protein: log.protein, carbs: log.carbs, fat: log.fat,
        // USDA identity — lets the favorite star keep 'usda:<fdcId>' in edit mode
        source: log.source, usda_fdc_id: log.usda_fdc_id, brand: log.brand,
        gtin_upc: log.gtin_upc, serving_amount: log.serving_amount, serving_unit: log.serving_unit,
      });
    }
  }

  /* ── copy yesterday (Phase 4.0 rider) ────────────────────────────── */
  var ydayLogs = [];   // yesterday's rows when the button is showing

  function nuYesterday() {
    var d = nuParseDate(nuToday());
    d.setDate(d.getDate() - 1);
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }

  // Shown ONLY when viewing today, today is empty, and yesterday has entries.
  async function renderCopyYesterday() {
    var wrap = document.getElementById('copyYdayWrap');
    if (currentDate !== nuToday() || currentLogs.length) { wrap.innerHTML = ''; return; }
    ydayLogs = await nuFetchLogs(currentUserId, nuYesterday());
    if (currentLogs.length || !ydayLogs.length) { wrap.innerHTML = ''; return; }
    var t = nuDayTotals(ydayLogs);
    wrap.innerHTML = '<button type="button" class="copy-yday" id="copyYdayBtn" onclick="copyYesterday()">' +
      '<span class="copy-yday-title"><i data-lucide="copy"></i> Copy Yesterday</span>' +
      '<span class="copy-yday-sub">Yesterday: ' + nuRound(t.calories).toLocaleString('en-US') +
        ' kcal • ' + nuRound(t.protein) + 'g protein</span>' +
    '</button>';
    lucide.createIcons();
  }

  // Replays yesterday meal-by-meal through the SAME snapshot → nuSaveLog path
  // saved meals use — identity, provenance and raw payloads carry over.
  async function copyYesterday() {
    var btn = document.getElementById('copyYdayBtn');
    if (!btn || !ydayLogs.length) return;
    btn.disabled = true;
    try {
      var total = 0;
      for (var i = 0; i < NU_MEALS.length; i++) {
        var rows = ydayLogs.filter(function (l) { return l.meal === NU_MEALS[i]; });
        if (!rows.length) continue;
        var items = await nuSnapshotMealItems(rows);
        total += await nuLogSavedMeal({ items: items }, NU_MEALS[i], currentDate);
      }
      showToast('Copied yesterday — ' + total + (total === 1 ? ' food' : ' foods') + ' added.');
      await refresh();
      loadRecentChips();
    } catch (e) {
      console.error('copyYesterday error:', e);
      showToast('Error copying — try again.');
      if (btn) btn.disabled = false;
    }
  }

  /* ── Quick Log (Phase 4.2): AI parse → USDA match → confirm sheet ── */
  var aiItems = [];    // resolved items shown in the review sheet
  var aiBusy = false;

  async function aiQuickLog(ev) {
    if (ev) ev.preventDefault();
    if (aiBusy) return;
    var input = document.getElementById('aiLogInput');
    var text = (input.value || '').trim();
    if (text.length < 2) { showToast('Describe what you ate first.'); return; }
    var btn = document.getElementById('aiLogBtn');
    aiBusy = true; btn.disabled = true; btn.textContent = '…';
    try {
      var parsed = await nuAiParse(text);
      if (!parsed.items || !parsed.items.length) {
        showToast("Couldn't find foods in that — try naming them directly.");
        return;
      }
      // Phase 4.2.6: resolve the whole meal together (meal-aware) — the resolver
      // still returns one resolved item per food, so the review sheet + save path
      // are unchanged; foods stay separate entries.
      aiItems = await nuAiResolveMealItems(parsed.items, text, parsed.meal);
      document.getElementById('aiSheetSrc').textContent = '“' + text + '”';
      document.getElementById('aiSheetMeal').value = parsed.meal || suggestMeal();
      renderAiSheet();
      document.getElementById('aiSheet').classList.add('open');
      input.value = '';
      if (parsed.remaining <= 5) {
        document.getElementById('aiLogHint').textContent =
          parsed.remaining + ' AI ' + (parsed.remaining === 1 ? 'log' : 'logs') + ' left today.';
      }
    } catch (e) {
      console.error('aiQuickLog error:', e);
      showToast(e.message || 'AI logging failed — try again.');
    } finally {
      aiBusy = false; btn.disabled = false; btn.textContent = 'Log';
    }
  }

  function renderAiSheet() {
    var list = document.getElementById('aiSheetItems');
    list.innerHTML = aiItems.map(function (it, i) {
      if (it.unmatched) {
        return '<div class="sm-item ai-item ai-unmatched">' +
          '<div class="ai-item-top">' +
            '<div class="ai-unmatched-label">“' + nuEsc(it.parsed.text || it.parsed.query) + '” — no match</div>' +
            '<button type="button" class="ai-item-x" onclick="aiRemove(' + i + ')" aria-label="Remove">✕</button>' +
          '</div>' +
          '<div class="ai-item-bottom">' +
            '<button type="button" class="ai-manual-btn" onclick="aiAddManually(' + i + ')">Search &amp; add manually →</button>' +
          '</div>' +
        '</div>';
      }
      if (it.needsChoice) {
        // Ambiguous match ("protein bar", "cereal") — ask, never guess a brand.
        return '<div class="sm-item ai-item ai-unmatched">' +
          '<div class="ai-item-top">' +
            '<div class="ai-unmatched-label">“' + nuEsc(it.parsed.text || it.parsed.query) + '” — which one?</div>' +
            '<button type="button" class="ai-item-x" onclick="aiRemove(' + i + ')" aria-label="Remove">✕</button>' +
          '</div>' +
          it.choices.map(function (c, ci) {
            // Shared choice model from the FULL raw candidate (one grammar with
            // every other surface): primary name + "Brand • Variety • kcal/100 g".
            // The per-100 g basis is intentional — choices COMPARE records; the
            // resolved row shows the quantity-adjusted total (see food-display.js).
            var cd = FoodDisplay.buildChoiceDisplay(c.raw || c);
            var sec = cd.secondaryParts.map(nuEsc).join(' · ');
            return '<button type="button" class="ai-choice" title="' + nuEsc(cd.fullName) + '" aria-label="' + nuEsc(cd.ariaLabel) + '" onclick="aiChoose(' + i + ',' + ci + ')">' +
              '<span class="ai-choice-name">' + nuEsc(cd.name) + '</span>' +
              (sec ? '<span class="ai-choice-brand">' + sec + '</span>' : '') +
            '</button>';
          }).join('') +
          '<div class="ai-item-bottom">' +
            '<button type="button" class="ai-manual-btn" onclick="aiAddManually(' + i + ')">Search manually →</button>' +
          '</div>' +
        '</div>';
      }
      if (it.needsClarification) {
        // One focused question (prompt + options come from the shared contract —
        // never composed here). Structured options patch the request; brand
        // clarification also offers a free-text correction.
        var cl = it.clarification;
        var busy = !!it._clarBusy;
        var optButtons = (cl.options || []).map(function (o, oi) {
          return '<button type="button" class="ai-choice" onclick="aiClarify(' + i + ',' + oi + ')"' +
            (busy ? ' disabled' : '') + '>' +
            '<span class="ai-choice-name">' + nuEsc(o.label) + '</span></button>';
        }).join('');
        var freeText = cl.allowFreeText
          ? '<div class="ai-clar-free">' +
              '<label class="ai-clar-flabel" for="aiClarText' + i + '">Correct brand</label>' +
              '<input id="aiClarText' + i + '" class="ai-clar-input" type="text" autocomplete="off" ' +
                'placeholder="Type a brand"' + (busy ? ' disabled' : '') +
                ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();aiClarifyText(' + i + ')}">' +
              '<button type="button" class="ai-manual-btn" onclick="aiClarifyText(' + i + ')"' +
                (busy ? ' disabled' : '') + '>Use brand →</button>' +
            '</div>'
          : '';
        return '<div class="sm-item ai-item ai-unmatched ai-clar">' +
          '<div class="ai-item-top">' +
            '<div class="ai-clar-prompt">' + nuEsc(cl.prompt) + '</div>' +
            '<button type="button" class="ai-item-x" onclick="aiRemove(' + i + ')" aria-label="Remove">✕</button>' +
          '</div>' +
          optButtons + freeText +
          (it._clarError ? '<div class="ai-clar-error" role="alert">' + nuEsc(it._clarError) + '</div>' : '') +
          '<div class="ai-item-bottom">' +
            ((it.choices && it.choices.length)
              ? '<button type="button" class="ai-manual-btn" onclick="aiClarChooser(' + i + ')"' +
                (busy ? ' disabled' : '') + '>Pick from list →</button>' : '') +
            '<button type="button" class="ai-manual-btn" onclick="aiAddManually(' + i + ')"' +
              (busy ? ' disabled' : '') + '>Search manually →</button>' +
          '</div>' +
        '</div>';
      }
      var total = nuScaleMacros(it.perUnit, it.servings);
      // Shared presentation model (Phase 4.2.8): simplified name (brand stripped
      // so it never shows twice), clean serving, consistent macro/calorie format.
      var dm = FoodDisplay.buildFoodDisplay({
        name: it.food.name, description: it.food.description, brand: it.food.brand,
        usda_fdc_id: it.food.usda_fdc_id, serving_description: it.serving_description,
        estimated: it.estimated,
        calories: total.calories, protein: total.protein, carbs: total.carbs, fat: total.fat,
      });
      var fullName = dm.fullName;
      // Two metadata groups from the shared model so mobile can stack them into
      // two readable rows (identity + nutrition) that WRAP — calories/protein are
      // never truncated behind an ellipsis. On desktop they flow on one line.
      // IDENTITY: USDA badge · brand · variety (brand never duplicated with name).
      var idParts = dm.secondaryParts.map(nuEsc);
      var idHtml = '<span class="nu-verified-sm">USDA</span>' + (idParts.length ? ' · ' + idParts.join(' · ') : '');
      // NUTRITION: serving · total kcal · protein. Phase 4.2.5 estimate badge kept.
      var servingCell = nuEsc(dm.serving);
      if (it.estimated) {
        var exp = (it.portion && it.portion.explanation) || 'Estimated portion — adjust if needed.';
        servingCell += ' <span class="ai-est-badge" title="' + nuEsc(exp) + '">Estimated</span>';
      }
      var nutHtml = [servingCell, nuEsc(dm.caloriesLabel), 'P ' + dm.protein].join(' · ');
      return '<div class="sm-item ai-item">' +
        '<div class="ai-item-top">' +
          '<div class="ai-item-name" title="' + nuEsc(fullName) + '" aria-label="' + nuEsc(fullName) + '">' + nuEsc(dm.name) + '</div>' +
          '<button type="button" class="ai-item-x" onclick="aiRemove(' + i + ')" aria-label="Remove">✕</button>' +
        '</div>' +
        (it.unitUnresolved
          ? '<div class="ai-item-warn">⚠ “' + nuEsc(it.parsed.text || (it.parsed.quantity + ' ' + it.parsed.unit)) +
            '” didn’t match a ' + nuEsc(it.parsed.unit) + ' size — logged as ' +
            nuEsc(it.serving_description || '1 serving') + '. Adjust below if needed.</div>'
          : '') +
        '<div class="ai-item-bottom">' +
          '<div class="ai-item-meta">' +
            '<span class="ai-item-sub">' + idHtml + '</span>' +
            '<span class="ai-item-sub">' + nutHtml + '</span>' +
          '</div>' +
          '<div class="ai-mini-stepper">' +
            '<button type="button" class="ai-mini-step" onclick="aiQtyStep(' + i + ',-1)" aria-label="Decrease quantity">−</button>' +
            '<span class="ai-mini-qty">' + (Math.round(it.servings * 100) / 100) + '</span>' +
            '<button type="button" class="ai-mini-step" onclick="aiQtyStep(' + i + ',1)" aria-label="Increase quantity">+</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    var matched = aiItems.filter(function (it) {
      return !it.unmatched && !it.needsChoice && !it.needsClarification;
    });
    var tot = nuAiTotals(aiItems);
    document.getElementById('aiSheetTotals').textContent =
      matched.length + (matched.length === 1 ? ' food · ' : ' foods · ') +
      nuRound(tot.calories) + ' kcal · ' + nuRound(tot.protein) + ' g protein';
    document.getElementById('aiSheetAddBtn').disabled = !matched.length;
  }

  // Ambiguous item: the user tapped one of the candidates → full resolve.
  async function aiChoose(i, ci) {
    var it = aiItems[i];
    if (!it || !it.needsChoice) return;
    // Capture an explicit correction BEFORE the chooser item is replaced by the
    // resolved one (nuRecordCorrection ignores confirming the top hit). Guarded
    // so it can never block the actual resolve/log.
    try { if (typeof nuRecordCorrection === 'function') nuRecordCorrection(it, ci); } catch (e) {}
    try {
      aiItems[i] = await nuAiResolveChoice(it, ci);
      renderAiSheet();
    } catch (e) {
      console.error('aiChoose error:', e);
      showToast('Error loading that food — try another.');
    }
  }

  // Clarification: the user picked a structured option → patch the shared request
  // and re-enter the SAME resolver (nuAiResolveClarification). The result can be
  // resolved, another question, a chooser, or unmatched — each replaces the item
  // in place without disturbing the others. Per-item _clarBusy blocks double
  // submits; a thrown error preserves the item and shows a retryable message.
  async function aiClarify(i, oi) {
    var it = aiItems[i];
    if (!it || !it.needsClarification || it._clarBusy) return;
    it._clarBusy = true; it._clarError = null; renderAiSheet();
    try {
      aiItems[i] = await nuAiResolveClarification(it, oi);
    } catch (e) {
      console.error('aiClarify error:', e);
      it._clarBusy = false; it._clarError = 'Could not resolve that — try again.';
    }
    renderAiSheet();
    var add = document.getElementById('aiSheetAddBtn');
    if (add && !add.disabled) add.focus();
  }

  // Brand clarification free-text: empty input is rejected locally (no re-resolve).
  async function aiClarifyText(i) {
    var it = aiItems[i];
    if (!it || !it.needsClarification || it._clarBusy) return;
    var input = document.getElementById('aiClarText' + i);
    var val = input ? String(input.value || '').trim() : '';
    if (!val) { it._clarError = 'Enter a brand, or pick “Search all brands”.'; renderAiSheet(); return; }
    it._clarBusy = true; it._clarError = null; renderAiSheet();
    try {
      aiItems[i] = await nuAiResolveClarification(it, val);
    } catch (e) {
      console.error('aiClarifyText error:', e);
      it._clarBusy = false; it._clarError = 'Could not resolve that — try again.';
    }
    renderAiSheet();
    var add = document.getElementById('aiSheetAddBtn');
    if (add && !add.disabled) add.focus();
  }

  // Fallback: turn a clarification into the existing bounded chooser (same rows).
  function aiClarChooser(i) {
    var it = aiItems[i];
    if (!it || !it.needsClarification || it._clarBusy) return;
    aiItems[i] = { parsed: it.parsed, needsChoice: true, choices: it.choices || [] };
    renderAiSheet();
  }

  // Quarter steps at or below 1 (1 → 0.75 → 0.5 → 0.25), whole steps above
  // (1 → 2 → 3). Values stay exact quarters — never display-rounded, which is
  // what made 0.25 read as "0.3".
  function aiQtyStep(i, d) {
    var it = aiItems[i];
    if (!it || it.unmatched || it.needsChoice || it.needsClarification) return;
    var cur = +it.servings || 1;
    var step = (d < 0 ? cur <= 1 : cur < 1) ? 0.25 : 1;
    it.servings = Math.max(0.25, Math.round((cur + d * step) * 100) / 100);
    renderAiSheet();
  }

  function aiRemove(i) {
    aiItems.splice(i, 1);
    if (!aiItems.length) { closeAiSheet(); return; }
    renderAiSheet();
  }

  // Unmatched item → the food modal's USDA search, pre-run with the user's
  // words (the sheet stays open underneath; #aiSheet sits at z-index 190).
  function aiAddManually(i) {
    var it = aiItems[i];
    if (!it) return;
    var meal = document.getElementById('aiSheetMeal').value;
    aiItems.splice(i, 1);
    if (!aiItems.length) closeAiSheet(); else renderAiSheet();
    nuOpenModal({ meal: meal, date: currentDate });
    var inp = document.getElementById('nuUsdaInput');
    inp.value = it.parsed.query || it.parsed.text || '';
    if (inp.value) nuUsdaInputChanged();
  }

  function closeAiSheet() {
    document.getElementById('aiSheet').classList.remove('open');
    aiItems = [];
  }

  async function confirmAiAdd() {
    var matched = aiItems.filter(function (it) { return !it.unmatched && !it.needsChoice; });
    if (!matched.length) return;
    var btn = document.getElementById('aiSheetAddBtn');
    btn.disabled = true;
    try {
      var meal = document.getElementById('aiSheetMeal').value;
      var n = await nuAiLogItems(matched, meal, currentDate);
      closeAiSheet();
      showToast('Added ' + n + (n === 1 ? ' food' : ' foods') + ' to ' + NU_MEAL_LABELS[meal] + '.');
      await refresh();
      loadRecentChips();
    } catch (e) {
      console.error('confirmAiAdd error:', e);
      showToast('Error adding — try again.');
      btn.disabled = false;
    }
  }

  /* ── refresh ─────────────────────────────────────────────────────── */
  async function refresh() {
    if (!currentUserId) return;
    currentLogs = await nuFetchLogs(currentUserId, currentDate);
    renderTotals();
    renderMeals();
    renderCopyYesterday();
  }

  // Shared modal calls this after a successful save/delete. Recents come from
  // logging history, so they refresh here too — no extra save action needed.
  window.onFoodSaved = async function () {
    await refresh();
    loadRecentChips();
  };

  window.addEventListener('load', function () {
    (async () => {
      try {
        var session = await requireAuth();
        currentUserId = session.user.id;
        currentProfile = await getProfile(currentUserId);

        document.getElementById('authGate').style.display   = 'none';
        document.getElementById('appContent').style.display = 'block';

        renderDateLabel();
        await refresh();
        loadMealChips();
        loadFavChips();
        loadRecentChips();
        lucide.createIcons();
      } catch (err) {
        console.error('Nutrition page error:', err);
        window.location.href = 'auth.html';
      }
    })();
  });
</script>
</body>
</html>
