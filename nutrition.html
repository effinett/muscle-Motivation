<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nutrition — Muscle Motivation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js" integrity="sha384-ouAVEJVCMsf8Svzn+BwqbaBhxBEA0xgeVBhHnxmWd+Wqyv18yhWCQwGegFD/OHLq" crossorigin="anonymous"></script>
  <style>
    :root {
      --red:         #B1121B;
      --red-muted:   rgba(177,18,27,0.12);
      --red-border:  rgba(177,18,27,0.28);
      --bg:          #080808;
      --surface-1:   #0d0d0d;
      --surface-2:   #131313;
      --surface-3:   #1a1a1a;
      --border-1:    #1c1c1c;
      --border-2:    #252525;
      --border-3:    #2f2f2f;
      --text:        #ffffff;
      --text-2:      #a0a0a0;
      --text-muted:  #555555;
      --green:       #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; overflow-x: hidden;
    }

    #authGate {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; min-height: 100vh;
    }
    #authGate img { width: 72px; margin-bottom: 16px; opacity: 0.6; }
    #authGate p { color: var(--text-muted); font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(8,8,8,0.97); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-1);
      padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between; height: 60px;
    }
    .header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .header-logo img { height: 42px; }
    .header-logo span {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      letter-spacing: 2.5px; color: var(--text); text-transform: uppercase;
    }
    .btn-back {
      padding: 6px 14px; font-size: 11px; font-family: 'Barlow', sans-serif;
      font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      background: transparent; border: 1px solid var(--border-2);
      color: var(--text-muted); border-radius: 6px; cursor: pointer;
      transition: border-color 0.2s, color 0.2s; text-decoration: none;
    }
    .btn-back:hover { border-color: var(--border-3); color: var(--text-2); }

    .container { max-width: 680px; margin: 0 auto; padding: 28px 16px 120px; }

    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 1.5px; }
    .page-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; margin-bottom: 8px; }

    .section-label {
      font-family: 'Barlow', sans-serif; font-size: 11px; font-weight: 700;
      letter-spacing: 2px; color: var(--red); text-transform: uppercase;
      margin-bottom: 12px; margin-top: 24px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border-1); }

    /* Date bar */
    .date-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-top: 16px;
    }
    .date-nav {
      width: 40px; height: 40px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface-1); border: 1px solid var(--border-2);
      border-radius: 9px; color: var(--text-2); cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .date-nav:hover:not(:disabled) { border-color: var(--border-3); color: var(--text); }
    .date-nav:disabled { opacity: 0.35; cursor: default; }
    .date-nav i { width: 18px; height: 18px; }
    .date-label {
      flex: 1; text-align: center;
      font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1.5px;
    }
    .date-label small { display: block; font-family: 'Barlow', sans-serif; font-size: 11px; letter-spacing: 0; color: var(--text-muted); font-weight: 600; }

    /* Totals card */
    .totals-card {
      background: var(--surface-1); border: 1px solid var(--border-2);
      border-radius: 12px; padding: 18px 18px 8px;
    }
    .total-row { margin-bottom: 14px; }
    .total-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
    .total-name { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-2); }
    .total-val { font-family: 'Barlow', sans-serif; font-size: 13px; color: var(--text); font-weight: 600; }
    .total-val small { color: var(--text-muted); font-weight: 500; }
    .bar-track { height: 7px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--red); border-radius: 4px; transition: width .3s ease; }
    .bar-fill.over { background: #e0a800; }
    .total-cals .total-name { color: var(--text); font-size: 13px; }
    .total-cals .bar-fill { background: var(--green); }
    .total-cals .bar-fill.over { background: #e0a800; }

    /* Meal sections */
    .meal-block { margin-bottom: 6px; }
    .meal-head {
      display: flex; align-items: center; justify-content: space-between;
      margin: 22px 0 8px;
    }
    .meal-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1.5px; }
    .meal-kcal { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .add-food-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; border: 1px solid var(--border-2);
      border-radius: 8px; color: var(--text-2); cursor: pointer;
      font-family: 'Barlow', sans-serif; font-size: 12px; font-weight: 700;
      letter-spacing: 0.5px; padding: 7px 12px; transition: border-color .2s, color .2s;
    }
    .add-food-btn:hover { border-color: var(--red-border); color: var(--text); }
    .add-food-btn i { width: 14px; height: 14px; }

    .food-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--surface-1); border: 1px solid var(--border-2);
      border-radius: 10px; padding: 11px 14px; margin-bottom: 7px; cursor: pointer;
      transition: border-color .2s;
    }
    .food-row:hover { border-color: var(--border-3); }
    .food-main { min-width: 0; }
    .food-name { font-size: 14px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .food-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .food-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .food-cals { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; }
    .food-cals small { font-family: 'Barlow', sans-serif; font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .meal-empty {
      font-size: 12px; color: var(--text-muted);
      padding: 10px 14px; border: 1px dashed var(--border-2); border-radius: 10px;
    }

    .no-target-note { font-size: 12px; color: var(--text-muted); padding: 4px 2px 14px; }

    /* Quick add: Recent + Favorites chip rows (same chip look as the modal) */
    .qa-chips {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .qa-chips::-webkit-scrollbar { height: 0; }
    .qa-chips .nu-chip { min-height: 40px; }   /* thumb-friendly page targets */
    .qa-empty { font-size: 12px; color: var(--text-muted); padding: 2px 2px 6px; }

    /* ── Shared modal (mirrors app.html / weight-history.html) ─────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.82); backdrop-filter: blur(6px);
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--surface-1); border: 1px solid var(--border-2);
      border-radius: 14px; padding: 28px 24px; width: 100%; max-width: 440px;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1.5px; flex: 1; }
    /* Favorite star (modal header, form view only) — ☆ not saved / ★ saved */
    .nu-fav {
      background: none; border: none; cursor: pointer;
      font-size: 22px; line-height: 1; padding: 4px 6px;
      color: var(--text-muted); transition: color .2s;
    }
    .nu-fav:hover { color: var(--text-2); }
    .nu-fav.on { color: var(--red); }
    .modal-close {
      background: none; border: none; color: var(--text-muted);
      font-size: 18px; cursor: pointer; padding: 4px 8px; transition: color 0.2s;
    }
    .modal-close:hover { color: var(--text); }
    .field-group { margin-bottom: 14px; }
    .field-label {
      display: block; font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 6px;
    }
    .field-group input, .field-group select {
      width: 100%; padding: 10px 12px;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 8px; color: var(--text);
      font-family: 'Barlow', sans-serif; font-size: 14px;
      appearance: none; outline: none; transition: border-color 0.2s;
    }
    .field-group input:focus, .field-group select:focus { border-color: var(--red); }
    /* two- and four-up rows inside the modal */
    .nu-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .nu-row.nu-row-4 { grid-template-columns: repeat(2, 1fr); }
    .nu-row .field-group { margin-bottom: 14px; }
    .field-hint { font-size: 11px; color: var(--text-muted); margin: -4px 0 12px; }
    /* recent / saved foods quick-add */
    .nu-recent { margin-bottom: 18px; }
    .nu-recent-label {
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px;
    }
    .nu-recent-chips {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .nu-recent-chips::-webkit-scrollbar { height: 0; }
    .nu-chip {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px;
      max-width: 220px; padding: 7px 13px; cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 999px; color: var(--text);
      font-family: 'Barlow', sans-serif; transition: border-color .2s, background .2s;
    }
    .nu-chip:hover { border-color: var(--red-border); background: var(--surface-3); }
    .nu-chip-name {
      font-size: 13px; font-weight: 600; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .nu-chip-more { color: var(--text-2); border-style: dashed; }
    .nu-chip-more:hover { color: var(--text); }
    /* back button (shown only in the Saved Foods search view) */
    .nu-back {
      background: none; border: none; color: var(--text-muted);
      font-size: 20px; line-height: 1; cursor: pointer; padding: 0 10px 0 0;
      transition: color .2s;
    }
    .nu-back:hover { color: var(--text); }
    /* Saved Foods search panel */
    .nu-search-input {
      width: 100%; padding: 11px 12px; margin-bottom: 12px;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 8px; color: var(--text);
      font-family: 'Barlow', sans-serif; font-size: 14px; outline: none;
      transition: border-color .2s;
    }
    .nu-search-input:focus { border-color: var(--red); }
    .nu-saved-list { display: flex; flex-direction: column; gap: 7px; max-height: 46vh; overflow-y: auto; }
    .nu-saved-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      width: 100%; text-align: left; cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 10px; padding: 11px 14px; transition: border-color .2s;
    }
    .nu-saved-row:hover { border-color: var(--red-border); }
    .nu-saved-name {
      font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .nu-saved-cal {
      font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 0.5px;
      color: var(--text-2); flex-shrink: 0;
    }
    .nu-search-empty { font-size: 12px; color: var(--text-muted); padding: 10px 2px; }
    /* USDA food-database search */
    .nu-dbsearch {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 12px 14px; margin-bottom: 18px; cursor: pointer; text-align: left;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 10px; color: var(--text);
      font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 600;
      transition: border-color .2s, background .2s;
    }
    .nu-dbsearch:hover { border-color: var(--red-border); background: var(--surface-3); }
    .nu-dbsearch-ico { font-size: 15px; line-height: 1; }
    .nu-usda-status {
      display: none; font-size: 12px; color: var(--text-muted);
      padding: 8px 2px 10px;
    }
    .nu-usda-status.loading { color: var(--text-2); }
    .nu-usda-status.error { color: var(--red); }
    .nu-usda-list { display: flex; flex-direction: column; gap: 7px; max-height: 50vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .nu-usda-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      width: 100%; text-align: left; cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 10px; padding: 11px 14px; transition: border-color .2s;
    }
    .nu-usda-row:hover { border-color: var(--red-border); }
    .nu-usda-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .nu-usda-name {
      font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .nu-usda-sub {
      font-size: 11px; color: var(--text-muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .nu-usda-macros { font-size: 11px; color: var(--text-2); margin-top: 1px; }
    .nu-usda-cals {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.5px;
      color: var(--text); flex-shrink: 0; text-align: right; line-height: 1;
    }
    .nu-usda-cals small {
      display: block; font-family: 'Barlow', sans-serif; font-size: 9px;
      font-weight: 700; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase;
    }
    .nu-verified-sm { color: var(--green); font-weight: 700; white-space: nowrap; }
    .nu-usda-group {
      font-family: 'Barlow', sans-serif; font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-2);
      margin: 14px 2px 8px; display: flex; align-items: center; gap: 8px;
    }
    .nu-usda-group:first-child { margin-top: 2px; }
    .nu-usda-group::after { content: ''; flex: 1; height: 1px; background: var(--border-1); }
    .nu-usda-manual {
      display: block; width: 100%; margin-top: 14px; padding: 11px;
      background: transparent; border: 1px dashed var(--border-2); border-radius: 8px;
      color: var(--text-2); cursor: pointer;
      font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 600;
      transition: border-color .2s, color .2s;
    }
    .nu-usda-manual:hover { border-color: var(--red-border); color: var(--text); }
    /* ── Barcode scanner (Phase 3.2) ───────────────────────────────────── */
    .nu-scan-btn { margin-bottom: 4px; }
    .nu-scan-frame {
      position: relative; width: 100%; aspect-ratio: 4 / 3;
      background: #000; border: 1px solid var(--border-2);
      border-radius: 12px; overflow: hidden; margin-bottom: 10px;
    }
    .nu-scan-frame video {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    }
    .nu-scan-status {
      font-size: 12px; color: var(--text-2); text-align: center;
      min-height: 18px; padding: 2px 2px 10px;
    }
    .nu-scan-status.loading { color: var(--text-2); }
    .nu-scan-status.error { color: var(--red); }
    .nu-scan-manual { margin-top: 14px; }
    .nu-scan-manual-row { display: flex; gap: 8px; }
    .nu-scan-manual-row input { flex: 1; min-width: 0; font-size: 16px; }
    .nu-scan-lookup {
      flex-shrink: 0; padding: 0 18px; cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 8px; color: var(--text);
      font-family: 'Barlow', sans-serif; font-size: 12px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      transition: border-color .2s, background .2s;
    }
    .nu-scan-lookup:hover { border-color: var(--red-border); background: var(--surface-3); }
    /* ── USDA selected-food card (Phase 3.1.2) ─────────────────────────── */
    /* Card header: food name + brand + verified badge */
    .nu-card-header { margin-bottom: 18px; }
    .nu-card-name {
      font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 0.5px;
      line-height: 1.1; color: var(--text);
    }
    .nu-card-meta { display: flex; align-items: center; gap: 8px; margin-top: 7px; flex-wrap: wrap; }
    .nu-card-brand {
      font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      color: var(--text-2);
    }
    .nu-verified {
      font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
      color: var(--green); border: 1px solid rgba(34,197,94,0.35);
      background: rgba(34,197,94,0.10); padding: 2px 8px; border-radius: 999px;
    }
    /* Serving dropdown + optional custom-grams input (16px font avoids iOS zoom) */
    #nuServingSelect, .nu-custom-grams { font-size: 16px; }
    .nu-custom-grams { margin-top: 8px; }
    /* Quantity stepper — thumb-friendly ± buttons around the input */
    .nu-stepper { display: flex; align-items: stretch; gap: 8px; }
    .nu-step {
      flex: 0 0 46px; min-height: 46px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 8px; color: var(--text); font-size: 24px; line-height: 1;
      cursor: pointer; user-select: none; transition: border-color .2s, background .2s;
    }
    .nu-step:hover { border-color: var(--red-border); background: var(--surface-3); }
    .nu-step:active { background: var(--surface-3); }
    .nu-stepper input {
      flex: 1; min-width: 0; text-align: center;
      padding: 10px 8px; font-size: 16px;
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 8px; color: var(--text);
      font-family: 'Barlow', sans-serif; outline: none; appearance: none;
      transition: border-color .2s;
    }
    .nu-stepper input:focus { border-color: var(--red); }
    /* Live nutrition card (chosen serving × quantity) */
    .nu-readout {
      margin: 8px 0 16px; padding: 14px 8px;
      background: var(--surface-1); border: 1px solid var(--border-2); border-radius: 12px;
    }
    .nu-readout-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .nu-readout-cell { text-align: center; min-width: 0; }
    .nu-readout-num {
      font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.5px;
      line-height: 1; color: var(--text);
    }
    .nu-readout-cell.cal .nu-readout-num { color: var(--green); }
    .nu-readout-lab {
      font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
      color: var(--text-muted); margin-top: 5px;
    }
    /* Quieter second row inside the card: fiber + sugar (never competes with macros) */
    .nu-readout-divider { height: 1px; background: var(--border-2); margin: 12px 6px; }
    .nu-readout-row-2 { grid-template-columns: repeat(2, 1fr); }
    .nu-readout-cell-sm .nu-readout-num { font-size: 17px; color: var(--text-2); }
    .nu-readout-cell-sm .nu-readout-lab { font-size: 9px; letter-spacing: 0.5px; }
    /* Manual-entry small live total (per-serving inputs) */
    .nu-total-preview {
      font-family: 'Barlow', sans-serif; font-size: 13px; color: var(--text-2);
      text-align: center; margin: 4px 0 4px; min-height: 18px;
    }
    .nu-total-preview strong { color: var(--green); font-weight: 700; }
    .btn-calc {
      width: 100%; margin-top: 8px; padding: 12px;
      background: var(--red); border: none; border-radius: 8px;
      color: white; font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; letter-spacing: 2px; cursor: pointer; transition: opacity 0.2s;
    }
    .btn-calc:hover { opacity: 0.85; }
    .btn-calc:disabled { opacity: 0.5; cursor: default; }
    .btn-delete-log {
      width: 100%; margin-top: 10px; padding: 11px;
      background: transparent; border: 1px solid var(--border-2); border-radius: 8px;
      color: var(--text-muted); font-family: 'Barlow', sans-serif; font-weight: 700;
      font-size: 12px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .btn-delete-log:hover { border-color: var(--red); color: var(--red); }

    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface-2); border: 1px solid var(--border-3);
      color: var(--text); padding: 12px 24px; border-radius: 8px;
      font-size: 14px; font-weight: 600;
      transition: transform 0.35s ease, opacity 0.35s ease;
      opacity: 0; z-index: 999; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (max-width: 480px) {
      header { padding: 0 14px; }
      .header-logo span { display: none; }
      .container { padding: 20px 12px 120px; }
      .nu-row.nu-row-4 { grid-template-columns: repeat(2, 1fr); }
      /* Keep the 4-up readout from overflowing on narrow phones */
      .nu-readout { padding: 14px 4px; }
      .nu-readout-row { gap: 4px; }
      .nu-readout-num { font-size: 22px; }
      .nu-readout-cell-sm .nu-readout-num { font-size: 16px; }
      .nu-readout-lab { font-size: 9px; letter-spacing: 0.5px; }
    }
  </style>
  <link rel="stylesheet" href="safe-area.css">
</head>
<body>

<div id="authGate">
  <img src="logow.png" alt="Muscle Motivation">
  <p>Loading...</p>
</div>

<div id="appContent" style="display:none;">
  <header>
    <a class="header-logo" href="app.html">
      <img src="logow.png" alt="Muscle Motivation">
      <span>Muscle Motivation</span>
    </a>
    <a class="btn-back" href="app.html">← Dashboard</a>
  </header>

  <div class="container">
    <div class="page-title">Nutrition</div>
    <div class="page-sub">Log what you eat. Hit your targets, stay consistent.</div>

    <!-- Date navigator -->
    <div class="date-bar">
      <button class="date-nav" id="datePrev" onclick="shiftDate(-1)" title="Previous day"><i data-lucide="chevron-left"></i></button>
      <div class="date-label" id="dateLabel">Today</div>
      <button class="date-nav" id="dateNext" onclick="shiftDate(1)" title="Next day"><i data-lucide="chevron-right"></i></button>
    </div>

    <!-- Daily totals -->
    <div class="section-label">Daily Totals</div>
    <div id="totalsWrap"></div>

    <!-- Quick add: recently logged + favorited foods -->
    <div class="section-label">Recent</div>
    <div class="qa-chips" id="recentChips"><div class="qa-empty">Loading&hellip;</div></div>
    <div class="section-label">Favorites</div>
    <div class="qa-chips" id="favChips"><div class="qa-empty">Loading&hellip;</div></div>

    <!-- Meals -->
    <div id="mealsWrap"></div>
  </div>
</div>

<!-- Add / Edit Food Modal (markup injected by nutrition.js) -->
<div id="foodModalMount"></div>

<div class="toast" id="toast"></div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js" integrity="sha384-3wY11tldQ5+yWqAvmTN4XtQvnjoTva0cV15O/O/O5NTtp0ivVopSzLOzsVXWZse9" crossorigin="anonymous"></script>
<script src="supabase.js"></script>
<script src="nutrition.js"></script>
<script>
  var currentUserId = null;
  var currentProfile = null;
  var currentDate = nuToday();
  var currentLogs = [];

  document.getElementById('foodModalMount').innerHTML = nuModalMarkup();

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 3000);
  }

  /* ── date navigation ─────────────────────────────────────────────── */
  function shiftDate(days) {
    var d = nuParseDate(currentDate);
    d.setDate(d.getDate() + days);
    var iso = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    if (iso > nuToday()) return; // no future days
    currentDate = iso;
    renderDateLabel();
    refresh();
  }

  function renderDateLabel() {
    var label = currentDate === nuToday() ? 'Today' : nuFmtDateLong(currentDate);
    var sub = nuParseDate(currentDate).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    document.getElementById('dateLabel').innerHTML = label + '<small>' + nuEsc(sub) + '</small>';
    document.getElementById('dateNext').disabled = (currentDate >= nuToday());
  }

  /* ── totals card ─────────────────────────────────────────────────── */
  function totalRow(name, consumed, target, unit, isCals) {
    var c = Math.round(consumed * 10) / 10;
    var pct = target ? Math.min(100, Math.round(consumed / target * 100)) : 0;
    var over = target && consumed > target;
    var valHTML = target
      ? c + ' <small>/ ' + target + (unit ? ' ' + unit : '') + '</small>'
      : c + (unit ? ' ' + unit : '');
    return '<div class="total-row ' + (isCals ? 'total-cals' : '') + '">' +
      '<div class="total-head">' +
        '<span class="total-name">' + name + '</span>' +
        '<span class="total-val">' + valHTML + '</span>' +
      '</div>' +
      '<div class="bar-track"><div class="bar-fill ' + (over ? 'over' : '') + '" style="width:' + pct + '%"></div></div>' +
    '</div>';
  }

  function renderTotals() {
    var t = nuDayTotals(currentLogs);
    var p = currentProfile || {};
    var hasTargets = !!(p.target_calories || p.protein_target || p.carb_target || p.fat_target);

    var html = '<div class="totals-card">' +
      totalRow('Calories', t.calories, p.target_calories || 0, 'kcal', true) +
      totalRow('Protein',  t.protein,  p.protein_target || 0, 'g', false) +
      totalRow('Carbs',    t.carbs,    p.carb_target || 0, 'g', false) +
      totalRow('Fat',      t.fat,      p.fat_target || 0, 'g', false) +
    '</div>';
    if (!hasTargets) {
      html += '<div class="no-target-note">Set your calorie & macro targets on the dashboard (Recalculate Goals) to track progress.</div>';
    }
    document.getElementById('totalsWrap').innerHTML = html;
  }

  /* ── meal sections ───────────────────────────────────────────────── */
  function renderMeals() {
    var wrap = document.getElementById('mealsWrap');
    var html = NU_MEALS.map(function (meal) {
      var rows = currentLogs.filter(function (l) { return l.meal === meal; });
      var kcal = rows.reduce(function (s, l) { return s + (+l.calories || 0); }, 0);
      var inner;
      if (rows.length === 0) {
        inner = '<div class="meal-empty">Nothing logged.</div>';
      } else {
        inner = rows.map(function (l) {
          var sv = (+l.servings === 1) ? '' : (nuRound1(l.servings) + '× · ');
          var macros = 'P ' + nuRound(l.protein) + ' · C ' + nuRound(l.carbs) + ' · F ' + nuRound(l.fat);
          return '<div class="food-row" data-id="' + l.id + '" onclick="editEntry(this)">' +
            '<div class="food-main">' +
              '<div class="food-name">' + nuEsc(l.name) + '</div>' +
              '<div class="food-sub">' + sv + macros + '</div>' +
            '</div>' +
            '<div class="food-right">' +
              '<div class="food-cals">' + nuRound(l.calories) + ' <small>kcal</small></div>' +
            '</div>' +
          '</div>';
        }).join('');
      }
      return '<div class="meal-block">' +
        '<div class="meal-head">' +
          '<div><span class="meal-title">' + NU_MEAL_LABELS[meal] + '</span>' +
            (kcal ? ' <span class="meal-kcal">' + nuRound(kcal) + ' kcal</span>' : '') + '</div>' +
          '<button class="add-food-btn" onclick="addToMeal(\'' + meal + '\')"><i data-lucide="plus"></i> Add food</button>' +
        '</div>' +
        inner +
      '</div>';
    }).join('');
    wrap.innerHTML = html;
    lucide.createIcons();
  }

  function addToMeal(meal) {
    nuOpenModal({ meal: meal, date: currentDate });
  }

  /* ── quick add: Recent + Favorites chips (Phase 3.3) ─────────────── */
  var recentItems = [];   // per-serving items for nuOpenModalWithFood
  var favItems = [];

  // Chips carry no meal context — suggest one from the time of day (still
  // editable in the form before saving).
  function suggestMeal() {
    var h = new Date().getHours();
    if (h < 11) return 'breakfast';
    if (h < 15) return 'lunch';
    if (h < 21) return 'dinner';
    return 'snack';
  }

  function renderChips(elId, items, pickFn, emptyMsg) {
    var el = document.getElementById(elId);
    if (!el) return;
    if (!items.length) {
      el.innerHTML = '<div class="qa-empty">' + emptyMsg + '</div>';
      return;
    }
    el.innerHTML = items.map(function (it, i) {
      // Name-only chips (matches the modal's saved-food chips). The kcal shown
      // here was per-serving and could mismatch what the user remembers logging
      // (fractional servings) — exact macros appear in the card on tap anyway.
      // Title/aria still carry the full name + calories.
      var full = nuEsc(it.name);
      return '<button type="button" class="nu-chip" title="' + full + '"' +
          ' aria-label="' + full + ', ' + nuRound(it.calories) + ' calories"' +
          ' onclick="' + pickFn + '(' + i + ')">' +
          '<span class="nu-chip-name">' + nuEsc(nuShortLabel(it.name)) + '</span>' +
        '</button>';
    }).join('');
  }

  async function loadRecentChips() {
    recentItems = await nuFetchRecentLogged(currentUserId, 10);
    renderChips('recentChips', recentItems, 'pickRecent', 'No recent foods yet.');
  }

  async function loadFavChips() {
    var favs = await nuLoadFavorites();
    favItems = favs.map(function (f) {
      return {
        name: f.food_name,
        calories: +f.calories  || 0, protein: +f.protein_g || 0,
        carbs:    +f.carbs_g   || 0, fat:     +f.fat_g     || 0,
        raw_food: f.raw_food || null,
        // USDA identity — keeps the star on 'usda:<fdcId>' even when the
        // favorite has no raw payload and opens the plain form.
        usda_fdc_id: f.fdc_id != null ? f.fdc_id : null,
        brand: f.brand_name || null, gtin_upc: f.gtin_upc || null,
        serving_unit: f.serving_unit || null,
        serving_amount: f.serving_qty != null ? f.serving_qty : null,
      };
    });
    renderChips('favChips', favItems, 'pickFav',
      'No favorites yet — tap ☆ while logging a food to save it here.');
  }

  function pickRecent(i) {
    if (recentItems[i]) nuOpenModalWithFood(recentItems[i], { date: currentDate, meal: suggestMeal() });
  }
  function pickFav(i) {
    if (favItems[i]) nuOpenModalWithFood(favItems[i], { date: currentDate, meal: suggestMeal() });
  }

  // Star toggled inside the modal → nu_favorites cache is already updated.
  window.onFavoritesChanged = loadFavChips;

  function editEntry(el) {
    var id = el.getAttribute('data-id');
    var log = currentLogs.filter(function (l) { return l.id === id; })[0];
    if (log) {
      nuOpenModal({
        id: log.id, name: log.name, meal: log.meal, servings: log.servings,
        date: currentDate,
        calories: log.calories, protein: log.protein, carbs: log.carbs, fat: log.fat,
        // USDA identity — lets the favorite star keep 'usda:<fdcId>' in edit mode
        source: log.source, usda_fdc_id: log.usda_fdc_id, brand: log.brand,
        gtin_upc: log.gtin_upc, serving_amount: log.serving_amount, serving_unit: log.serving_unit,
      });
    }
  }

  /* ── refresh ─────────────────────────────────────────────────────── */
  async function refresh() {
    if (!currentUserId) return;
    currentLogs = await nuFetchLogs(currentUserId, currentDate);
    renderTotals();
    renderMeals();
  }

  // Shared modal calls this after a successful save/delete. Recents come from
  // logging history, so they refresh here too — no extra save action needed.
  window.onFoodSaved = async function () {
    await refresh();
    loadRecentChips();
  };

  window.addEventListener('load', function () {
    (async () => {
      try {
        var session = await requireAuth();
        currentUserId = session.user.id;
        currentProfile = await getProfile(currentUserId);

        document.getElementById('authGate').style.display   = 'none';
        document.getElementById('appContent').style.display = 'block';

        renderDateLabel();
        await refresh();
        loadRecentChips();
        loadFavChips();
        lucide.createIcons();
      } catch (err) {
        console.error('Nutrition page error:', err);
        window.location.href = 'auth.html';
      }
    })();
  });
</script>
</body>
</html>
