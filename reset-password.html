<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Muscle Motivation | Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --red:#B1121B; --red-dim:#D11D27; --black:#080808;
    --surface:#0d0d0d; --card:#131313; --border:#252525;
    --white:#fff; --grey:#a0a0a0;
    --font-display:'Bebas Neue',Impact,sans-serif;
    --font-body:'Barlow',Arial,sans-serif;
    --radius:10px; --transition:0.22s ease;
  }
  html { scroll-behavior:smooth; }
  body {
    background:var(--black); color:var(--white);
    font-family:var(--font-body); min-height:100vh;
    display:flex; flex-direction:column;
  }
  main {
    flex:1; display:flex; align-items:center;
    justify-content:center; padding:48px 20px;
    position:relative; overflow:hidden;
  }
  main::before {
    content:''; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(177,18,27,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(177,18,27,0.04) 1px, transparent 1px);
    background-size:50px 50px; pointer-events:none;
  }
  main::after {
    content:''; position:absolute; top:-100px; left:50%;
    transform:translateX(-50%);
    width:600px; height:400px;
    background:radial-gradient(ellipse, rgba(177,18,27,0.1) 0%, transparent 70%);
    pointer-events:none;
  }
  .auth-wrapper {
    display:flex; flex-direction:column;
    align-items:center; width:100%; max-width:440px;
    position:relative; z-index:1;
  }
  .auth-branding {
    display:flex; flex-direction:column;
    align-items:center; gap:10px;
    margin-bottom:28px; text-align:center;
  }
  .auth-branding img { height:80px; width:auto; display:block; }
  .auth-branding .brand-name {
    font-family:var(--font-display);
    font-size:26px; letter-spacing:4px;
    text-transform:uppercase; color:var(--white); line-height:1;
  }
  .auth-branding .brand-sub {
    font-family:var(--font-display);
    font-size:13px; letter-spacing:3px;
    text-transform:uppercase; color:var(--red); line-height:1;
  }
  .auth-box {
    background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:36px 36px 32px; width:100%;
  }
  .auth-title {
    font-family:var(--font-display); font-size:24px;
    letter-spacing:2px; text-transform:uppercase;
    margin-bottom:6px;
  }
  .auth-intro { font-size:14px; color:var(--grey); margin-bottom:22px; line-height:1.5; }

  .password-wrap { position:relative; }
  .password-wrap input { width:100%; padding-right:70px; }
  .toggle-password {
    position:absolute; right:14px; top:50%;
    transform:translateY(-50%); background:transparent;
    border:none; color:var(--red); font-weight:700; cursor:pointer;
  }

  /* Live new-password requirements checklist */
  .pw-reqs { list-style:none; margin:10px 0 0; padding:0; }
  .pw-reqs li {
    position:relative; padding-left:20px; margin:3px 0;
    font-size:12px; color:var(--grey); line-height:1.6;
    transition:color var(--transition);
  }
  .pw-reqs li::before {
    content:'○'; position:absolute; left:0; font-size:11px; color:var(--grey);
  }
  .pw-reqs li.met { color:#4dff9e; }
  .pw-reqs li.met::before { content:'✓'; color:#4dff9e; }
  .pw-reqs li.optional { color:#6f6f6f; }

  .form-group { margin-bottom:16px; }
  .form-group label {
    display:block; font-size:11px; font-weight:700;
    letter-spacing:1px; text-transform:uppercase;
    color:var(--grey); margin-bottom:6px;
  }
  .form-group input {
    width:100%; padding:13px 16px;
    background:#1c1c1c; border:1px solid var(--border);
    border-radius:8px; color:var(--white);
    font-family:var(--font-body); font-size:15px;
    outline:none; transition:border-color var(--transition);
  }
  .form-group input:focus { border-color:var(--red); }
  .form-group input::placeholder { color:#555; }

  .btn-primary {
    width:100%; padding:15px;
    background:var(--red); border:2px solid var(--red);
    border-radius:var(--radius); color:var(--white);
    font-family:var(--font-body); font-size:15px;
    font-weight:700; letter-spacing:0.8px;
    text-transform:uppercase; cursor:pointer;
    transition:background var(--transition), transform var(--transition), box-shadow var(--transition);
    margin-top:8px;
  }
  .btn-primary:hover {
    background:var(--red-dim); border-color:var(--red-dim);
    transform:translateY(-2px); box-shadow:0 8px 24px rgba(177,18,27,0.35);
  }
  .btn-primary:disabled { opacity:0.6; cursor:not-allowed; transform:none; }

  .msg {
    padding:12px 16px; border-radius:8px;
    font-size:14px; margin-bottom:16px; display:none;
  }
  .msg.error   { background:rgba(177,18,27,0.12); border:1px solid rgba(177,18,27,0.3); color:#ff6666; }
  .msg.success { background:rgba(0,200,100,0.1); border:1px solid rgba(0,200,100,0.3); color:#4dff9e; }
  .msg.show    { display:block; }

  .auth-footer { text-align:center; margin-top:20px; font-size:13px; color:var(--grey); }
  .auth-footer a { color:var(--red); font-weight:600; text-decoration:none; }
  .auth-footer a:hover { text-decoration:underline; }

  .spinner {
    width:18px; height:18px; border:2px solid rgba(255,255,255,0.3);
    border-top-color:white; border-radius:50%;
    animation:spin 0.7s linear infinite;
    display:inline-block; vertical-align:middle; margin-right:8px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .back-link {
    margin-top:20px; color:#555; font-size:13px;
    text-decoration:none; letter-spacing:0.5px;
    transition:color var(--transition);
  }
  .back-link:hover { color:var(--red); }

  footer {
    text-align:center; padding:20px;
    border-top:1px solid var(--border);
    color:#444; font-size:12px;
  }

  @media (max-width:480px) {
    .auth-box { padding:28px 20px; }
    .auth-branding img { height:64px; }
    .auth-branding .brand-name { font-size:22px; }
  }
</style>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#121011">
  <meta name="application-name" content="Muscle Motivation">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Muscle Motivation">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="safe-area.css">
</head>
<body>

<main>
  <div class="auth-wrapper">

    <div class="auth-branding">
      <img src="logow.png" alt="Muscle Motivation Logo">
      <div class="brand-name">Muscle Motivation</div>
      <div class="brand-sub">Reset Password</div>
    </div>

    <div class="auth-box">
      <div class="auth-title">Set a new password</div>
      <div class="auth-intro" id="introText">Verifying your reset link…</div>

      <div class="msg" id="resetMsg"></div>

      <!-- Reset form (revealed once a recovery session is confirmed) -->
      <div id="resetForm" style="display:none;">
        <div class="form-group">
          <label>New Password</label>
          <div class="password-wrap">
            <input type="password" id="newPassword" placeholder="Min. 10 characters" autocomplete="new-password" oninput="updatePasswordReqs()">
            <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)">Show</button>
          </div>
          <ul class="pw-reqs" id="pwReqs" aria-live="polite">
            <li id="pwreq-len">At least 10 characters</li>
            <li id="pwreq-upper">One uppercase letter</li>
            <li id="pwreq-lower">One lowercase letter</li>
            <li id="pwreq-num">One number</li>
            <li id="pwreq-sym" class="optional">One symbol (optional)</li>
          </ul>
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <div class="password-wrap">
            <input type="password" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password">
            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">Show</button>
          </div>
        </div>
        <button class="btn-primary" id="resetBtn" onclick="handleReset()">Update Password</button>
      </div>

      <!-- Invalid/expired link state -->
      <div id="invalidState" style="display:none;">
        <p class="auth-footer" style="margin-top:0;">
          <a href="auth.html">← Request a new reset link</a>
        </p>
      </div>
    </div>

    <a href="auth.html" class="back-link">← Back to sign in</a>

  </div>
</main>

<footer>© 2026 Muscle Motivation. All rights reserved.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js" integrity="sha384-3wY11tldQ5+yWqAvmTN4XtQvnjoTva0cV15O/O/O5NTtp0ivVopSzLOzsVXWZse9" crossorigin="anonymous"></script>
<script src="supabase.js"></script>
<script>

  var recoveryReady = false;

  function showMsg(text, type) {
    var el = document.getElementById('resetMsg');
    el.textContent = text;
    el.className = 'msg ' + (type || 'error') + ' show';
  }
  function clearMsg() { document.getElementById('resetMsg').className = 'msg'; }

  function setLoading(loading) {
    var btn = document.getElementById('resetBtn');
    btn.disabled = loading;
    btn.innerHTML = loading ? '<span class="spinner"></span>Updating…' : 'Update Password';
  }

  function showForm() {
    if (recoveryReady) return;
    recoveryReady = true;
    document.getElementById('introText').textContent = 'Choose a new password for your account.';
    document.getElementById('resetForm').style.display = 'block';
    document.getElementById('invalidState').style.display = 'none';
  }

  function showInvalid() {
    if (recoveryReady) return; // a valid session already arrived
    document.getElementById('introText').textContent =
      'This reset link is invalid or has expired. Reset links can only be used once and time out for security.';
    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('invalidState').style.display = 'block';
  }

  // Supabase (detectSessionInUrl defaults to true) parses the recovery token
  // from the URL and fires PASSWORD_RECOVERY once the session is established.
  window.addEventListener('load', function() {
    if (!supabaseClient) { showInvalid(); return; }

    supabaseClient.auth.onAuthStateChange(function(event, session) {
      if (event === 'PASSWORD_RECOVERY' || (session && event === 'SIGNED_IN')) {
        showForm();
      }
    });

    // Fallback: if the token was already exchanged before our listener attached,
    // a session will already exist. Give the URL parser a moment, then check.
    setTimeout(function() {
      getSession().then(function(session) {
        if (session) showForm(); else showInvalid();
      });
    }, 1200);
  });

  // Password policy — enforced client-side, same rules as auth.html signup.
  // Required: at least 10 chars, one uppercase, one lowercase, one number.
  // A symbol is encouraged but OPTIONAL. Returns a user-friendly error string,
  // or null when the password is acceptable.
  function passwordPolicyError(pw) {
    if (pw.length < 10)         return 'Password must be at least 10 characters.';
    if (!/[a-z]/.test(pw))      return 'Password must include a lowercase letter.';
    if (!/[A-Z]/.test(pw))      return 'Password must include an uppercase letter.';
    if (!/[0-9]/.test(pw))      return 'Password must include a number.';
    return null;
  }

  // Live validation — reflects each rule's met/unmet state as the user types
  // (bound to the new-password field's oninput). The symbol row is optional, so
  // it lights up as a bonus but never blocks submission.
  function updatePasswordReqs() {
    var pw = document.getElementById('newPassword').value;
    var checks = {
      len:   pw.length >= 10,
      upper: /[A-Z]/.test(pw),
      lower: /[a-z]/.test(pw),
      num:   /[0-9]/.test(pw),
      sym:   /[^A-Za-z0-9]/.test(pw),
    };
    Object.keys(checks).forEach(function (k) {
      var el = document.getElementById('pwreq-' + k);
      if (el) el.classList.toggle('met', checks[k]);
    });
  }

  async function handleReset() {
    var pw1 = document.getElementById('newPassword').value;
    var pw2 = document.getElementById('confirmPassword').value;
    if (!pw1 || !pw2) return showMsg('Please fill in both fields.');
    var pwErr = passwordPolicyError(pw1);
    if (pwErr)          return showMsg(pwErr);
    if (pw1 !== pw2)     return showMsg('Passwords do not match.');

    setLoading(true);
    clearMsg();
    try {
      var res = await supabaseClient.auth.updateUser({ password: pw1 });
      if (res.error) throw res.error;
      showMsg('Password updated! Taking you to your dashboard…', 'success');
      // The recovery session is now a full session — route like a normal login.
      var session = await getSession();
      var profile = session ? await getProfile(session.user.id) : null;
      setTimeout(function() {
        window.location.replace((profile && profile.onboarding_complete) ? 'app.html' : 'onboarding.html');
      }, 1200);
    } catch (e) {
      showMsg(e.message || 'Could not update password. Try the reset link again.');
      setLoading(false);
    }
  }

  function togglePassword(inputId, button) {
    var input = document.getElementById(inputId);
    if (input.type === 'password') { input.type = 'text'; button.textContent = 'Hide'; }
    else { input.type = 'password'; button.textContent = 'Show'; }
  }

</script>
</body>
</html>
